# Đẩy máy chủ elevaTO AI BCTC lên Cloudflare Workers mỗi khi thư mục ai/worker đổi.
# Nhờ workflow này mà không phải copy paste code vào đâu nữa — cứ push là máy chủ tự cập nhật.
#
# Cần hai secret trong repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token có quyền "Edit Cloudflare Workers" + "D1 Edit"
#   CLOUDFLARE_ACCOUNT_ID  Account ID thấy ở trang chủ Cloudflare
# Cơ sở dữ liệu D1 workflow tự tạo ở lần chạy đầu, không phải lập tay.
# Xem ai/worker/README.md để biết cách lấy.

name: Máy chủ AI (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'ai/worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # để tự ghi địa chỉ máy chủ vào ai/js/config.js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Tìm (hoặc tạo) cơ sở dữ liệu D1 rồi điền database_id vào wrangler.toml — để người cài
      # không phải vào dashboard tạo tay rồi chép ID. Có rồi thì dùng lại, không tạo thêm.
      - name: Chuẩn bị cơ sở dữ liệu D1
        run: node ai/worker/tools/d1-id.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Tạo / cập nhật các bảng. Lược đồ viết kiểu CREATE TABLE IF NOT EXISTS nên chạy lại vô hại.
      - name: Dựng bảng D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai/worker
          command: d1 execute elevato --remote --yes --file=schema.sql

      - name: Triển khai Worker
        id: trien_khai
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai/worker
          command: deploy

      # Điền địa chỉ vừa triển khai vào ai/js/config.js — bước thủ công cuối cùng, nay bỏ nốt.
      # Workflow này chỉ chạy khi ai/worker/** đổi, nên commit vào js/config.js không gọi lại chính nó.
      - name: Trỏ trang web sang máy chủ vừa triển khai
        env:
          URL: ${{ steps.trien_khai.outputs.deployment-url }}
          RA: ${{ steps.trien_khai.outputs.command-output }}
        run: |
          # Triển khai đã xong rồi: không lấy được địa chỉ thì cảnh báo chứ đừng báo đỏ cả lượt chạy.
          KQ=$(node ai/worker/tools/config-url.mjs "${URL:-$RA}") || {
            echo "::warning::Không đọc được địa chỉ máy chủ từ wrangler — sửa tay ai/js/config.js."
            exit 0
          }
          echo "$KQ"
          case "$KQ" in
            DOI*)
              git config user.name  'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              git add ai/js/config.js
              git commit -m "chore: trỏ trang web sang máy chủ ${KQ#DOI } [skip ci]"
              git push || {
                echo "::warning::Không đẩy được commit (nhánh có thể đang được bảo vệ)."
                echo "::warning::Sửa tay ai/js/config.js thành: ${KQ#DOI }"
              } ;;
          esac
