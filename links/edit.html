<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https://elevato.minhtoantowork.workers.dev https://script.google.com https://script.googleusercontent.com https://api.github.com https://api.iconify.design; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sửa trang link · elevaTO</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../ai/vendor/fonts/be-vietnam-pro.css">
<link rel="stylesheet" href="fonts/plus-jakarta-sans.css">
<link rel="stylesheet" href="css/links.css?v=20261008">
<link rel="stylesheet" href="css/edit.css?v=20261008">
<script src="../ai/js/theme.js"></script>
<script type="module" src="js/editor.js?v=20261008"></script>
</head>
<body class="ed">
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<header class="ed-top glass">
  <a class="brand" href="index.html" aria-label="Mở trang link">
    <img class="logo logo-light" src="../assets/logo-on-light.svg" alt="elevaTO" width="218" height="81">
    <img class="logo logo-dark" src="../assets/logo-on-dark.svg" alt="" width="218" height="81">
  </a>
  <div class="ed-title">
    <b>Trang link-in-bio</b>
    <small id="dirty" class="dirty" role="status">Đang tải…</small>
  </div>
  <div class="ed-act">
    <button class="ibtn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng / tối"><span class="i-sun"></span><span class="i-moon"></span></button>
    <a class="btn btn-ghost hide-sm" href="index.html" target="_blank" rel="noopener">Xem trang</a>
    <button class="btn btn-em" id="publishBtn" type="button">Đăng lên web</button>
  </div>
</header>

<!-- Màn hẹp chỉ đủ chỗ cho một bên (CSS ẩn hai nút này trên màn rộng, lúc đó cả hai bên cùng hiện). -->
<div class="ed-tabs glass" role="group" aria-label="Chế độ xem">
  <button id="tabEdit" type="button" aria-pressed="true">Sửa nội dung</button>
  <button id="tabPrev" type="button" aria-pressed="false">Xem trước</button>
</div>

<div class="ed-body">
  <main class="ed-form" id="form" aria-label="Nội dung trang"></main>
  <aside class="ed-prev" id="preview" aria-label="Xem trước">
    <div class="phone">
      <!-- src đặt trong editor.js kèm dấu thời gian: khung này phải luôn là bản index.html mới nhất,
           không thì sửa xong trang công khai mà khung vẫn vẽ theo bản cũ còn trong bộ nhớ đệm. -->
      <iframe id="frame" title="Xem trước trang link"></iframe>
    </div>
    <p class="prev-note" id="prevNote" role="status">Xem trước dùng bản nháp.</p>
  </aside>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
