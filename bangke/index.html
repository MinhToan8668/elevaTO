async function aiDetect(btn) {
  const old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> AI đang đọc…'; btn.disabled = true;
  try {
    // gửi sheet đang chọn + vài sheet khác có dữ liệu (không gửi cả file)
    const names = [IMP.sheet, ...Object.keys(IMP.sheets).filter((n) => n !== IMP.sheet && BK.detectHeader(IMP.sheets[n]).score > 0)].slice(0, 3);
    const r = await aiJson(promptMap(Object.fromEntries(names.map((n) => [n, IMP.sheets[n]]))));
    const sheet = IMP.sheets[r.sheet] ? r.sheet : IMP.sheet;
    IMP.sheet = sheet;
    IMP.headerRow = IMP.dataHeader = Math.max(0, (r.header_row | 0) - 1);
    IMP.map = BK.aiMappingToMap(r.columns || {});
    const k = r.kunn || {};
    const title = BK.extractTitleInfo(IMP.sheets[sheet], IMP.headerRow);
    IMP.kinfo = { so_kunn: k.so_kunn || title.so_kunn || IMP.kinfo.so_kunn || '', ngay_gn: BK.toISO(k.ngay_gn) || title.ngay_gn || IMP.kinfo.ngay_gn || '', ngay_dh: BK.toISO(k.ngay_dh) || '', so_tien_kunn: BK.parseAmount(k.so_tien) };
    IMP.aiRows = null;
    IMP.how = `AI (${aiModel()}) nhận dạng: sheet “${sheet}”, tiêu đề hàng ${IMP.headerRow + 1}`;
    IMP.aiNote = r.note || '';
    extract(); renderImport(); toast('AI đã nhận dạng cột — kiểm tra lại bảng ánh xạ', 'ok');
  } catch (e) { toast(e.message, 'err', 8000); btn.innerHTML = old; btn.disabled = false; }
}
async function aiReadAll(btn) {
  const g = IMP.sheets[IMP.sheet];
  const rows = g.map((r, i) => ({ r, i })).filter(({ r }) => r.some((v) => String(v).trim() !== ''));
  if (rows.length > 900 && !confirm(`Sheet có ${rows.length} hàng — AI đọc toàn bộ sẽ chậm và tốn lượt. Tiếp tục?`)) return;
  btn.disabled = true;
  try {
    const head = BK.gridToPrompt(g.slice(0, 12), 12, 80);
    const out = [];
    const CH = 120;
    for (let s = 0; s < g.length; s += CH) {
      btn.innerHTML = `<span class="spin"></span> AI đọc ${Math.min(s + CH, g.length)}/${g.length} hàng…`;
      const part = g.slice(s, s + CH).map((r, i) => (s + i < 12 ? [] : r));
      const text = BK.gridToPrompt([...Array(s).fill([]), ...part], CH + 20, 80);
      if (!text.trim()) continue;
      const r = await aiJson(promptRows(IMP.sheet, `PHẦN ĐẦU SHEET (để biết tiêu đề, số KUNN):\n${head}\n\nCÁC HÀNG CẦN ĐỌC:\n${text}`), { maxTokens: 60000 });
      out.push(...(r.rows || []));
    }
    IMP.aiRows = out; IMP.how = `AI (${aiModel()}) đọc toàn bộ ${out.length} dòng`;
    extract(); renderImport(); toast(`AI đọc được ${out.length} dòng`, 'ok');
  } catch (e) { toast(e.message, 'err', 8000); btn.disabled = false; btn.innerHTML = '✨ AI đọc toàn bộ'; }
}
const ERR_ST = ['da_du', 'vuot', 'trung_file'];
async function saveImport(opt = {}) {
  const m = IMP.m;
  let cid = IMP.cid;
  if (!cid) {
    const name = ($('#iNew', m).value || '').trim();
    if (!name) return toast('Chọn khách hàng hoặc nhập tên khách hàng mới', 'err');
    const ex = S.customers.find((c) => BK.fold(c.name) === BK.fold(name));
    if (ex) cid = ex.id;
    else { const c = { id: BK.uid(), name, mst: '', createdAt: Date.now(), createdBy: userName(), owner: userName(), ...meta() }; await S.store.putCustomer(c); cid = c.id; }
    IMP.cid = cid; await loadExisting(); recheck(false);
  }
  const ch = IMP.check;
  const todo = ch.groups.map((g, gi) => ({ g, gi })).filter(({ gi }) => IMP.mode[gi] !== 'skip');
  const missing = todo.filter(({ g }) => !g.so_kunn || !g.ngay_gn);
  if (missing.length) return toast('Còn KUNN thiếu số KUNN hoặc ngày giải ngân — điền ở mục “Thông tin khế ước”', 'err', 7000);
  if (ch.errors && !opt.skipErr && !opt.all && !confirm(`Có ${ch.errors} dòng bị cảnh báo giải ngân nhầm (vượt / đã GN đủ / trùng). Vẫn nạp cả các dòng này vào sổ?\n(Bấm Hủy rồi chọn “Nạp … bỏ dòng lỗi” nếu chỉ muốn nạp dòng hợp lệ.)`)) return;
  const btns = $$('#iSave, [data-save]', m); btns.forEach((b) => { b.disabled = true; }); const btn = $('#iSave', m); btn.innerHTML = '<span class="spin"></span> Đang nạp…';
  let nBo = 0;
  try {
    let n = 0, nl = 0;
    const docs = [];
    for (const { g } of todo) {
      const old = (IMP.existing || []).find((k) => BK.normKunn(k.so_kunn) === BK.normKunn(g.so_kunn));
      // thay bản cũ: giữ trạng thái hồ sơ gốc của dòng trùng hóa đơn
      const oldBy = new Map((old ? old.lines : []).map((l) => [BK.strongKey(l), l]));
      const keep = opt.skipErr ? g.lines.filter((l) => !ERR_ST.includes(l.check.status)) : g.lines;
      nBo += g.lines.length - keep.length;
      if (!keep.length) continue;
      const lines = keep.map((l) => {
        const o = oldBy.get(BK.strongKey(l));
        const c = BK.cleanLine(l);
        if (o) { c.id = o.id; if (l.goc === 'chua' && !l.thieu) { c.goc = o.goc; c.thieu = o.thieu; c.ngay_nhan = o.ngay_nhan; } if (!c.ghi_chu) c.ghi_chu = o.ghi_chu; }
        return c;
      });
      const k = { ...(old || {}), id: old ? old.id : BK.uid(), customerId: cid, so_kunn: String(g.so_kunn), ngay_gn: g.ngay_gn, ngay_dh: g.ngay_dh || '', so_tien: g.so_tien ?? null,
        han_bs: old ? old.han_bs || '' : '', ghi_chu: old ? old.ghi_chu || '' : '', source: IMP.file, lines, createdAt: old ? old.createdAt : Date.now(), createdBy: old ? old.createdBy : userName(), ...meta() };
      docs.push(k); n++; nl += lines.length;
    }
    await S.store.putKunns(docs);
    if (!docs.length) { btns.forEach((b) => { b.disabled = false; }); btn.textContent = '⬆ Nạp vào sổ theo dõi'; return toast('Không còn dòng hợp lệ nào để nạp', 'err'); }
    await S.store.putKunns(docs);
    log(cid, 'tai_bang_ke', `Nạp ${IMP.file}: ${n} KUNN, ${nl} dòng${nBo ? ` — bỏ ${nBo} dòng lỗi (đã GN / vượt / trùng)` : ch.errors ? ` (gồm ${ch.errors} dòng cảnh báo)` : ''}`);
    m.remove();
    toast(`Đã nạp ${n} KUNN, ${nl} dòng vào sổ${nBo ? ` · bỏ ${nBo} dòng lỗi` : ''}`, 'ok', 6000);
    if (docs.length === 1) openKunn(cid, docs[0].id); else { S.tab = 'kunn'; selectCustomer(cid); }
  } catch (e) { toast(errMsg(e), 'err', 9000); btns.forEach((b) => { b.disabled = false; }); btn.textContent = '⬆ Nạp vào sổ theo dõi'; }
}

const XS = {
  border: { top: { style: 'thin', color: { rgb: 'D9D2C5' } }, bottom: { style: 'thin', color: { rgb: 'D9D2C5' } }, left: { style: 'thin', color: { rgb: 'D9D2C5' } }, right: { style: 'thin', color: { rgb: 'D9D2C5' } } },
};
const sHead = { font: { bold: true, color: { rgb: 'FFFFFF' }, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: '005BAA' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: XS.border };
const sTitle = { font: { bold: true, sz: 14, color: { rgb: '002855' }, name: 'Arial' } };
const FILL = { err: 'FBEAE8', warn: 'FBF1DC', ok: 'E7F3EC', info: 'EAF2FA', kunn: 'F3EEE4' };
function xc(v, o = {}) {
  const s = { font: { name: 'Arial', sz: 10, bold: !!o.b, color: o.color ? { rgb: o.color } : undefined }, border: XS.border, alignment: { vertical: 'top', wrapText: !!o.wrap } };
  if (o.fill) s.fill = { fgColor: { rgb: o.fill } };
  if (v == null || v === '') return { v: '', t: 's', s };
  if (o.date) { const d = Date.parse(v + 'T00:00:00Z'); if (!isNaN(d)) { s.numFmt = 'dd/mm/yyyy'; return { v: d / 86400000 + 25569, t: 'n', z: 'dd/mm/yyyy', s }; } }
  if (typeof v === 'number') { s.numFmt = o.fmt || (Number.isInteger(v) ? '#,##0' : '#,##0.00'); s.alignment.horizontal = 'right'; return { v, t: 'n', z: s.numFmt, s }; }

async function backup() {
  const d = await S.store.dump();
  const blob = new Blob([JSON.stringify({ app: 'bangke-gn', ver: 1, at: Date.now(), by: userName(), ...d })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `BangKe_SaoLuu_${BK.todayISO()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Đã sao lưu ${d.customers.length} khách hàng, ${d.kunn.length} KUNN`, 'ok');
}
async function restore(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'bangke-gn') throw new Error('Không phải file sao lưu của công cụ này');
    if (!confirm(`Nạp ${d.customers.length} khách hàng, ${d.kunn.length} KUNN từ file sao lưu (${new Date(d.at).toLocaleString('vi-VN')}, ${d.by})?\nKUNN trùng mã sẽ lấy bản sửa sau cùng.`)) return;
    await mergeData(d);
    toast('Đã nạp dữ liệu sao lưu', 'ok');
  } catch (e) { toast('Không nạp được: ' + e.message, 'err', 8000); }
}
async function mergeData(d) {
  const st = S.store;
  const newer = (map, r) => !map.has(r.id) || (r.updatedAt || 0) > (map.get(r.id).updatedAt || 0);
  const cs = d.customers.filter((c) => newer(st.c, c)), ks = d.kunn.filter((k) => newer(st.k, k));
  await st.applyRemote('kh', cs); await st.applyRemote('ku', ks);
  st._out('kh', cs); st._out('ku', ks);
  for (const x of (d.log || []).slice(0, 5000)) await st.addLog(x, true).catch(() => {});
  st.emit('c'); st.emit('k');
  if (S.cid) selectCustomer(S.cid);
}

const anCache = new Map();
function analysisOf(cid) {
  if (cid === S.cid && S.an) return S.an;
  const ks = S.store.kunnsOf(cid);
  const key = ks.length + ':' + Math.max(0, ...ks.map((k) => k.updatedAt || 0));
  const c = anCache.get(cid); if (c && c.key === key) return c.an;
  const an = BK.analyze(ks); anCache.set(cid, { key, an }); return an;
}
/** Tra một hóa đơn trong sổ của mọi khách hàng: đã giải ngân chưa, bao nhiêu, ở KUNN nào. */
function openLookup(q0) {
  const m = modal(`<div class="mh"><h2>🔎 Tra hóa đơn đã giải ngân chưa</h2><button class="x" data-close>&times;</button></div><div class="mb">
    <div class="bar"><input class="inp" id="lkQ" value="${esc(q0)}" placeholder="Số hóa đơn, có thể kèm tên NCC (vd: 676 Hòa Bình)" style="flex:1;min-width:280px"><select class="inp" id="lkC" style="width:auto"><option value="">Mọi khách hàng</option>${S.customers.map((c) => `<option value="${c.id}" ${c.id === S.cid ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div id="lkR"></div></div>`);
  const draw = () => {
    const raw = $('#lkQ', m).value.trim(), cid = $('#lkC', m).value;
    const nums = (raw.match(/[0-9][0-9A-Za-z./-]*/g) || []).map((x) => BK.invNo(x));
    const words = BK.fold(raw.replace(/[0-9][0-9A-Za-z./-]*/g, ' ')).split(/\s+/).filter((w) => w.length >= 2);
    if (!nums.length && !words.length) { $('#lkR', m).innerHTML = ''; return; }
    const res = [];
    for (const c of S.customers) {
      if (cid && c.id !== cid) continue;
      for (const iv of analysisOf(c.id).invoices) {
        if (nums.length && !nums.includes(BK.invNo(iv.so_hd))) continue;
        const nf = BK.fold(iv.ncc);
        if (words.length && !words.every((w) => nf.includes(w))) continue;
        res.push({ c, iv });
        if (res.length > 300) break;
      }
    }
    const st = (iv) => iv.status === 'du' ? '<span class="pill p-err">ĐÃ GIẢI NGÂN ĐỦ</span>' : iv.status === 'vuot' ? '<span class="pill p-err">ĐÃ GN VƯỢT</span>' : iv.status === 'mot_phan' ? `<span class="pill p-info">Đã GN 1 phần · còn ${money(iv.con_lai, iv.loai_tien)}</span>` : '<span class="pill p-warn">Đã GN · thiếu tiền HĐ</span>';
    $('#lkR', m).innerHTML = res.length

        ${res.map(({ c, iv }) => `<tr ${A({ act: 'open', cid: c.id, k: iv.uses[iv.uses.length - 1].kunnId })}><td>${esc(c.name)}</td><td>${esc(iv.ncc)}</td><td><b>${esc(iv.so_hd)}</b>${iv.ky_hieu ? `<div class="hist">${esc(iv.ky_hieu)}</div>` : ''}</td><td>${dd(iv.ngay_hd)}</td><td class="num">${money(iv.tien_hd, iv.loai_tien)}</td><td class="num"><b>${money(iv.tong_gn, iv.loai_tien)}</b></td><td>${st(iv)}</td>
          <td class="hist">${iv.uses.map((u) => `KUNN ${esc(u.so_kunn)} (${dd(u.ngay_gn)}): ${money(u.tien_gn)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="verdict ok" style="margin-top:10px"><b>✓ Chưa thấy hóa đơn ${esc(raw)} trong sổ ${cid ? 'của khách hàng này' : 'của mọi khách hàng'}</b><span>Hóa đơn này chưa được giải ngân lần nào (theo dữ liệu đã nạp vào tool).</span></div>`;
  };
  let t; $('#lkQ', m).oninput = () => { clearTimeout(t); t = setTimeout(draw, 250); };
  $('#lkC', m).onchange = draw;

}

  };
  $('#skAdd', m).onclick = () => {
    collect();
    const ks = ($('#skKey', m).value || '').split(/[\s,;]+/).map((x) => x.trim()).filter((x) => x.length > 15);
    if (!ks.length) return toast('Chưa dán key hợp lệ', 'err');
    ks.forEach((k, i) => { if (!o.keys.some((x) => x.key === k)) o.keys.push({ key: k, name: ($('#skName', m).value || '').trim() + (ks.length > 1 ? ` #${i + 1}` : ''), on: true }); });
    aiSave(o); m.remove(); openSettings(); toast(`Đã thêm ${ks.length} key`, 'ok');
  };
  $$('[data-del]', m).forEach((b) => b.onclick = () => { collect(); o.keys.splice(+b.dataset.del, 1); if ((o.active | 0) >= o.keys.length) o.active = 0; aiSave(o); m.remove(); openSettings(); });
  $$('[data-test]', m).forEach((b) => b.onclick = async () => {
    collect(); const i = +b.dataset.test, out = $(`[data-res="${i}"]`, m); out.textContent = 'đang thử…';
    const body = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Trả lời đúng một chữ: OK' }] }], generationConfig: { maxOutputTokens: 64 } });
    let ok = '', why = '';
    for (const gw of AI_GATEWAYS) {
      try { const r = await fetch(gw(o.model || AI_MODEL_FALLBACK, o.keys[i].key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        if (r.ok) { ok = gw === AI_GATEWAYS[0] ? 'Vertex' : 'Gemini API'; break; }
        const t = await r.text(); why = `${r.status}: ${(t.match(/"message":\s*"([^"]{0,120})/) || [, t.slice(0, 120)])[1]}`;
      } catch (e) { why = 'mạng chặn'; }
    }
    out.textContent = ok ? `✓ chạy được (${ok})` : `✗ ${why}`; out.style.color = ok ? 'var(--ok)' : 'var(--err)';
  });
  renderSyncBox(m);
  $('#skUser', m).onchange = (e) => lsSet(LS.user, e.target.value.trim());
  $('#skSave', m).onclick = async () => {
    collect(); aiSave(o);
    lsSet(LS.user, $('#skUser', m).value.trim());
    lsSet(LS.han, String(Math.max(1, +$('#skHan', m).value || 30)));
    m.remove();
    toast('Đã lưu cài đặt', 'ok');
    renderMain();
  };
  if (focus === 'ai') setTimeout(() => $('#skKey', m).focus(), 50);
}
function renderSyncBox(m) {
  const box = $('#syncBox', m); if (!box) return;
  const sy = S.sync; if (!sy) return;
  const st = sy.state;
  const chips = Object.entries(sy.people || {}).map(([n, c]) => `<span class="pill p-info">${esc(n)} <b>${c}</b></span>`).join(' ');
  const info = st === 'on' ? `<b>✓ Đang kết nối: ${esc(sy.name)}</b>${sy.busy ? `<div class="hist" style="color:var(--blue)"><span class="spin"></span> ${esc(sy.busy)}</div>` : ''}<div class="hist">Lần đồng bộ cuối: ${sy.last ? new Date(sy.last).toLocaleString('vi-VN') : '—'} · ${sy.nFiles} tệp trong thư mục</div><div class="chips">${chips}</div>`
    : st === 'reconnect' ? `<b>Thư mục “${esc(sy.name)}” cần cấp quyền lại</b><div class="hist">Trình duyệt hỏi lại quyền mỗi lần mở file — bấm “Kết nối lại”.</div>`
    : st === 'error' ? `<b style="color:var(--err)">Lỗi thư mục chung</b><div class="hist">${esc(sy.err)}</div>`
    : '<b>Chưa kết nối thư mục chung</b><div class="hist">Dữ liệu đang chỉ lưu trên trình duyệt máy này.</div>';
  const btns = st === 'on' ? '<button class="btn pri" data-sy="pull">Đồng bộ ngay</button><button class="btn" data-sy="push">Gửi toàn bộ kho lên</button><button class="btn" data-sy="pick">Đổi thư mục</button><button class="btn danger" data-sy="off">Ngắt kết nối</button>'
    : st === 'reconnect' ? '<button class="btn pri" data-sy="re">Kết nối lại</button><button class="btn" data-sy="pick">Chọn thư mục khác</button><button class="btn danger" data-sy="off">Ngắt kết nối</button>'
    : '<button class="btn pri" data-sy="pick">📁 Chọn thư mục chung</button>' + (st === 'error' ? '<button class="btn danger" data-sy="off">Ngắt kết nối</button>' : '');
  box.innerHTML = !sy.supported
    ? '<div class="note err">Trình duyệt này không hỗ trợ chọn thư mục. Mở file bằng <b>Chrome</b> hoặc <b>Edge</b> trên máy tính. Tạm thời dùng Sao lưu / Nạp sao lưu để chuyển dữ liệu.</div>'
    : `<div class="card" style="padding:12px 14px;border-left:4px solid ${st === 'on' ? 'var(--ok)' : st === 'off' ? 'var(--line)' : 'var(--err)'}">${info}<div class="bar" style="margin:10px 0 0">${btns}</div></div>`;
  $$('[data-sy]', box).forEach((b) => { b.onclick = () => syncAction(b.dataset.sy, b); });
}
async function syncAction(a, btn) {
  const sy = S.sync;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + btn.textContent; }
  try {
    if (a === 'pick') {
      await sy.pick();
      toast(`Đã kết nối thư mục “${sy.name}”`, 'ok');
      if (S.store.customers().length && confirm('Gửi toàn bộ dữ liệu đang có trên máy này lên thư mục chung để cả team thấy?')) sy.pushAll().then((n) => toast(`Đã gửi ${n} hồ sơ lên thư mục chung`, 'ok')).catch((e) => toast(errMsg(e), 'err', 9000));
    } else if (a === 're') { await sy.reconnect(); if (sy.state === 'on') toast('Đã kết nối lại thư mục chung', 'ok'); }
    else if (a === 'pull') { const n = await sy.pull(); await sy.flush(); if (!n) toast('Đã đồng bộ — không có gì mới'); }
    else if (a === 'push') { const n = await sy.pushAll(); toast(`Đã gửi ${n} hồ sơ lên thư mục chung`, 'ok'); }
    else if (a === 'off') { if (confirm('Ngắt kết nối thư mục chung? Dữ liệu trên máy này vẫn giữ nguyên.')) await sy.disconnect(); }
  } catch (e) {
    if (e.name === 'AbortError') toast('Đã hủy chọn thư mục');
    else if (e.name === 'SecurityError' || e.name === 'NotAllowedError') toast('Trình duyệt không cho dùng thư mục này (thư mục hệ thống, hoặc bạn bấm “Không cho phép”). Chọn một thư mục con trong ổ chung, vd Z:\\BangKe, rồi bấm “Cho phép sửa”.', 'err', 12000);
    else toast(errMsg(e), 'err', 9000);
  }
  if ($('#syncBox')) renderSyncBox(document);
}
$('#bSettings').onclick = () => openSettings();
$('#syncPill').onclick = () => { if (S.sync && S.sync.state === 'reconnect') syncAction('re'); else openSettings(); };
document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'F9') { e.preventDefault(); openSettings(); } });

window.BKAPP = { exportDashboard, state: S, buildCustomerWorkbook };
startStore().catch((e) => { console.error(e); toast('Lỗi khởi động: ' + e.message, 'err', 10000); });
})();
</script>
</body>
</html>
