<script id="bk-core">
const BK = (() => {
'use strict';
  // Lõi xử lý bảng kê giải ngân theo hóa đơn — thuần logic, không đụng giao diện, không gọi mạng.
  // Chạy được cả trong trình duyệt (ES module) lẫn Node (bài kiểm tra trong bangke/tests).
  //
  // Khái niệm:
  //   KUNN  = một khế ước nhận nợ (một lần giải ngân). Mỗi KUNN có nhiều DÒNG, mỗi dòng là một hóa đơn
  //           (hoặc một phần hóa đơn) khách hàng đưa ra để chứng minh mục đích vay.
  //   Hóa đơn được nhận diện bằng: nhà cung cấp (MST nếu có, không thì tên đã chuẩn hóa) + số hóa đơn +
  //   ngày hóa đơn. Số hóa đơn điện tử đánh lại từ đầu mỗi năm nên KHÔNG được so mỗi số hóa đơn.

  const FIELDS = [
    // trường cấp KUNN (bảng kê tổng hợp nhiều KUNN trong một sheet: chỉ dòng đầu mỗi khối có giá trị)
    { k: 'so_kunn', label: 'Số KUNN', level: 'kunn' },
    { k: 'ngay_gn', label: 'Ngày giải ngân', level: 'kunn', type: 'date' },
    { k: 'ngay_dh', label: 'Ngày đến hạn', level: 'kunn', type: 'date' },
    { k: 'so_tien_kunn', label: 'Số tiền KUNN', level: 'kunn', type: 'num' },
    // trường cấp dòng
    { k: 'stt', label: 'STT', level: 'line' },
    { k: 'ncc', label: 'Nhà cung cấp', level: 'line' },
    { k: 'mst_ncc', label: 'MST nhà cung cấp', level: 'line' },
    { k: 'so_hdmb', label: 'Số hợp đồng / ĐĐH', level: 'line' },
    { k: 'ky_hieu', label: 'Ký hiệu hóa đơn', level: 'line' },
    { k: 'so_hd', label: 'Số hóa đơn', level: 'line' },
    { k: 'ngay_hd', label: 'Ngày hóa đơn', level: 'line', type: 'date' },
    { k: 'tien_hd', label: 'Số tiền hóa đơn', level: 'line', type: 'num' },
    { k: 'tien_gn', label: 'Số tiền giải ngân (vay)', level: 'line', type: 'num' },
    { k: 'loai_tien', label: 'Loại tiền', level: 'line' },
    { k: 'ho_so', label: 'Tình trạng chứng từ / hồ sơ gốc', level: 'line' },
    { k: 'ghi_chu', label: 'Ghi chú', level: 'line' },
  ];
  const FIELD = Object.fromEntries(FIELDS.map((f) => [f.k, f]));

  // Trạng thái hồ sơ gốc của từng dòng
  const GOC = {
    chua: 'Chưa nhận',
    thieu: 'Nhận thiếu',
    da_nhan: 'Đã nhận đủ',
  };

  // Kết quả kiểm tra một dòng so với lịch sử giải ngân
  const CHECK = {
    moi: { label: 'Hóa đơn mới', sev: 0 },
    tiep: { label: 'GN tiếp phần còn lại', sev: 1 },
    vuot: { label: 'VƯỢT số tiền hóa đơn', sev: 3 },
    da_du: { label: 'ĐÃ GIẢI NGÂN ĐỦ trước đó', sev: 3 },
    trung_file: { label: 'Trùng trong cùng bảng kê', sev: 3 },
    nghi_trung: { label: 'Nghi trùng (cùng số HĐ, khác ngày)', sev: 2 },
    thieu_tt: { label: 'Thiếu thông tin', sev: 2 },
    lech_cot: { label: 'Đọc sai cột — cần kiểm tra', sev: 2 },
  };

  // ─── chuẩn hóa chữ ───────────────────────────────────────────
  function fold(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/đ/g, 'd').replace(/Đ/g, 'D')
      .replace(/[ \s]+/g, ' ')
      .trim().toLowerCase();
  }

  const LEGAL = [
    'cong ty trach nhiem huu han', 'trach nhiem huu han', 'mot thanh vien', 'cong ty co phan', 'co phan',
    'doanh nghiep tu nhan', 'ho kinh doanh', 'chi nhanh', 'cong ty', 'cty', 'tnhh', 'mtv', 'ctcp', 'hkd', 'dntn',
    'co., ltd', 'co.,ltd', 'company limited', 'co ltd', 'limited', 'ltd', 'jsc', 'corporation', 'corp',
  ];
  /** Khóa nhà cung cấp: bỏ dấu, bỏ loại hình (công ty TNHH, chi nhánh…), bỏ mọi ký tự không phải chữ/số. */
  const LEGAL_RE = LEGAL.map((w) => new RegExp('(^|[^a-z0-9])' + w.replace(/[.,]/g, '\\$&') + '(?=[^a-z0-9]|$)', 'g'));
  const supCache = new Map();
  function supKey(name) {
    const k = String(name == null ? '' : name);
    let v = supCache.get(k);
    if (v === undefined) { v = supKey0(k); if (supCache.size > 50000) supCache.clear(); supCache.set(k, v); }
    return v;
  }
  function supKey0(name) {
    let s = ' ' + fold(name).replace(/[–—]/g, '-') + ' ';
    for (const w of LEGAL) s = s.split(' ' + w + ' ').join(' ').split(' ' + w + ',').join(' ');
    for (const re of LEGAL_RE) s = s.replace(re, ' ');
    return s.replace(/[^a-z0-9]/g, '');
  }
  function mstKey(v) {
    const s = String(v == null ? '' : v).replace(/[^0-9]/g, '');
    return s.length >= 10 ? s : '';
  }

  /** Số hóa đơn chuẩn hóa: bỏ chữ "HĐ/số", bỏ khoảng trắng, bỏ số 0 đầu với số thuần. */
  function invNo(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(v);
    let s = fold(v).toUpperCase();
    s = s.replace(/^((SO|HOA\s*DON|HD|INV(OICE)?|NO)[\s.:#-]*)+(?=[0-9A-Z])/, '');
    s = s.replace(/\s+/g, '').replace(/\.0+$/, '');
    if (/^\d+$/.test(s)) s = s.replace(/^0+(?=\d)/, '');
    return s;
  }

  // ─── số tiền ─────────────────────────────────────────────────
  /** Đọc số tiền: nhận số, "19,246,587,302", "1.234.567", "1.234.567,89", "(1.000)" … Không đọc được → null. */
  function parseAmount(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Number.isFinite(v) ? (Number.isInteger(v) ? v : +v.toPrecision(12)) : null;
    let s = String(v).replace(/[ \s]/g, '').replace(/(vnd|vnđ|đ|usd|eur)$/i, '');
    if (!s) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s[0] === '-') { neg = true; s = s.slice(1); }
    if (!/^[0-9.,]+$/.test(s)) return null;
    const dots = (s.match(/\./g) || []).length, commas = (s.match(/,/g) || []).length;
    if (dots && commas) {
      const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
      const th = dec === '.' ? ',' : '.';
      s = s.split(th).join('').replace(dec, '.');
    } else if (dots + commas > 0) {
      const sep = dots ? '.' : ',';
      const n = dots || commas;
      const after = s.length - s.lastIndexOf(sep) - 1;
      if (n > 1 || after === 3) s = s.split(sep).join('');      // dấu phân cách nghìn
      else s = s.replace(sep, '.');                             // dấu thập phân
    }
    const x = Number(s);
    return Number.isFinite(x) ? (neg ? -x : x) : null;
  }

  // ─── ngày ────────────────────────────────────────────────────
  const pad = (n) => String(n).padStart(2, '0');
  function iso(y, m, d) {
    if (!(y > 1900 && y < 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
    const t = new Date(Date.UTC(y, m - 1, d));
    if (t.getUTCMonth() !== m - 1) return '';
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  /** Về dạng 'YYYY-MM-DD'. Nhận số sê-ri Excel, Date, "dd/mm/yyyy", "dd-mm-yy", "yyyy-mm-dd". */
  function toISO(v) {
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return '';
      const t = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
    }
    const s = String(v).trim();
    let m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s);
    if (m) return iso(+m[1], +m[2], +m[3]);
    m = /(\d{1,2})\s*[-/.]\s*(\d{1,2})\s*[-/.]\s*(\d{2,4})/.exec(s);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return iso(y, +m[2], +m[1]); }
    m = /ngay\s*(\d{1,2})\s*thang\s*(\d{1,2})\s*nam\s*(\d{4})/.exec(fold(s));
    if (m) return iso(+m[3], +m[2], +m[1]);
    if (/^\d{5}(\.\d+)?$/.test(s)) return toISO(Number(s));
    return '';
  }
  function fmtDate(isoStr) {
    if (!isoStr) return '';
    const [y, m, d] = isoStr.split('-');
    return `${d}/${m}/${y}`;
  }
  function daysBetween(a, b) {
    if (!a || !b) return null;
    return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
  }
  function todayISO(now = new Date()) {
    return iso(now.getFullYear(), now.getMonth() + 1, now.getDate());
  }

  // ─── cột Excel ───────────────────────────────────────────────
  function colName(i) {
    let s = ''; i += 1;
    while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function colIndex(name) {
    if (name == null || name === '') return -1;
    if (typeof name === 'number') return name;
    const s = String(name).trim().toUpperCase();
    if (!/^[A-Z]{1,3}$/.test(s)) return -1;
    let n = 0;
    for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }

  // ─── nhận dạng tiêu đề cột ───────────────────────────────────
  // Thứ tự quan trọng: ngày trước, tiền sau, số hóa đơn sau cùng (vì "ngày hóa đơn", "số tiền hóa đơn"
  // đều chứa chữ "hóa đơn").
  const HEAD_RULES = [
    ['ngay_gn', /ngay\s*giai\s*ngan|ngay\s*gn\b|ngay\s*nhan\s*no/],
    ['ngay_dh', /ngay\s*(den|dao)\s*han|han\s*tra|ngay\s*tra\s*no|dao\s*han/],
    ['ngay_hd', /ngay\s*(hoa\s*don|hd|inv|xuat|lap)/],
    ['so_kunn', /kunn|khe\s*uoc|ku\s*nhan\s*no|so\s*ku\b|hop\s*dong\s*tin\s*dung/],
    ['mst_ncc', /ma\s*so\s*thue|\bmst\b/],
    ['loai_tien', /loai\s*tien|tien\s*te|currency/],
    ['tien_hd', /(so\s*tien|tri\s*gia|gia\s*tri|tong\s*tien|thanh\s*tien).{0,12}(hoa\s*don|\bhd\b|inv)|tien\s*hoa\s*don|gia\s*tri\s*hd|^(so\s*tien|tri\s*gia|gia\s*tri|thanh\s*tien)\s*(cua\s*)?(po|don\s*(dat\s*)?hang|ddh)\b/],
    ['tien_gn', /^(so\s*tien\s*)?(vay|giai\s*ngan|de\s*nghi\s*(giai\s*ngan|vay)|thanh\s*toan|tt)\b|so\s*tien\s*(vay|giai\s*ngan|gn\b|de\s*nghi|thanh\s*toan|tt\b)|tien\s*vay|^(gia\s*tri\s*)?(giai\s*ngan|gn)(\s*vnd)?$/],
    ['ho_so', /chung\s*tu\s*(thieu|bo\s*sung|con\s*thieu)|ho\s*so\s*goc|ban\s*goc|tinh\s*trang\s*(chung\s*tu|ho\s*so)|kiem\s*tra\s*chung\s*tu/],
    ['ky_hieu', /ky\s*hieu/],
    ['ncc', /nha\s*cung\s*cap|ben\s*thu\s*huong|ben\s*ban|don\s*vi\s*(ban|cung\s*cap|thu\s*huong)|ten\s*ncc|^ncc\b|nguoi\s*ban|doi\s*tac|khach\s*hang\s*ban/],
    ['so_hdmb', /hop\s*dong|\bddh\b|don\s*dat\s*hang|\bhdmb\b|\bpo\b/],
    ['so_hd', /hoa\s*don|^so\s*hd\b|^hd\b|invoice|^inv\b|^so\s*inv/],
    ['stt', /^(stt|tt|so\s*tt)$/],
    ['ghi_chu', /ghi\s*chu|note/],
  ];
  /** Cho chữ tiêu đề một ô → tên trường (hoặc '' nếu không khớp). */
  function headerField(text) {
    const t = fold(text).replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!t || t.length > 50 || /\d{1,2}\/\d{1,2}\/\d{2,4}/.test(t)) return '';    // câu chữ dài / có ngày tháng: không phải tiêu đề cột
    if (/^tong\b/.test(t) && !/hoa\s*don|kunn|khe\s*uoc/.test(t)) return '';        // "TỔNG TIỀN VAY", "TỔNG (VNĐ)" — cột cộng dồn, bỏ
    if (/^so\s*tien(\s*\(?(vnd|vnđ)\)?)?$/.test(t)) return 'so_tien_kunn?';
    if (/^(so\s*tien|gia\s*tri|tong\s*tien)\s*(cua\s*)?(kunn|khe\s*uoc|ku)\b/.test(t)) return 'so_tien_kunn';   // "SỐ TIỀN" trơn: chỉ là tiền KUNN khi có cột số KUNN
    if (/(gia\s*tri|so\s*tien|tri\s*gia)\s*(tren\s*)?hop\s*dong|ngay\s*hop\s*dong|so\s*(bill|b\s*\/?\s*l)\b|tien\s*bct|^so\s*lc\b/.test(t)) return '';   // giá trị / ngày hợp đồng, B/L, LC: không phải trường bảng kê
    if (/(so\s*tien|gia\s*tri|tri\s*gia)\s*(tren\s*)?to\s*khai/.test(t)) return 'tien_tk';
    if (/^(so\s*)?to\s*khai|^so\s*tk\b/.test(t)) return 'so_tk';
    if (/^(loai\s*thue|noi\s*dung)/.test(t)) return 'ky_hieu';
    for (const [k, re] of HEAD_RULES) if (re.test(t)) return k;
    return '';
  }

  function cellText(v) { return v == null ? '' : String(v); }

  /** Chấm điểm một hàng có phải hàng tiêu đề không: trả về {score, map}. */
  function scoreHeaderRow(row) {
    const map = {};
    let score = 0;
    (row || []).forEach((v, c) => {
      if (typeof v !== 'string') return;
      let f = headerField(v);
      if (!f) return;
      if (f === 'so_tien_kunn?') { map._soTien = map._soTien ?? c; return; }
      if (map[f] == null) { map[f] = c; score += (f === 'so_hd' || f === 'tien_gn' || f === 'tien_hd' || f === 'ncc') ? 2 : 1; }
    });
    if (map._soTien != null) {
      if (map.so_kunn != null && map.so_tien_kunn == null) { map.so_tien_kunn = map._soTien; score += 1; }
      else if (map.tien_gn == null && map.so_kunn == null) { map.tien_gn = map._soTien; score += 1; }
    }
    delete map._soTien;
    return { score, map };
  }

  /** Tìm hàng tiêu đề tốt nhất trong 60 hàng đầu của một sheet (mảng 2 chiều). */
  function detectHeader(grid, maxScan = 60) {
    let best = { row: -1, score: 0, map: {} };
    for (let r = 0; r < Math.min(grid.length, maxScan); r++) {
      const { score, map } = scoreHeaderRow(grid[r]);
      if (score > best.score) best = { row: r, score, map };
    }
    // tiêu đề 2 tầng (hàng dưới bổ sung cột còn thiếu, vd "Số" / "Ngày" dưới "HÓA ĐƠN")
    if (best.row >= 0 && grid[best.row + 1]) {
      const sub = grid[best.row + 1];
      const parent = grid[best.row];
      let used = false;
      sub.forEach((v, c) => {
        if (typeof v !== 'string' || !v.trim()) return;
        let p = '';
        for (let k = c; k >= 0 && !p; k--) p = cellText(parent[k]).trim();
        const f = headerField(`${v} ${p}`) || headerField(v);
        if (f && f !== 'so_tien_kunn?' && best.map[f] == null) { best.map[f] = c; used = true; }
        // "Số" dưới "HÓA ĐƠN" → số hóa đơn, "Ngày" dưới "HÓA ĐƠN" → ngày hóa đơn
        const fv = fold(v), fp = fold(p);
        if (/hoa\s*don|invoice/.test(fp)) {
          if (/^so\b/.test(fv) && best.map.so_hd == null) { best.map.so_hd = c; used = true; }
          if (/^ngay\b/.test(fv)) { best.map.ngay_hd = c; used = true; }
          if (/tien|gia\s*tri/.test(fv) && best.map.tien_hd == null) { best.map.tien_hd = c; used = true; }
        }
      });
      if (used) best.twoRow = true;
    }
    if (best.row >= 0) {
      // bảng kê theo PO / đơn đặt hàng / hợp đồng (chưa có hóa đơn): số PO làm số chứng từ, ngày PO làm ngày chứng từ
      if (best.map.so_hd == null && best.map.so_hdmb != null) { best.map.so_hd = best.map.so_hdmb; delete best.map.so_hdmb; best.byPO = true; }
      (grid[best.row] || []).forEach((v, c) => {
        const t = fold(v).replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
        if (Object.values(best.map).includes(c)) return;
        if (best.map.ngay_hd == null && (/^ngay\s*(po|don\s*(dat\s*)?hang|ddh|hop\s*dong|chung\s*tu|ct)\b/.test(t) || (t === 'ngay' && best.map.so_hd != null && Math.abs(c - best.map.so_hd) <= 2))) best.map.ngay_hd = c;
        else if (best.map.tien_hd == null && best.map.tien_gn != null && /^(so\s*tien|gia\s*tri|tri\s*gia|thanh\s*tien)(\s*(vnd|vnđ|po|don\s*hang|hop\s*dong))?$/.test(t)) best.map.tien_hd = c;
        else if (best.map.ngay_gn == null && /^ngay\s*de\s*nghi/.test(t)) best.map.ngay_gn = c;
      });
    }
    const ok = best.row >= 0 && (best.map.so_hd != null) && (best.map.tien_gn != null || best.map.tien_hd != null);
    return { ...best, ok };
  }

  /** Lấy số KUNN / ngày trong dòng chữ phía trên bảng: "Theo KU nhận nợ số 8800123(37).26 ngày 24/03/2026". */
  function extractTitleInfo(grid, headerRow) {
    const out = {};
    const upto = headerRow >= 0 ? headerRow : Math.min(grid.length, 15);
    for (let r = 0; r < upto; r++) {
      for (const v of grid[r] || []) {
        if (typeof v !== 'string' || v.length < 6) continue;
        const f = fold(v);
        const m = /(kunn|khe\s*uoc(\s*nhan\s*no)?|\bku(\s*nhan\s*no)?\b|giay\s*nhan\s*no)\s*(so)?\s*[:.]?\s*([0-9a-z][0-9a-z().\/_-]*)/i.exec(f);
        if (m && !out.so_kunn && (/\d/.test(m[5]) || /[-().\/]/.test(m[5]))) {
          // lấy lại đúng đoạn trong chuỗi gốc (giữ chữ hoa)
          const raw = v.normalize('NFC');
          const idx = raw.search(new RegExp(m[5].replace(/[().\/\\-]/g, '\\$&'), 'i'));
          out.so_kunn = idx >= 0 ? raw.substr(idx, m[5].length) : m[5].toUpperCase();
          out.so_kunn = out.so_kunn.replace(/[.,;:]+$/, '');
        }
        const d = /ngay\s*[:.]?\s*(\d{1,2}\s*[-/.]\s*\d{1,2}\s*[-/.]\s*\d{2,4})/.exec(f);
        if (d && !out.ngay_gn && (m || /nhan\s*no|giai\s*ngan|kunn|\bku\b/.test(f))) out.ngay_gn = toISO(d[1]);
      }
    }
    return out;
  }

  // ─── đọc dòng theo bảng ánh xạ cột ───────────────────────────
  // "Tổng cộng", "Cộng", "Total"… — KHÔNG bắt nhầm "Công ty" (fold ra "cong ty")
  const TOTAL_RE = /^(tong(\s*cong)?|tong\s*so|total|sum|cong\s*phat\s*sinh)\b|^cong\s*[:.]?$|^cong\s*(tien|so\s*tien|ku|kunn)\b/;

  /** Diễn giải chữ trong cột "chứng từ thiếu / hồ sơ" của bảng kê cũ → trạng thái hồ sơ gốc. */
  function classifyDocNote(text) {
    const raw = cellText(text).trim();
    const t = fold(raw);
    if (!t) return { goc: 'chua', thieu: '' };
    if (/^(ok|da\s*nhan|du|da\s*du|goc\s*ok|ok\s*goc|da\s*co|nhan\s*du|da\s*bo\s*sung(\s*du)?|x|v|✓)\.?$/.test(t)) return { goc: 'da_nhan', thieu: '' };
    if (/^(ok|goc ok)\b/.test(t)) return { goc: 'da_nhan', thieu: '', note: raw };
    if (/chua\s*(co|nhan|thay|gui)|chua\b/.test(t)) return { goc: 'chua', thieu: '', note: raw };
    return { goc: 'thieu', thieu: raw };
  }

  function blankRow(row) { return !row || row.every((v) => v == null || String(v).trim() === ''); }

  /**
   * Áp bảng ánh xạ cột lên sheet → danh sách KUNN (mỗi KUNN có lines).
   * map: { field: colIndex }. Trường cấp KUNN điền xuôi xuống (dòng đầu khối mới có giá trị).
   * defaults: { so_kunn, ngay_gn, ngay_dh, so_tien_kunn } dùng khi sheet không có cột KUNN.
   */
  /** Một hàng Excel → chữ gọn "F: 2 | G: KIO KOREA | …" (giữ để rà soát, AI đọc lại khi cần). */
  /** Số Excel → chữ, bỏ sai số dấu phẩy động (53726.399999999994 → 53726.4). */
  function numStr(v) { return String(Number.isInteger(v) ? v : +v.toPrecision(12)); }
  function rowText(row, maxCell = 60) {
    const out = [];
    (row || []).forEach((v, c) => {
      if (v == null || String(v).trim() === '') return;
      let t = typeof v === 'number' ? numStr(v) : String(v).replace(/\s+/g, ' ').trim();
      if (t.length > maxCell) t = t.slice(0, maxCell) + '…';
      out.push(`${colName(c)}: ${t}`);
    });
    return out.join(' | ');
  }
  const LINE_FIELDS = ['stt', 'ncc', 'mst_ncc', 'so_hdmb', 'ky_hieu', 'so_hd', 'ngay_hd', 'tien_hd', 'tien_gn', 'loai_tien', 'ho_so', 'ghi_chu', 'so_tk', 'tien_tk'];
  /** Hàng tiêu đề phụ giữa sheet (mỗi khối KUNN một kiểu cột) → bảng ánh xạ cột mới cho các dòng thuộc khối đó. */
  function subHeaderMap(row, next, base, prev) {
    const m = {};
    let score = 0;
    (row || []).forEach((v, c) => {
      if (typeof v !== 'string') return;
      const t = fold(v).replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
      let f = headerField(v);
      if (f === 'so_tien_kunn?') f = 'tien_hd';
      if (!f && /^ngay$/.test(t)) f = 'ngay_hd';
      if (!f || !LINE_FIELDS.includes(f) || m[f] != null) return;
      m[f] = c; score += ['so_hd', 'so_tk', 'tien_hd', 'tien_gn', 'tien_tk', 'ncc'].includes(f) ? 2 : 1;
    });
    if (score < 4 || (m.so_hd == null && m.so_tk == null) || (m.tien_hd == null && m.tien_gn == null && m.tien_tk == null)) return null;
    // tiêu đề 2 tầng: NCC / STT / hợp đồng có thể nằm ở hàng ngay trên
    (prev || []).forEach((v, c) => {
      if (typeof v !== 'string') return;
      const f = headerField(v);
      if (['ncc', 'stt', 'so_hdmb'].includes(f) && m[f] == null && !Object.values(m).includes(c)) m[f] = c;
    });
    const out = {};
    for (const [k, v] of Object.entries(base)) if (!LINE_FIELDS.includes(k)) out[k] = v;    // giữ cột cấp KUNN
    Object.assign(out, m);
    const txt = [...(row || []), ...(next || [])].map((v) => fold(v)).join(' ');
    const cur = /\busd\b/.test(txt) ? 'USD' : /\beur\b/.test(txt) ? 'EUR' : /\bjpy\b/.test(txt) ? 'JPY' : /\b(cny|rmb)\b/.test(txt) ? 'CNY' : '';
    return { map: out, cur };
  }
  function extractRows(grid, headerRow, map, defaults = {}) {
    let bmap = map, bcur = '', lastHdr = -9;
    const get = (row, f) => (bmap[f] == null || bmap[f] < 0 ? '' : row[bmap[f]]);
    const hdr = headerRow >= 0 ? [grid[headerRow - 1], grid[headerRow]].filter((x) => x && x.some((v) => String(v).trim())).map((x) => rowText(x, 40)).join(' ‖ ') : '';
    const groups = [];
    let cur = null;
    let lastNcc = '', lastHdmb = '';
    const warnings = [];
    const startRow = headerRow + 1;
    const newGroup = (info) => {
      cur = { so_kunn: info.so_kunn || '', ngay_gn: info.ngay_gn || '', ngay_dh: info.ngay_dh || '', so_tien: info.so_tien ?? null, lines: [], row: info.row, hdr };
      groups.push(cur);
      lastNcc = ''; lastHdmb = '';
    };
    if (map.so_kunn == null || map.so_kunn < 0) {
      newGroup({ so_kunn: defaults.so_kunn, ngay_gn: defaults.ngay_gn, ngay_dh: defaults.ngay_dh, so_tien: defaults.so_tien_kunn ?? null, row: headerRow });
    }
    for (let r = startRow; r < grid.length; r++) {
      const row = grid[r];
      if (blankRow(row)) continue;
      // hàng tiêu đề phụ / lặp lại giữa bảng (có thể nằm cùng hàng với số KUNN)
      const sh = subHeaderMap(row, grid[r + 1], map, grid[r - 1]);
      const isHdr = sh || scoreHeaderRow(row).score >= 4;
      const kunnRaw = get(row, 'so_kunn');
      const kunnTxt = cellText(kunnRaw).trim();
      if (map.so_kunn != null && map.so_kunn >= 0 && kunnTxt && !TOTAL_RE.test(fold(kunnTxt))) {
        const so = typeof kunnRaw === 'number' ? String(kunnRaw) : kunnTxt;
        // số KUNN quá dài (> 40 ký tự) là một đoạn mô tả lọt vào cột → bỏ
        if (so.length <= 40) newGroup({
          so_kunn: so, ngay_gn: toISO(get(row, 'ngay_gn')), ngay_dh: toISO(get(row, 'ngay_dh')),
          so_tien: parseAmount(get(row, 'so_tien_kunn')), row: r,
        });
        if (!sh) { bmap = map; bcur = ''; }               // KUNN mới → quay về cột của tiêu đề chính
      }
      if (sh) {
        // tiêu đề 2 tầng (hàng trên + hàng dưới) → gộp
        if (lastHdr === r - 1 && bmap !== map) { bmap = { ...bmap, ...sh.map }; bcur = sh.cur || bcur; } else { bmap = sh.map; bcur = sh.cur; }
        lastHdr = r; continue;
      }
      if (isHdr) continue;
      if (!cur) continue;
      // hàng tổng cộng
      const firstTexts = row.slice(0, Math.max(3, (map.ncc ?? 0) + 1)).map((v) => fold(v)).filter(Boolean);
      if (firstTexts.some((t) => TOTAL_RE.test(t))) { cur.afterTotal = true; continue; }
      if (TOTAL_RE.test(fold(get(row, 'ncc'))) || TOTAL_RE.test(fold(get(row, 'stt')))) { cur.afterTotal = true; continue; }

      const so_hd_raw = get(row, 'so_hd');
      let so_hd = typeof so_hd_raw === 'number' ? numStr(so_hd_raw) : cellText(so_hd_raw).trim();
      let ngay_hd = toISO(get(row, 'ngay_hd'));
      const assumed = [];
      let kyHieuLech = '';
      // Bảng kê thuế nhập khẩu hay ghi lệch cột: cột "hóa đơn" chứa NGÀY (số sê-ri Excel), số tờ khai nằm ở cột hợp đồng
      if (typeof so_hd_raw === 'number' && so_hd_raw > 36000 && so_hd_raw < 60000 && Number.isInteger(so_hd_raw) && !ngay_hd) {
        ngay_hd = toISO(so_hd_raw);
        so_hd = cellText(get(row, 'so_hdmb')).trim();
        kyHieuLech = cellText(get(row, 'ngay_hd')).trim();         // "NK" / "GTGT NK": 2 khoản thuế của cùng 1 tờ khai
        assumed.push('so_hd');
      }
      const tkRaw = get(row, 'so_tk');
      const tkTxt = typeof tkRaw === 'number' ? numStr(tkRaw) : cellText(tkRaw).trim();
      if (!so_hd && tkTxt && !assumed.includes('so_hd')) so_hd = tkTxt;
      let tien_hd = parseAmount(get(row, 'tien_hd'));
      if (tien_hd == null && bmap.tien_hd == null) tien_hd = parseAmount(get(row, 'tien_tk'));
      let tien_gn = parseAmount(get(row, 'tien_gn'));
      let nccTxt = cellText(get(row, 'ncc')).replace(/\s+/g, ' ').trim();
      const hdmbTxt = cellText(get(row, 'so_hdmb')).replace(/\s+/g, ' ').trim();
      if (!so_hd && tien_hd == null && tien_gn == null) continue;          // dòng chữ mô tả, chữ ký…
      if (cur.afterTotal && !so_hd && !hdmbTxt && !nccTxt) continue;      // số lẻ tẻ ghi tay dưới dòng Tổng cộng (nháp cộng tiền) — không phải dòng bảng kê
      if (so_hd && !/\d/.test(so_hd) && tien_hd == null && tien_gn == null) continue;   // hàng tiêu đề phụ
      if (nccTxt) { if (nccTxt !== lastNcc) lastHdmb = ''; lastNcc = nccTxt; } else nccTxt = lastNcc;
      let hdmb = hdmbTxt;
      if (hdmb) lastHdmb = hdmb; else hdmb = lastHdmb;
      const prev = cur.lines[cur.lines.length - 1];
      if (!so_hd && prev && prev.so_hd && (!hdmbTxt || hdmbTxt === prev.so_hdmb) && (!cellText(get(row, 'ncc')).trim() || nccTxt === prev.ncc)) {
        so_hd = prev.so_hd;
        if (!ngay_hd) ngay_hd = prev.ngay_hd;
        const nd = cellText(get(row, 'ngay_hd')).trim() || cellText(get(row, 'ky_hieu')).trim();
        kyHieuLech = nd && !toISO(nd) ? nd : `phần ${cur.lines.filter((l) => l.so_hd === so_hd).length + 1}`;
        assumed.push('so_hd_tiep');
      }
      if (tien_gn == null && tien_hd != null) { tien_gn = tien_hd; assumed.push('tien_gn'); }   // không ghi số vay → coi như vay đủ tiền hóa đơn
      const hs = classifyDocNote(get(row, 'ho_so'));
      const line = {
        stt: cellText(get(row, 'stt')).trim(),
        ncc: nccTxt,
        mst_ncc: cellText(get(row, 'mst_ncc')).replace(/\s+/g, '').trim(),
        so_hdmb: hdmb,
        ky_hieu: cellText(get(row, 'ky_hieu')).trim() || kyHieuLech,
        so_hd,
        ngay_hd,
        tien_hd,
        tien_gn,
        loai_tien: cellText(get(row, 'loai_tien')).trim().toUpperCase().replace(/^VN.*/, '') || bcur,
        goc: (map.ho_so != null && map.ho_so >= 0) ? hs.goc : 'chua',
        thieu: hs.thieu || '',
        ghi_chu: [cellText(get(row, 'ghi_chu')).trim(), hs.note || '', tkTxt && tkTxt !== so_hd ? `TK ${tkTxt}` : ''].filter(Boolean).join(' · '),
        row: r + 1,
        raw: rowText(row),
      };
      if (assumed.length) line.assumed = assumed;
      cur.afterTotal = false;
      // Dòng ghi lệch cột so với tiêu đề (hay gặp ở khối nhập khẩu ngoại tệ): số tờ khai 11–12 chữ số rơi vào cột tiền,
      // số tiền có phần lẻ rơi vào cột số hóa đơn, chữ rơi vào cột tiền, số lạ rơi vào cột ngày.
      const why = [];
      const isId = (v) => typeof v === 'number' && Number.isInteger(v) && v >= 1e11 && v < 1e13;   // số tờ khai: 12 chữ số
      const other = (v) => [line.tien_hd, line.tien_gn].filter((x) => x != null && x !== v && !isId(x));
      for (const f of ['tien_hd', 'tien_gn']) {
        const v = line[f];
        if (isId(v) && (other(v).length === 0 || other(v).every((o) => v / Math.max(1, Math.abs(o)) > 1000))) {
          why.push(`${f === 'tien_hd' ? 'cột tiền HĐ' : 'cột giải ngân'} chứa ${v} (giống số tờ khai)`);
          line[f] = null;
        }
      }
      const rawHd = get(row, 'so_hd');
      if (!(assumed.includes('so_hd') || assumed.includes('so_hd_tiep')) && ((typeof rawHd === 'number' && !Number.isInteger(rawHd)) || /^\d+[.,]\d{1,2}$/.test(String(rawHd).trim()))) why.push(`số HĐ “${rawHd}” giống số tiền`);
      const rawGn = get(row, 'tien_gn');
      if (map.tien_gn != null && typeof rawGn === 'string' && rawGn.trim() && parseAmount(rawGn) == null) why.push(`cột giải ngân chứa chữ “${rawGn.trim().slice(0, 24)}”`);
      const rawNg = get(row, 'ngay_hd');
      if (typeof rawNg === 'number' && rawNg > 80000 && !assumed.includes('so_hd')) why.push(`cột ngày HĐ chứa ${rawNg}`);
      if (why.length) {
        line.lech = why.join('; ');
        if (line.tien_gn == null && line.tien_hd != null && !assumed.includes('tien_gn')) line.tien_gn = line.tien_hd;
        if (assumed.includes('tien_gn') && why.some((w) => /giải ngân/.test(w))) line.tien_gn = null;
      }
      cur.lines.push(line);
    }
    const out = groups.filter((g) => g.lines.length);
    for (const g of out) {
      const ls = g.lines;
      for (let i = 0; i < ls.length; i++) {
        const a = ls[i];
        if (a.tien_gn == null || (a.assumed || []).includes('tien_gn') || a.tien_hd == null) continue;
        let j = i + 1, tot = a.tien_hd;
        while (j < ls.length && (ls[j].assumed || []).includes('tien_gn') && ls[j].ncc === a.ncc && ls[j].tien_hd != null) { tot += ls[j].tien_hd || 0; j++; if (Math.abs(tot - a.tien_gn) <= 1) break; }
        if (j > i + 1 && Math.abs(tot - a.tien_gn) <= 1 && Math.abs(a.tien_gn - a.tien_hd) > 1) {
          a.ghi_chu = [a.ghi_chu, `số vay ghi gộp ${fmtMoney(a.tien_gn)} cho ${j - i} dòng`].filter(Boolean).join(' · ');
          a.tien_gn = a.tien_hd;
        }
      }
      g.tong_gn = sum(g.lines.map((l) => l.tien_gn));
      if (g.so_tien != null && Math.abs(g.so_tien - g.tong_gn) > 1) warnings.push(`KUNN ${g.so_kunn || '(chưa có số)'}: tổng các dòng ${fmtMoney(g.tong_gn)} ≠ số tiền KUNN ${fmtMoney(g.so_tien)}`);
    }
    return { groups: out, warnings };
  }

  /** Một sheet → kết quả nhận dạng tự động (không AI). */
  function autoParseSheet(grid) {
    const h = detectHeader(grid);
    if (h.row < 0) return { ok: false, header: h, groups: [], warnings: ['Không tìm thấy hàng tiêu đề cột'] };
    const title = extractTitleInfo(grid, h.row);
    const dataHeader = h.twoRow ? h.row + 1 : h.row;
    if (!h.ok) return { ok: false, header: h, title, dataHeader, groups: [], warnings: ['Không tự nhận ra cột số hóa đơn / số tiền — chọn cột bằng tay hoặc nhờ AI'] };
    const { groups, warnings } = extractRows(grid, dataHeader, h.map, title);
    return { ok: groups.length > 0, header: h, title, dataHeader, groups, warnings };
  }

  /** Chọn sheet có vẻ là bảng kê nhất trong workbook ({name: grid}). */
  function pickSheet(sheets) {
    let best = null;
    for (const [name, grid] of Object.entries(sheets)) {
      const h = detectHeader(grid);
      const nLines = h.ok ? extractRows(grid, h.row, h.map, {}).groups.reduce((a, g) => a + g.lines.length, 0) : 0;
      const score = (h.ok ? 1000 : 0) + h.score * 10 + Math.min(nLines, 500) / 100;
      if (!best || score > best.score) best = { name, score, header: h, nLines };
    }
    return best;
  }

  // ─── tiền, tổng ──────────────────────────────────────────────
  function sum(arr) { let s = 0; for (const x of arr) if (typeof x === 'number' && Number.isFinite(x)) s += x; return s; }
  let NUMFMT = 'us';
  try { if (typeof localStorage !== 'undefined' && localStorage.getItem('bangke_numfmt') === 'vn') NUMFMT = 'vn'; } catch (e) { /* mặc định */ }
  const numLoc = () => (NUMFMT === 'vn' ? 'vi-VN' : 'en-US');
  const setNumFmt = (x) => { NUMFMT = x === 'vn' ? 'vn' : 'us'; };
  const getNumFmt = () => NUMFMT;
  /** Lãi suất / tỷ lệ: 8.2 (mặc định) hoặc 8,2 (kiểu Việt). */
  const fmtRate = (v) => (v == null || v === '' ? '' : NUMFMT === 'vn' ? String(v).replace('.', ',') : String(v));
  function fmtMoney(n, cur) {
    if (n == null || !Number.isFinite(n)) return '';
    const isVnd = !cur || /VN/.test(cur);
    return n.toLocaleString(numLoc(), { maximumFractionDigits: isVnd ? 0 : 2, minimumFractionDigits: 0 });
  }
  const tolOf = (cur) => (!cur || /VN/i.test(cur) ? 1 : 0.01);

  // ─── nhận diện hóa đơn ───────────────────────────────────────
  function supId(line) { return mstKey(line.mst_ncc) || supKey(line.ncc); }
  function weakKey(line) { const s = supId(line), n = invNo(line.so_hd); return s && n ? `${s}|${n}` : ''; }
  function strongKey(line) {
    const w = weakKey(line);
    if (!w) return '';
    const kh = fold(line.ky_hieu).replace(/[^a-z0-9]/g, '');
    return `${w}|${line.ngay_hd || '?'}${kh ? '|' + kh : ''}`;
  }
  function kunnOrder(a, b) {
    return (a.ngay_gn || '9999').localeCompare(b.ngay_gn || '9999') || (a.createdAt || 0) - (b.createdAt || 0)
      || String(a.so_kunn || '').localeCompare(String(b.so_kunn || ''), 'vi', { numeric: true });
  }

  /**
   * Phân tích sổ theo dõi của một khách hàng.
   * kunns: [{id, so_kunn, ngay_gn, lines:[{id, ncc, so_hd, ngay_hd, tien_hd, tien_gn, ...}]}]
   * Trả về:
   *   invoices: [{key, ncc, so_hd, ngay_hd, tien_hd, tong_gn, con_lai, uses:[…], status}]
   *   lineInfo: Map(lineId → {key, luy_ke_truoc, luy_ke_sau, con_lai_sau, status, flags[]})
   *   alerts:   [{type, sev, text, key}]
   */
  function analyze(kunns) {
    const sorted = [...kunns].sort(kunnOrder);
    const inv = new Map();
    const weak = new Map();
    const lineInfo = new Map();
    const alerts = [];
    for (const k of sorted) {
      const seenInK = new Map();
      (k.lines || []).forEach((l, i) => {
        const key = strongKey(l);
        const lid = l.id || `${k.id}#${i}`;
        if (l.lech) { lineInfo.set(lid, { key: '', status: 'lech_cot', flags: ['lech_cot'] }); return; }
        if (!key) { lineInfo.set(lid, { key: '', status: 'thieu_tt', flags: ['thieu_tt'] }); return; }
        let iv = inv.get(key);
        if (!iv) {
          iv = { key, ncc: l.ncc, mst_ncc: l.mst_ncc || '', so_hd: l.so_hd, ky_hieu: l.ky_hieu || '', ngay_hd: l.ngay_hd, tien_hd: null, loai_tien: l.loai_tien || '', tong_gn: 0, uses: [] };
          inv.set(key, iv);
        }
        if (l.tien_hd != null && (iv.tien_hd == null || l.tien_hd > iv.tien_hd)) iv.tien_hd = l.tien_hd;
        const before = iv.tong_gn;
        iv.tong_gn += l.tien_gn || 0;
        const use = { kunnId: k.id, so_kunn: k.so_kunn, ngay_gn: k.ngay_gn, lineId: lid, tien_gn: l.tien_gn || 0, tien_hd: l.tien_hd };
        iv.uses.push(use);
        const flags = [];
        if (seenInK.has(key)) {
          flags.push('trung_file');
          const first = lineInfo.get(seenInK.get(key));
          if (first && !first.flags.includes('trung_file')) first.flags.push('trung_file');   // đánh dấu cả dòng kê trước
        } else seenInK.set(key, lid);
        lineInfo.set(lid, { key, luy_ke_truoc: before, luy_ke_sau: iv.tong_gn, flags, kunnId: k.id });
        const wk = weakKey(l);
        if (!weak.has(wk)) weak.set(wk, new Set());
        weak.get(wk).add(l.ngay_hd || '?');
      });
    }
    // kết luận theo hóa đơn
    for (const iv of inv.values()) {
      const tol = tolOf(iv.loai_tien);
      iv.con_lai = iv.tien_hd == null ? null : iv.tien_hd - iv.tong_gn;
      iv.n_kunn = new Set(iv.uses.map((u) => u.kunnId)).size;
      if (iv.tien_hd == null) iv.status = 'chua_ro';
      else if (iv.tong_gn > iv.tien_hd + tol) iv.status = 'vuot';
      else if (iv.tong_gn >= iv.tien_hd - tol) iv.status = 'du';
      else iv.status = 'mot_phan';
      // từng lần dùng: lần nào làm lũy kế vượt tiền hóa đơn → lỗi ở lần đó
      for (const u of iv.uses) {
        const li = lineInfo.get(u.lineId);
        li.tien_hd = iv.tien_hd;
        li.con_lai_sau = iv.tien_hd == null ? null : iv.tien_hd - li.luy_ke_sau;
        if (iv.tien_hd != null && li.luy_ke_sau > iv.tien_hd + tol) {
          li.flags.push(li.luy_ke_truoc >= iv.tien_hd - tol ? 'da_du' : 'vuot');
        } else if (li.luy_ke_truoc > tol) li.flags.push('tiep');
      }
      if (iv.status === 'vuot') alerts.push({ type: 'vuot', sev: 3, key: iv.key, text: `${iv.ncc} — HĐ ${iv.so_hd} (${fmtDate(iv.ngay_hd)}): đã giải ngân ${fmtMoney(iv.tong_gn)} > tiền hóa đơn ${fmtMoney(iv.tien_hd)} qua ${iv.n_kunn} KUNN (${[...new Set(iv.uses.map((u) => u.so_kunn))].join(', ')})` });
    }
    // cùng NCC + cùng số HĐ nhưng khác ngày trong cùng năm → nghi trùng / nhập sai ngày
    for (const [wk, dates] of weak) {
      const ds = [...dates].filter((d) => d !== '?');
      const byYear = new Map();
      for (const d of ds) { const y = d.slice(0, 4); byYear.set(y, (byYear.get(y) || 0) + 1); }
      const hasUnknown = dates.has('?') && ds.length > 0;
      if ([...byYear.values()].some((n) => n > 1) || hasUnknown) {
        const ivs = [...inv.values()].filter((iv) => weakKey(iv) === wk);
        for (const iv of ivs) for (const u of iv.uses) lineInfo.get(u.lineId).flags.push('nghi_trung');
        const f = ivs[0];
        alerts.push({ type: 'nghi_trung', sev: 2, key: wk, text: `${f.ncc} — HĐ số ${f.so_hd} xuất hiện với nhiều ngày khác nhau (${ds.map(fmtDate).join(', ')}${hasUnknown ? ', không ngày' : ''}) — kiểm tra có phải cùng một hóa đơn` });
      }
    }
    for (const k of sorted) (k.lines || []).forEach((l, i) => {
      const li = lineInfo.get(l.id || `${k.id}#${i}`);
      if (!li) return;
      if (li.flags.includes('trung_file') && li.luy_ke_truoc > 0) alerts.push({ type: 'trung_file', sev: 3, key: li.key, text: `KUNN ${k.so_kunn}: hóa đơn ${l.so_hd} của ${l.ncc} kê 2 lần trong cùng KUNN` });
      if (l.tien_hd != null && l.tien_gn != null && l.tien_gn > l.tien_hd + tolOf(l.loai_tien)) {
        li.flags.push('vuot');
      }
      li.status = worstFlag(li.flags);
    });
    const invoices = [...inv.values()].sort((a, b) => (a.ncc || '').localeCompare(b.ncc || '', 'vi') || (a.ngay_hd || '').localeCompare(b.ngay_hd || ''));
    return { invoices, lineInfo, alerts: alerts.sort((a, b) => b.sev - a.sev) };
  }

  function worstFlag(flags) {
    if (!flags || !flags.length) return 'moi';
    let w = 'moi', s = -1;
    for (const f of flags) { const sv = CHECK[f] ? CHECK[f].sev : 0; if (sv > s) { s = sv; w = f; } }
    return w;
  }

  /**
   * Kiểm tra bảng kê MỚI (chưa lưu) với sổ hiện có — dùng trước khi giải ngân.
   * Trả về các dòng mới kèm status + lịch sử những lần đã giải ngân hóa đơn đó.
   */
  function checkNew(existingKunns, newGroups) {
    const pending = newGroups.map((g, gi) => ({
      id: `__new${gi}`, so_kunn: g.so_kunn || '(mới)', ngay_gn: g.ngay_gn || '9999-12-31', createdAt: Number.MAX_SAFE_INTEGER - 100 + gi,
      lines: g.lines.map((l, i) => ({ ...l, id: `__new${gi}#${i}` })),
    }));
    // KUNN cùng số đã có trong sổ → coi như sẽ được thay thế, không tính vào lịch sử
    const replacing = new Set(newGroups.map((g) => normKunn(g.so_kunn)).filter(Boolean));
    const base = existingKunns.filter((k) => !replacing.has(normKunn(k.so_kunn)));
    const res = analyze([...base, ...pending]);
    const invByKey = new Map(res.invoices.map((iv) => [iv.key, iv]));
    const counts = { moi: 0, tiep: 0, vuot: 0, da_du: 0, trung_file: 0, nghi_trung: 0, thieu_tt: 0, lech_cot: 0 };
    const out = pending.map((k, gi) => ({
      ...newGroups[gi],
      exists: existingKunns.some((e) => normKunn(e.so_kunn) && normKunn(e.so_kunn) === normKunn(newGroups[gi].so_kunn)),
      lines: k.lines.map((l) => {
        const li = res.lineInfo.get(l.id) || { flags: [], status: 'thieu_tt' };
        const iv = li.key ? invByKey.get(li.key) : null;
        const history = iv ? iv.uses.filter((u) => !String(u.kunnId).startsWith('__new')) : [];
        const status = li.status || 'moi';
        counts[status] = (counts[status] || 0) + 1;
        return { ...l, check: { status, flags: li.flags, luy_ke_truoc: li.luy_ke_truoc || 0, con_lai_truoc: iv && iv.tien_hd != null ? iv.tien_hd - (li.luy_ke_truoc || 0) : null, con_lai_sau: li.con_lai_sau ?? null, history } };
      }),
    }));
    const errors = counts.vuot + counts.da_du + counts.trung_file;
    return { groups: out, counts, errors };
  }

  function normKunn(s) { return fold(s).replace(/\s+/g, ''); }

  // ─── hồ sơ gốc ───────────────────────────────────────────────
  /** Tóm tắt một KUNN: số dòng, tổng, tình trạng hồ sơ gốc, quá hạn. */
  function kunnSummary(k, opts = {}) {
    const today = opts.today || todayISO();
    if (k.manual && !(k.lines || []).length) {          // KUNN nhập tay: theo danh sách chứng từ bổ sung (không có dòng hóa đơn)
      const it = k.bs || [], pend = it.filter((b) => !b.xong), h = pend.map((b) => toISO(b.han)).filter(Boolean).sort()[0] || '', done = !pend.length;
      return { n: it.length, nDa: it.length - pend.length, nThieu: 0, nChua: pend.length, tong_gn: k.so_tien || 0, han: h, quaHan: !done && h && today > h ? daysBetween(h, today) : 0, goc: done ? 'da_nhan' : 'chua', done };
    }
    const hanNgay = opts.hanNgay ?? 30;
    const lines = k.lines || [];
    const n = lines.length;
    const nDa = lines.filter((l) => l.goc === 'da_nhan').length;
    const nThieu = lines.filter((l) => l.goc === 'thieu').length;
    const nChua = n - nDa - nThieu;
    const han = k.han_bs || (k.ngay_gn ? addDays(k.ngay_gn, hanNgay) : '');
    const done = n > 0 && nDa === n;
    const quaHan = !done && han && today > han ? daysBetween(han, today) : 0;
    let goc = done ? 'da_nhan' : nDa + nThieu === 0 ? 'chua' : 'thieu';
    return { n, nDa, nThieu, nChua, tong_gn: sum(lines.map((l) => l.tien_gn)), han, quaHan, goc, done };
  }
  function addDays(isoStr, n) {
    const t = new Date(Date.parse(isoStr + 'T00:00:00Z') + n * 86400000);
    return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }

  /** Tóm tắt khách hàng (lưu lên hồ sơ khách hàng để trang tổng quan không phải tải hết KUNN). */
  function customerSummary(kunns, opts = {}) {
    const a = analyze(kunns);
    let nPending = 0, nQuaHan = 0, maxQuaHan = 0, nLines = 0, tong = 0;
    let last = '';
    for (const k of kunns) {
      const s = kunnSummary(k, opts);
      nLines += s.n; tong += s.tong_gn;
      if (!s.done) nPending++;
      if (s.quaHan > 0) { nQuaHan++; maxQuaHan = Math.max(maxQuaHan, s.quaHan); }
      if ((k.ngay_gn || '') > last) last = k.ngay_gn;
    }
    const partial = a.invoices.filter((iv) => iv.status === 'mot_phan');
    return {
      n_kunn: kunns.length, n_lines: nLines, tong_gn: tong, last_gn: last,
      n_hd: a.invoices.length,
      n_mot_phan: partial.length, con_lai: sum(partial.map((iv) => iv.con_lai)),
      n_vuot: a.alerts.filter((x) => x.type === 'vuot' || x.type === 'trung_file').length,
      n_nghi: a.alerts.filter((x) => x.type === 'nghi_trung').length,
      n_pending: nPending, n_qua_han: nQuaHan, max_qua_han: maxQuaHan,
      at: Date.now(),
    };
  }

  // ─── tiện ích ────────────────────────────────────────────────
  function uid(n = 10) {
    const a = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let s = '';
    for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  /** Chuẩn bị dòng để lưu: gắn id, bỏ trường tạm. */
  function cleanLine(l) {
    const o = {
      id: l.id && !String(l.id).startsWith('__new') ? l.id : uid(),
      stt: l.stt || '', ncc: l.ncc || '', mst_ncc: l.mst_ncc || '', so_hdmb: l.so_hdmb || '', ky_hieu: l.ky_hieu || '',
      so_hd: l.so_hd || '', ngay_hd: l.ngay_hd || '', tien_hd: l.tien_hd ?? null, tien_gn: l.tien_gn ?? null,
      loai_tien: l.loai_tien || '', goc: l.goc || 'chua', thieu: l.thieu || '', ngay_nhan: l.ngay_nhan || '', ghi_chu: l.ghi_chu || '', lech: l.lech || '', raw: l.raw || '', row: l.row || '', ack: l.ack || [],
    };
    return o;
  }

  /** Bản xem trước dạng chữ cho AI: mỗi hàng "số hàng | A: … | B: …", cắt bớt ô dài. */
  function gridToPrompt(grid, maxRows = 60, maxCell = 60) {
    const out = [];
    let n = 0;
    for (let r = 0; r < grid.length && n < maxRows; r++) {
      const row = grid[r] || [];
      const cells = [];
      row.forEach((v, c) => {
        if (v == null || String(v).trim() === '') return;
        let s = typeof v === 'number' ? String(v) : String(v).replace(/\s+/g, ' ').trim();
        if (s.length > maxCell) s = s.slice(0, maxCell) + '…';
        cells.push(`${colName(c)}: ${s}`);
      });
      if (!cells.length) continue;
      out.push(`[${r + 1}] ${cells.join(' | ')}`);
      n++;
    }
    return out.join('\n');
  }

  /** Đọc JSON từ chữ AI trả về (có thể bọc ```json). */
  function parseAIJson(text) {
    if (!text) throw new Error('AI không trả lời');
    let s = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('AI trả lời không đúng dạng JSON');
    return JSON.parse(s.slice(a, b + 1));
  }

  /** Kết quả AI (cột dạng chữ cái) → map {field: colIndex}. */
  function aiMappingToMap(cols) {
    const map = {};
    for (const f of FIELDS) {
      const v = cols && cols[f.k];
      const i = colIndex(v);
      if (i >= 0) map[f.k] = i;
    }
    return map;
  }

  /** Dòng AI đọc toàn bộ (chế độ bảng kê lộn xộn) → nhóm KUNN. */
  function aiRowsToGroups(rows, defaults = {}) {
    const groups = new Map();
    for (const r of rows || []) {
      const so = String(r.so_kunn || defaults.so_kunn || '').trim();
      if (!groups.has(so)) groups.set(so, { so_kunn: so, ngay_gn: toISO(r.ngay_gn) || defaults.ngay_gn || '', ngay_dh: toISO(r.ngay_dh) || defaults.ngay_dh || '', so_tien: parseAmount(r.so_tien_kunn) ?? defaults.so_tien_kunn ?? null, lines: [] });
      const g = groups.get(so);
      const hs = classifyDocNote(r.ho_so);
      const tien_hd = parseAmount(r.tien_hd);
      let tien_gn = parseAmount(r.tien_gn);
      if (tien_gn == null) tien_gn = tien_hd;
      if (!r.so_hd && tien_gn == null) continue;
      g.lines.push({
        stt: String(r.stt ?? ''), ncc: String(r.ncc || '').trim(), mst_ncc: String(r.mst_ncc || '').trim(), so_hdmb: String(r.so_hdmb || '').trim(),
        ky_hieu: String(r.ky_hieu || '').trim(), so_hd: String(r.so_hd ?? '').trim(), ngay_hd: toISO(r.ngay_hd), tien_hd, tien_gn,
        loai_tien: String(r.loai_tien || '').toUpperCase().replace(/^VN.*/, ''), goc: r.ho_so ? hs.goc : 'chua', thieu: hs.thieu || '', ghi_chu: [r.ghi_chu, hs.note].filter(Boolean).join(' · '),
        row: r.row || '',
      });
    }
    const out = [...groups.values()].filter((g) => g.lines.length);
    for (const g of out) g.tong_gn = sum(g.lines.map((l) => l.tien_gn));
    return out;
  }

  // ─── kiểm tra phân bổ cột & đơn vị tiền khi nạp ───
  const UNITS = {
    dong: { label: 'Đồng (VND)', scale: 1, cur: '' },
    nghin: { label: 'Nghìn đồng', scale: 1000, cur: '' },
    trieu: { label: 'Triệu đồng', scale: 1e6, cur: '' },
    USD: { label: 'USD', scale: 1, cur: 'USD' },
    EUR: { label: 'EUR', scale: 1, cur: 'EUR' },
    JPY: { label: 'JPY', scale: 1, cur: 'JPY' },
    CNY: { label: 'CNY', scale: 1, cur: 'CNY' },
  };
  /** Đoán đơn vị tiền từ dòng "ĐVT: …" phía trên bảng hoặc chữ trong tiêu đề cột tiền. */
  function detectUnit(grid, headerRow, map = {}) {
    const top = grid.slice(0, Math.max(0, headerRow) + 2).flat().filter((v) => typeof v === 'string').map(fold);
    for (const t of top) {
      const m = /(dvt|don vi tinh|don vi)\s*[:.]?\s*(.{0,24})/.exec(t);
      if (!m) continue;
      const u = m[2];
      if (/trieu/.test(u)) return { unit: 'trieu', src: 'dòng ĐVT trong file' };
      if (/nghin|ngan|1\.?000|1,000/.test(u)) return { unit: 'nghin', src: 'dòng ĐVT trong file' };
      if (/usd|do la|dollar/.test(u)) return { unit: 'USD', src: 'dòng ĐVT trong file' };
      if (/eur/.test(u)) return { unit: 'EUR', src: 'dòng ĐVT trong file' };
      if (/dong|vnd/.test(u)) return { unit: 'dong', src: 'dòng ĐVT trong file' };
    }
    const hdr = grid[headerRow] || [];
    for (const f of ['tien_gn', 'tien_hd']) {
      const t = map[f] != null ? fold(hdr[map[f]]) : '';
      if (/usd/.test(t)) return { unit: 'USD', src: 'tiêu đề cột tiền ghi USD' };
      if (/eur/.test(t)) return { unit: 'EUR', src: 'tiêu đề cột tiền ghi EUR' };
      if (/trieu/.test(t)) return { unit: 'trieu', src: 'tiêu đề cột tiền ghi triệu' };
      if (/nghin|1\.000/.test(t)) return { unit: 'nghin', src: 'tiêu đề cột tiền ghi nghìn' };
    }
    return { unit: 'dong', src: '' };
  }
  /** Áp đơn vị: nhân hệ số (nghìn/triệu đồng) hoặc gắn loại tiền; curRows: [{from,to,currency}] theo số hàng Excel. */
  function applyUnit(groups, unit = 'dong', curRows = []) {
    const u = UNITS[unit] || UNITS.dong;
    for (const g of groups) {
      if (u.scale !== 1 && g.so_tien != null) g.so_tien *= u.scale;
      for (const l of g.lines) {
        const cr = curRows.find((x) => l.row >= x.from && l.row <= x.to);
        if (/^VN/i.test(l.loai_tien || '')) l.loai_tien = '';   // "VND" = trống (quy ước: để trống là đồng)
        const cur = (cr && cr.currency && !/^VN/i.test(cr.currency) ? cr.currency.toUpperCase() : '') || l.loai_tien || u.cur;
        if (!l.loai_tien && cur) l.loai_tien = cur;
        if (u.scale !== 1 && !l.loai_tien) { if (l.tien_hd != null) l.tien_hd = Math.round(l.tien_hd * u.scale); if (l.tien_gn != null) l.tien_gn = Math.round(l.tien_gn * u.scale); }
      }
      g.tong_gn = sum(g.lines.map((l) => l.tien_gn));
    }
    return groups;
  }
  /**
   * Kiểm tra từng cột đã chọn có đúng kiểu dữ liệu không (số HĐ, ngày, số tiền…) trên các dòng dữ liệu.
   * Trả về { fields: {field: {col, n, samples, issues[]}}, issues: [{field, sev, text}] }.
   */
  function profileColumns(grid, dataHeader, map, groups = [], unit = 'dong') {
    const rows = grid.slice(dataHeader + 1, dataHeader + 1 + 4000).filter((r) => r && r.some((v) => String(v).trim() !== ''));
    const fields = {}, issues = [];
    const isDateNum = (v) => typeof v === 'number' && Number.isInteger(v) && v > 30000 && v < 60000;
    const isId = (v) => typeof v === 'number' && Number.isInteger(v) && v >= 1e11;   // số tờ khai 11–12 chữ số (≥ 100 tỷ — hiếm khi là tiền 1 hóa đơn)
    for (const f of FIELDS) {
      const c = map[f.k]; if (c == null || c < 0) continue;
      const vals = rows.map((r) => r[c]).filter((v) => v != null && String(v).trim() !== '' && !(typeof v === 'string' && TOTAL_RE.test(fold(v))));
      const n = vals.length;
      const st = { n, num: 0, dec: 0, date: 0, id: 0, text: 0 };
      for (const v of vals) {
        if (typeof v === 'number') { st.num++; if (!Number.isInteger(v)) st.dec++; if (isDateNum(v)) st.date++; if (isId(v)) st.id++; }
        else if (toISO(v)) st.date++;
        else if (parseAmount(v) != null) { st.num++; if (!Number.isInteger(parseAmount(v))) st.dec++; }
        else st.text++;
      }
      const pct = (x) => (n ? x / n : 0);
      const fi = { col: c, n, samples: [...new Set(vals.slice(0, 40).map((v) => (typeof v === 'number' ? numStr(v) : String(v).trim().slice(0, 30))))].slice(0, 3), issues: [] };
      const add = (sev, text) => { fi.issues.push(text); issues.push({ field: f.k, sev, text: `${f.label} (cột ${colName(c)}): ${text}` }); };
      if (n >= 3) {
        if (f.k === 'so_hd') {
          if (pct(st.dec) > 0.2) add(3, `${Math.round(pct(st.dec) * 100)}% giá trị có phần lẻ — giống SỐ TIỀN, không phải số hóa đơn`);
          else if (pct(st.date) > 0.5 && st.text < n / 4) add(2, 'phần lớn giá trị giống NGÀY (số sê-ri Excel)');
        }
        if (f.type === 'date' && pct(st.date) < 0.6) add(3, `chỉ ${Math.round(pct(st.date) * 100)}% giá trị là ngày${st.id ? ` — có ${st.id} số dài giống số tờ khai` : ''}`);
        if (f.type === 'num') {
          if (pct(st.text) > 0.15) add(3, `${st.text}/${n} ô là chữ (vd “${String(vals.find((v) => typeof v === 'string' && parseAmount(v) == null && !toISO(v))).slice(0, 24)}”) — có thể chọn nhầm cột`);
          if (f.k !== 'so_tien_kunn' && pct(st.id) > 0.15) add(3, `${st.id}/${n} ô là số 11–13 chữ số — giống số tờ khai, không phải số tiền`);
          if (pct(st.dec) > 0.25 && (UNITS[unit] || UNITS.dong).cur === '' && unit === 'dong') add(2, `${Math.round(pct(st.dec) * 100)}% số tiền có phần lẻ — có thể là NGOẠI TỆ (USD…), chọn lại đơn vị tiền`);
          const nums = vals.map((v) => parseAmount(v)).filter((x) => x != null && x > 0).sort((a, b) => a - b);
          const med = nums.length ? nums[Math.floor(nums.length / 2)] : null;
          if (med != null && unit === 'dong' && med < 10000 && pct(st.dec) <= 0.25) add(2, `số tiền điển hình chỉ ${numStr(med)} — đơn vị có thể là NGHÌN / TRIỆU đồng hoặc ngoại tệ`);
          fi.median = med;
        }
        if ((f.k === 'ncc') && pct(st.num) > 0.5) add(3, 'phần lớn là số — không phải tên nhà cung cấp');
      }
      fields[f.k] = fi;
    }
    const ls = groups.flatMap((g) => g.lines).filter((l) => l.tien_hd != null && l.tien_gn != null && !l.lech);
    const over = ls.filter((l) => l.tien_gn > l.tien_hd + 1).length;
    if (ls.length >= 5 && over / ls.length > 0.3) issues.push({ field: 'tien_gn', sev: 2, text: `Tiền giải ngân > tiền hóa đơn ở ${over}/${ls.length} dòng — có thể chọn đảo 2 cột tiền, hoặc cột giải ngân là cột tổng` });
    if (map.so_hd == null) issues.push({ field: 'so_hd', sev: 3, text: 'Chưa chọn cột Số hóa đơn' });
    if (map.tien_gn == null && map.tien_hd == null) issues.push({ field: 'tien_gn', sev: 3, text: 'Chưa chọn cột số tiền' });
    return { fields, issues: issues.sort((a, b) => b.sev - a.sev) };
  }

  // ─── kiểm tra dữ liệu ĐÃ NẠP (không cần file gốc) ───
  /** Soát các trường đã lưu của một khách hàng: sức khỏe từng trường + bất thường theo KUNN kèm đề xuất sửa. */
  function storedProfile(kunns) {
    const all = kunns.flatMap((k) => (k.lines || []).map((l) => ({ k, l })));
    const n = all.length;
    const cnt = (f) => all.filter(f).length;
    const isDec = (v) => v != null && !Number.isInteger(Math.round(v * 1000) / 1000);
    const fields = [
      ['so_hd', 'Số hóa đơn', cnt(({ l }) => !String(l.so_hd || '').trim()), cnt(({ l }) => /^\d+[.,]\d{1,2}$/.test(String(l.so_hd || '').trim())), 'số HĐ có phần lẻ (giống số tiền)'],
      ['ngay_hd', 'Ngày hóa đơn', cnt(({ l }) => !l.ngay_hd), cnt(({ k, l }) => l.ngay_hd && k.ngay_gn && l.ngay_hd > k.ngay_gn), 'ngày HĐ sau ngày giải ngân'],
      ['ncc', 'Nhà cung cấp', cnt(({ l }) => !String(l.ncc || '').trim()), cnt(({ l }) => /^\s*[\d.,]+\s*$/.test(String(l.ncc || ''))), 'tên NCC là số'],
      ['tien_hd', 'Số tiền hóa đơn', cnt(({ l }) => l.tien_hd == null), cnt(({ l }) => !l.loai_tien && isDec(l.tien_hd)), 'số lẻ mà không ghi loại tiền'],
      ['tien_gn', 'Số tiền giải ngân', cnt(({ l }) => l.tien_gn == null), cnt(({ l }) => l.tien_hd != null && l.tien_gn != null && l.tien_gn > l.tien_hd + 1), 'GN > tiền HĐ'],
      ['loai_tien', 'Loại tiền', 0, cnt(({ l }) => l.loai_tien && !/^(VND|USD|EUR|JPY|CNY|GBP|KRW|SGD|THB|AUD|HKD|TWD)$/.test(l.loai_tien)), 'loại tiền lạ'],
    ].map(([k, label, empty, bad, badText]) => ({ k, label, n, empty, bad, badText }));
    const extra = { lech: cnt(({ l }) => l.lech), noRaw: cnt(({ l }) => !l.raw) };
    // bất thường theo KUNN
    const med = (xs) => { const a = xs.filter((x) => x != null && x > 0).sort((p, q) => p - q); return a.length ? a[Math.floor(a.length / 2)] : null; };
    const st = kunns.map((k) => {
      const ls = (k.lines || []).filter((l) => !l.lech);
      const vnd = ls.filter((l) => !l.loai_tien);
      return { k, ls, vnd, med: med(vnd.map((l) => l.tien_gn ?? l.tien_hd)), dec: ls.length ? ls.filter((l) => !l.loai_tien && (isDec(l.tien_gn) || isDec(l.tien_hd))).length / ls.length : 0,
        over: ls.filter((l) => l.tien_hd != null && l.tien_gn != null).length ? ls.filter((l) => l.tien_hd != null && l.tien_gn != null && l.tien_gn > l.tien_hd + 1).length / ls.filter((l) => l.tien_hd != null && l.tien_gn != null).length : 0 };
    });
    const custMed = med(st.map((x) => x.med));
    const issues = [];
    for (const x of st) {
      const k = x.k, nl = x.ls.length;
      if (!nl) continue;
      if (x.dec >= 0.3) issues.push({ kid: k.id, so_kunn: k.so_kunn, type: 'ngoai_te', text: `${Math.round(x.dec * 100)}% dòng có số tiền lẻ mà không ghi loại tiền — có thể là ngoại tệ`, fix: { action: 'currency', currency: 'USD' } });
      else if (x.med && custMed && x.med * 500 < custMed && nl >= 2) {
        const factor = custMed / x.med >= 3e5 ? 1e6 : 1000;
        issues.push({ kid: k.id, so_kunn: k.so_kunn, type: 'don_vi', text: `Số tiền điển hình ${fmtMoney(x.med)} — nhỏ hơn ~${fmtMoney(Math.round(custMed / x.med))} lần các KUNN khác của khách hàng (có thể ghi theo ${factor === 1000 ? 'nghìn' : 'triệu'} đồng)`, fix: { action: 'scale', factor } });
      }
      if (k.so_tien != null && x.vnd.length) {
        const s = sum(x.vnd.map((l) => l.tien_gn));
        for (const f of [1000, 1e6]) if (s > 0 && Math.abs(s * f - k.so_tien) / k.so_tien < 0.01) issues.push({ kid: k.id, so_kunn: k.so_kunn, type: 'don_vi', text: `Tổng các dòng ${fmtMoney(s)} × ${fmtMoney(f)} ≈ số tiền KUNN ${fmtMoney(k.so_tien)} — dòng đang ghi theo ${f === 1000 ? 'nghìn' : 'triệu'} đồng`, fix: { action: 'scale', factor: f } });
      }
      if (x.over >= 0.5 && nl >= 2) {
        // GN = tổng 2 ô số trong dòng gốc (vd thuế NK + thuế GTGT) → cột tiền HĐ chỉ là một phần, không phải đảo cột
        const overL = x.ls.filter((l) => l.tien_hd != null && l.tien_gn != null && l.tien_gn > l.tien_hd + 1);
        const nums = (raw) => (String(raw || '').match(/(?:^|\| )[A-Z]{1,3}: (-?\d+(?:\.\d+)?)(?= \||$)/g) || []).map((t) => +t.replace(/^.*: /, ''));
        const isSum = (l) => { const a = nums(l.raw); for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) if (Math.abs(a[i] + a[j] - l.tien_gn) <= 1 && (Math.abs(a[i] - l.tien_hd) <= 1 || Math.abs(a[j] - l.tien_hd) <= 1)) return true; return false; };
        const nSum = overL.filter(isSum).length;
        if (overL.length && nSum / overL.length >= 0.5) issues.push({ kid: k.id, so_kunn: k.so_kunn, type: 'cot_tong', text: `${nSum}/${overL.length} dòng: tiền GN = tổng 2 khoản trong dòng (vd thuế NK + GTGT), cột tiền HĐ chỉ lấy 1 khoản`, fix: { action: 'hd_from_gn' } });
        else issues.push({ kid: k.id, so_kunn: k.so_kunn, type: 'dao_cot', text: `${Math.round(x.over * 100)}% dòng có tiền giải ngân > tiền hóa đơn — có thể đảo 2 cột tiền`, fix: { action: 'swap' } });
      }
    }
    const seen = new Set();
    return { n, fields, extra, issues: issues.filter((i) => { const key = i.kid + i.type; if (seen.has(key)) return false; seen.add(key); return true; }) };
  }
  /** Sửa cả KUNN theo đề xuất → danh sách patch dòng. */
  function kunnFixPatches(k, fix) {
    const out = [];
    for (const l of k.lines || []) {
      if (l.lech) continue;
      if (fix.action === 'currency' && !l.loai_tien) out.push({ id: l.id, loai_tien: String(fix.currency || 'USD').toUpperCase() });
      if (fix.action === 'scale' && !l.loai_tien) out.push({ id: l.id, tien_hd: l.tien_hd == null ? null : Math.round(l.tien_hd * fix.factor), tien_gn: l.tien_gn == null ? null : Math.round(l.tien_gn * fix.factor) });
      if (fix.action === 'swap') out.push({ id: l.id, tien_hd: l.tien_gn ?? null, tien_gn: l.tien_hd ?? null });
      if (fix.action === 'hd_from_gn' && l.tien_gn != null && (l.tien_hd == null || l.tien_gn > l.tien_hd)) out.push({ id: l.id, tien_hd: l.tien_gn });
    }
    return out;
  }

  // ─── rà soát logic bảng kê ───
  const AUDIT = {
    lech_cot: { label: 'Lệch cột', sev: 3 },
    gn_gt_hd: { label: 'Giải ngân > tiền hóa đơn', sev: 3 },
    hd_sau_gn: { label: 'Ngày HĐ sau ngày giải ngân', sev: 2 },
    hd_qua_cu: { label: 'Hóa đơn cũ hơn 2 năm', sev: 1 },
    ngoai_te: { label: 'Số lẻ — có thể là ngoại tệ', sev: 2 },
    thieu_so_hd: { label: 'Thiếu / lạ số hóa đơn', sev: 2 },
    thieu_ncc: { label: 'Thiếu nhà cung cấp', sev: 2 },
    thieu_tien: { label: 'Thiếu số tiền', sev: 2 },
    thieu_ngay: { label: 'Thiếu ngày hóa đơn', sev: 1 },
    tong_lech: { label: 'Tổng dòng ≠ số tiền KUNN', sev: 1 },
  };
  /** Rà một KUNN theo luật → [{lineId, idx, type, sev, text}]. Bỏ qua loại lỗi người dùng đã xác nhận đúng (line.ack). */
  function auditKunn(k) {
    const out = [];
    const lines = k.lines || [];
    lines.forEach((l, i) => {
      const add = (type, text) => { if (!(l.ack || []).includes(type)) out.push({ lineId: l.id, idx: i, type, sev: AUDIT[type].sev, text }); };
      const cur = l.loai_tien || '';
      const vnd = !cur || /VN/i.test(cur);
      if (l.lech) add('lech_cot', l.lech);
      if (l.tien_hd != null && l.tien_gn != null && l.tien_gn > l.tien_hd + (vnd ? 1 : 0.01)) add('gn_gt_hd', `GN ${fmtMoney(l.tien_gn, cur)} > tiền HĐ ${fmtMoney(l.tien_hd, cur)}`);
      if (l.ngay_hd && k.ngay_gn && l.ngay_hd > k.ngay_gn) add('hd_sau_gn', `HĐ ngày ${fmtDate(l.ngay_hd)} — sau ngày GN ${fmtDate(k.ngay_gn)}`);
      if (l.ngay_hd && k.ngay_gn && daysBetween(l.ngay_hd, k.ngay_gn) > 730) add('hd_qua_cu', `HĐ ngày ${fmtDate(l.ngay_hd)}, trước GN ${daysBetween(l.ngay_hd, k.ngay_gn)} ngày`);
      if (vnd && [l.tien_hd, l.tien_gn].some((v) => v != null && !Number.isInteger(Math.round(v * 1000) / 1000) && Math.abs(v) < 1e8)) add('ngoai_te', 'Số tiền có phần lẻ mà không ghi loại tiền');
      const so = String(l.so_hd || '').trim();
      if (!l.lech && (!so || !/\d/.test(so) || so.length > 30)) add('thieu_so_hd', so ? `Số HĐ “${so.slice(0, 40)}” bất thường` : 'Không có số hóa đơn');
      if (!String(l.ncc || '').trim()) add('thieu_ncc', 'Không có tên nhà cung cấp');
      if (!l.lech && l.tien_gn == null && l.tien_hd == null) add('thieu_tien', 'Không có số tiền');
      if (!l.lech && so && !l.ngay_hd) add('thieu_ngay', 'Không có ngày hóa đơn');
    });
    const tong = sum(lines.map((l) => l.tien_gn));
    if (k.so_tien != null && lines.length && Math.abs(k.so_tien - tong) > 1 && !(k.ack || []).includes('tong_lech')) out.push({ lineId: null, idx: -1, type: 'tong_lech', sev: 1, text: `Tổng các dòng ${fmtMoney(tong)} ≠ số tiền KUNN ${fmtMoney(k.so_tien)}` });
    return out;
  }
  return { numLoc, setNumFmt, getNumFmt, fmtRate, storedProfile, kunnFixPatches, UNITS, detectUnit, applyUnit, profileColumns, AUDIT, auditKunn, rowText, FIELDS, FIELD, GOC, CHECK, fold, supKey, mstKey, invNo, parseAmount, toISO, fmtDate, daysBetween, todayISO, colName, colIndex, headerField, scoreHeaderRow, detectHeader, extractTitleInfo, classifyDocNote, extractRows, autoParseSheet, pickSheet, sum, fmtMoney, supId, weakKey, strongKey, analyze, worstFlag, checkNew, normKunn, kunnSummary, addDays, customerSummary, uid, cleanLine, gridToPrompt, parseAIJson, aiMappingToMap, aiRowsToGroups };
})();

<script id="bk-doc">
const DOCX = (() => {
'use strict';

  const dmy = (v) => BK.fmtDate(iso(v) || '');
  const fmtN = (n) => (n == null || !Number.isFinite(n) ? '' : Math.round(n).toLocaleString(BK.numLoc()));
  const digits = (s) => String(s == null ? '' : s).replace(/\D/g, '');
  const normNo = (s) => BK.invNo(s);

  // ── loại chứng từ & trường AI cần đọc ──
  const F = (k, l, t = '') => ({ k, l, t });
  const TYPES = {
    bang_ke: { l: 'Bảng kê', g: 'Bảng kê', ord: 3, fields: [] },
    hoa_don: { l: 'Hóa đơn GTGT', g: 'Hóa đơn & hợp đồng', ord: 5, fields: [F('so', 'Số hóa đơn'), F('ky_hieu', 'Ký hiệu'), F('ngay', 'Ngày', 'date'), F('ben_ban', 'Bên bán'), F('mst_ban', 'MST bên bán'), F('ben_mua', 'Bên mua'), F('mst_mua', 'MST bên mua'), F('mat_hang', 'Hàng hóa / dịch vụ'), F('tien', 'Tổng tiền thanh toán', 'money'), F('loai_tien', 'Loại tiền'), F('tk_nhan', 'Số TK nhận tiền (bên bán)'), F('ngan_hang', 'Ngân hàng của TK')] },
    hdmb: { l: 'Hợp đồng mua bán / đơn đặt hàng', g: 'Hóa đơn & hợp đồng', ord: 6, fields: [F('so', 'Số hợp đồng'), F('ngay', 'Ngày ký', 'date'), F('ben_ban', 'Bên bán'), F('ben_mua', 'Bên mua'), F('mat_hang', 'Hàng hóa / dịch vụ'), F('tien', 'Giá trị', 'money'), F('hieu_luc_den', 'Hiệu lực đến', 'date'), F('thanh_toan', 'Điều khoản thanh toán'), F('tk_nhan', 'Số TK nhận tiền (bên bán)'), F('ngan_hang', 'Ngân hàng của TK')] },
    po: { l: 'Đơn đặt hàng (PO)', g: 'Hóa đơn & hợp đồng', ord: 6, fields: [F('so', 'Số PO'), F('ngay', 'Ngày PO', 'date'), F('ben_ban', 'Nhà cung cấp'), F('ben_mua', 'Bên mua'), F('tien', 'Giá trị PO', 'money'), F('mat_hang', 'Mặt hàng'), F('tk_nhan', 'Số TK nhận tiền (bên bán)'), F('ngan_hang', 'Ngân hàng của TK')] },
    giao_hang: { l: 'Phiếu giao hàng / nhập kho / biên bản', g: 'Hóa đơn & hợp đồng', ord: 6, fields: [F('so', 'Số'), F('ngay', 'Ngày', 'date'), F('ben_ban', 'Bên giao')] },
    de_nghi_tt: { l: 'Đề nghị thanh toán', g: 'Hóa đơn & hợp đồng', ord: 6, fields: [F('so', 'Số'), F('ngay', 'Ngày', 'date'), F('ben_ban', 'Bên nhận tiền'), F('tien', 'Số tiền', 'money'), F('tk_nhan', 'TK nhận tiền'), F('ngan_hang', 'Ngân hàng')] },
    tien_dien: { l: 'Thông báo tiền điện / nước', g: 'Tiền điện, nước', ord: 6, fields: [F('so', 'Mã KH / số thông báo'), F('ky', 'Kỳ'), F('ngay', 'Ngày', 'date'), F('ben_ban', 'Đơn vị thu'), F('tien', 'Số tiền', 'money'), F('tk_nhan', 'TK nhận tiền'), F('ngan_hang', 'Ngân hàng'), F('ben_mua', 'Tên khách hàng')] },
    to_khai: { l: 'Tờ khai hải quan', g: 'Hải quan & thuế', ord: 7, fields: [F('so', 'Số tờ khai'), F('ngay', 'Ngày đăng ký', 'date'), F('ben_mua', 'Người nhập khẩu'), F('mst_mua', 'MST'), F('tien', 'Tổng thuế phải nộp', 'money'), F('hai_quan', 'Chi cục hải quan')] },
    nsnn: { l: 'Giấy nộp tiền NSNN', g: 'Hải quan & thuế', ord: 8, fields: [F('so', 'Số chứng từ'), F('ngay', 'Ngày', 'date'), F('to_khai', 'Số tờ khai (cách nhau dấu phẩy)'), F('tien', 'Số tiền', 'money'), F('tk_nhan', 'TK KBNN'), F('ngan_hang', 'KBNN / ngân hàng')] },
    unc: { l: 'UNC / lệnh chi', g: 'Thanh toán', ord: 4, fields: [F('ngay', 'Ngày', 'date'), F('ben_ban', 'Bên nhận'), F('tien', 'Số tiền', 'money'), F('tk_nhan', 'TK nhận'), F('ngan_hang', 'Ngân hàng nhận')] },
    cic: { l: 'CIC', g: 'Thẩm định', ord: 9, fields: [F('mau', 'Mẫu báo cáo (S10A, R20…)'), F('ben_mua', 'Đối tượng tra cứu (doanh nghiệp / cá nhân)'), F('ma_so', 'MST / CCCD của đối tượng'), F('loai_kh', 'Doanh nghiệp hay cá nhân'), F('vai_tro', 'Vai trò (KH vay, người đại diện, bảo lãnh, cổ đông…)'), F('ngay', 'Ngày tra cứu', 'date'), F('nhom_no', 'Nhóm nợ cao nhất')] },
    invoice: { l: 'Invoice / hợp đồng ngoại', g: 'Hóa đơn & hợp đồng', ord: 5, fields: [F('so', 'Số'), F('ngay', 'Ngày', 'date'), F('ben_ban', 'Người bán'), F('mat_hang', 'Hàng hóa / dịch vụ'), F('tien', 'Số tiền', 'money'), F('loai_tien', 'Loại tiền'), F('tk_nhan', 'Số TK nhận tiền (bên bán)'), F('ngan_hang', 'Ngân hàng của TK')] },
    cltf: { l: 'Báo cáo CLTF (CL - KERNEL - TF)', g: 'Thẩm định', ord: 9, fields: [F('ngay', 'Đến ngày', 'date'), F('ben_mua', 'Khách hàng / CIF'), F('hm', 'Hạn mức cho vay (LOAN)', 'money'), F('du_no', 'Dư nợ vay hiện tại', 'money'), F('kha_dung', 'Hạn mức còn khả dụng', 'money')] },
    tra_cuu: { l: 'Kết quả tra cứu hóa đơn', g: 'Thẩm định', ord: 9, fields: [F('so', 'Các số hóa đơn đã tra')] },
    kunn_ky: { l: 'KUNN đã ký', g: 'Văn bản đã ký', ord: 1, fields: [F('so', 'Số KUNN')] },
    pdgn_ky: { l: 'PDGN đã ký', g: 'Văn bản đã ký', ord: 2, fields: [F('so', 'Số KUNN')] },
    khac: { l: 'Khác', g: 'Khác', ord: 10, fields: [F('mo_ta', 'Mô tả')] },
  };
  const GROUP_ORDER = ['Bảng kê', 'Hóa đơn & hợp đồng', 'Tiền điện, nước', 'Hải quan & thuế', 'Thanh toán', 'Thẩm định', 'Văn bản đã ký', 'Khác'];

  /** Câu lệnh cho Gemini đọc MỘT file (PDF/ảnh gửi kèm, hoặc văn bản đã trích). */
  function promptRead(fileName, khName, text) {
    const types = Object.entries(TYPES).filter(([k]) => k !== 'bang_ke').map(([k, t]) => `- ${k}: ${t.l} — trường: ${t.fields.map((f) => `${f.k} (${f.l})`).join(', ')}`).join('\n');
    return `Bạn là chuyên viên hồ sơ giải ngân ngân hàng Việt Nam. File "${fileName}" do khách hàng ${khName ? `"${khName}" ` : ''}gửi. Một file có thể chứa NHIỀU chứng từ (vd PDF 36 trang gồm nhiều tờ khai): tách từng chứng từ riêng.
Các loại chứng từ và trường cần đọc:
${types}
mat_hang = tên hàng hóa / dịch vụ chính, ngắn gọn (vd "Thép cuộn cán nóng", "Hạt nhựa PP").
tk_nhan / ngan_hang = số tài khoản nhận tiền và tên ngân hàng (kèm chi nhánh nếu có) CỦA BÊN BÁN / bên nhận tiền nếu chứng từ ghi (thường ở dòng "Số tài khoản", "STK", "Account No", "Tên ngân hàng", "Bank", "Mở tại"); chép đúng từng chữ số, không có thì "".
CIC: mỗi báo cáo CIC là MỘT chứng từ riêng (file có nhiều báo cáo thì tách ra). mau = mã mẫu báo cáo in trên báo cáo (vd "S10A", "R20", "S11A", "R21" — thường ở góc trên / tiêu đề), ben_mua = tên doanh nghiệp hoặc cá nhân ĐƯỢC TRA CỨU in trên báo cáo, ma_so = MST (doanh nghiệp) hoặc số CMND / CCCD (cá nhân) của đối tượng đó, loai_kh = "Doanh nghiệp" hoặc "Cá nhân", vai_tro = vai trò nếu báo cáo / tên file ghi rõ (vd "người đại diện", "bên bảo lãnh", "cổ đông") — không rõ thì "", ngay = ngày tra cứu / ngày in báo cáo, nhom_no = MỘT chữ số 1–5 là nhóm nợ cao nhất (không có nợ xấu thì "1").
Báo cáo "CL - KERNEL - TF" (CLTF) của ngân hàng là loại cltf: hm = AMOUNT của dòng LOAN / LO-LIMITLOAN, du_no = dư nợ vay đang có, kha_dung = phần còn được dùng.
Quy tắc: ngày ghi dd/mm/yyyy; số tiền ghi số nguyên không dấu phân cách (vd 1116900000); chép đúng số hiệu như trên giấy; trường không thấy thì để "". Tờ khai: "tien" là tổng thuế phải nộp. conf = độ chắc chắn 0..1 về loại chứng từ.
Trả JSON: {"docs":[{"loai":"hoa_don","trang":"1-2","conf":0.95,"f":{"so":"830","ngay":"04/11/2026",...}}]}${text ? `\n\nNỘI DUNG FILE:\n${text.slice(0, 60000)}` : ''}`;
  }
  /** Chuẩn hóa kết quả AI → danh sách chứng từ. */
  function normDocs(ai, fileId) {
    const docs = (ai && Array.isArray(ai.docs) ? ai.docs : []).map((d, i) => {
      let loai = TYPES[d.loai] ? d.loai : 'khac';
      if (loai === 'khac' && /cl\s*-?\s*kernel|\bcltf\b|kernel\s*-?\s*tf/i.test(JSON.stringify(d.f || {}))) loai = 'cltf';
      const f = {};
      for (const fd of TYPES[loai].fields) {
        let v = d.f && d.f[fd.k] != null ? String(d.f[fd.k]).trim() : '';
        if (fd.t === 'date' && v) v = dmy(v) || v;
        if (fd.t === 'money' && v) { const n = num(v); v = n != null ? String(n) : v; }
        f[fd.k] = v;
      }
      return { id: `${fileId}_${i}`, fileId, loai, trang: d.trang ? String(d.trang) : '', conf: Math.max(0, Math.min(1, +d.conf || 0)), f, ok: false };
    });
    return docs;
  }

  // ── mốc của một hồ sơ (bỏ bớt / thêm được) ──
  // auto = tool tự tick khi việc đã làm xong (có file, hết lỗi, có số KUNN, có bản ký…); manual = bạn bấm “Đã xong” —
  // chỉ bấm được khi các mốc trước đã xong (hoặc bỏ qua), để không tick nhầm.
  const MILESTONES = [
    ['nhan', 'Nhận chứng từ', 'auto', 'Thả toàn bộ file KH gửi vào hồ sơ.'],
    ['kiem_tra', 'Kiểm tra', 'auto', 'Có bảng kê và xử lý hết lỗi (✕) trong danh sách kiểm tra — sửa số liệu hoặc bỏ qua kèm lý do.'],
    ['so_kunn', 'Xin số KUNN', 'auto', 'Nhập số KUNN admin cấp vào ô “Số KUNN”.'],
    ['soan', 'Soạn KUNN & PDGN', 'auto', 'Bấm “📝 Soạn KUNN & PDGN”, lưu hoặc xuất Word là xong bước này.'],
    ['giai_ngan', 'Đã giải ngân', 'manual', 'Giải ngân xong thì bấm “Đã giải ngân” — KUNN chuyển sang tab Theo dõi KUNN để theo dõi đáo hạn và chứng từ bổ sung.'],
  ];
  /** Trạng thái các mốc: done / skip / cur (việc đang tới) / todo. can = được bấm “Đã xong” (mốc trước đều xong). */
  function milestones(hs, nErr) {
    const ms = hs.ms || {}, docs = (hs.docs || []).filter((d) => !d.del), out = [];
    const ev = {
      nhan: (hs.files || []).length > 0,
      kiem_tra: (hs.files || []).length > 0 && (hs.lines || []).length > 0 && nErr === 0,
      so_kunn: !!hs.so_kunn,
      soan: !!(hs.ms && hs.ms.soan && hs.ms.soan !== 'skip'),
    };
    let cur = false;
    for (const [k, l, kind, hint] of MILESTONES) {
      if (ms[k] === 'skip') { out.push({ k, l, kind, hint, st: 'skip', can: false, at: '' }); continue; }
      const manual = kind === 'manual' && ms[k] && ms[k] !== 'skip';
      const done = !!(ev[k] || manual);
      const m = { k, l, kind, hint, at: manual ? ms[k] : '', can: kind === 'manual' && !done };
      if (done) m.st = 'done';
      else { m.st = cur ? 'todo' : 'cur'; cur = true; }
      out.push(m);
    }
    return out;
  }
  const stageOf = (hs, nErr) => { const m = milestones(hs, nErr); const c = m.find((x) => x.st === 'cur'); return c ? c : { k: 'xong', l: 'Đã giải ngân', st: 'done' }; };

  // ── kiểm tra tự sinh theo bộ chứng từ ──
  const sameName = (a, b) => { const x = BK.supKey(a), y = BK.supKey(b); return !!x && !!y && (x === y || x.includes(y) || y.includes(x)); };
  const findDoc = (docs, types, so) => { const n = normNo(so), d = digits(so); const xs = docs.filter((x) => types.includes(x.loai) && x.f.so); return xs.find((x) => normNo(x.f.so) === n) || (d.length >= 6 ? xs.find((x) => digits(x.f.so) === d) || xs.find((x) => digits(x.f.so).includes(d)) : undefined); };
  /** MST so khớp: AI hay trả số mất 0 đầu; chi nhánh có đuôi -001 → so 10 số đầu. */
  const mst10 = (v) => { let x = digits(v); if (x.length === 9) x = '0' + x; return x.slice(0, 10); };
  /** Thông tin CIC để đặt tên: mẫu (đọc từ báo cáo, thiếu thì từ tên file), đối tượng tra, DN / cá nhân, vai trò. */
  function cicInfo(d, kh = {}, fileName = '') {
    const f = (d && d.f) || {};
    const mau = String(f.mau || (/(?:^|[^a-z0-9])([sr]\d{2}[a-z]?)(?=[^a-z0-9]|$)/i.exec(fileName || '') || [])[1] || '').trim().toUpperCase();
    const ten = String(f.ben_mua || '').trim(), ft = fold(ten);
    const loai = f.loai_kh || (!ten ? '' : /\b(cong ty|cty|tnhh|co phan|ctcp|hop tac xa|doanh nghiep|tap doan|chi nhanh)\b/.test(ft) ? 'Doanh nghiệp' : 'Cá nhân');
    const laKh = !!(ten && ((kh.name && sameName(ten, kh.name)) || ((kh.hs || {}).ten_kh && sameName(ten, kh.hs.ten_kh)) || (f.ma_so && kh.mst && digits(f.ma_so).slice(0, 10) === digits(kh.mst).slice(0, 10))));
    const vt = f.vai_tro || (laKh ? 'KH vay' : '');
    const nm = /[1-5]/.exec(String(f.nhom_no == null ? '' : f.nhom_no));
    return { mau, ten, ma: String(f.ma_so || ''), loai, vt, laKh, ngay: iso(f.ngay) || '', nhom: nm ? +nm[0] : null, key: laKh || !ten ? '_kh' : fold(ten) };
  }
  /** Tên CIC rõ ràng: “CIC S10A · CÔNG TY A” — dòng phụ: vai trò · MST/CCCD · ngày tra · nhóm nợ. */
  function cicLabel(d, kh = {}, fileName = '') {
    const x = cicInfo(d, kh, fileName);
    return { main: `CIC ${x.mau || '(chưa rõ mẫu)'}${x.ten ? ' · ' + x.ten : x.laKh || !x.ten ? ' · ' + (kh.name || 'KH vay') : ''}`,
      sub: [x.vt || x.loai || (x.ten ? '' : 'KH vay'), x.ma && `${x.loai === 'Cá nhân' ? 'CCCD' : 'MST'} ${x.ma}`, x.ngay && `tra ${dmy(x.ngay)}`, x.nhom != null && `nhóm nợ ${x.nhom}`].filter(Boolean).join(' · '), x };
  }
  /**
   * @param hs   { lines, docs, ngay_gn, so_tien, so_kunn, ack }
   * @param ctx  { kh: {name, mst, hs:{...}}, kunns: KUNN đã có (để soát trùng), ledger: sổ Excel, today, hol }
   * @returns [{key, sev 3 lỗi | 2 cần xem | 0 đạt, title, detail, refs:[docId|lineId]}]
   */
  function checks(hs, ctx = {}) {
    const out = [], add = (key, sev, title, detail = '', refs = []) => out.push({ key, sev, title, detail, refs });
    const lines = hs.lines || [], docs = (hs.docs || []).filter((d) => !d.del), kh = ctx.kh || {}, prof = kh.hs || {};
    const gn = iso(hs.ngay_gn) || ctx.today || BK.todayISO();
    const types = new Set(docs.map((d) => d.loai));
    const total = BK.sum(lines.map((l) => l.tien_gn));
    // bảng kê
    if (!lines.length) add('bk_none', 2, 'Chưa có bảng kê', 'Thả file Excel bảng kê KH gửi (hoặc nhập dòng tay) để tool soát giải ngân trùng và lập KUNN.');
    else {
      add('bk_total', 0, `Bảng kê ${lines.length} dòng · tổng ${fmtN(total)} đ`);
      const so = num(hs.so_tien);
      if (so != null && Math.abs(so - total) > 0.5) add('bk_sum', 3, 'Số tiền đề nghị khác tổng bảng kê', `Đề nghị ${fmtN(so)} đ, bảng kê cộng được ${fmtN(total)} đ.`);
      // giải ngân trùng / vượt so với sổ hóa đơn
      const others = (ctx.kunns || []).filter((k) => k.id !== hs.kid);
      const chk = BK.checkNew(others, [{ so_kunn: 'mới', ngay_gn: gn, lines }]);
      const nk = BK.normKunn(hs.so_kunn || '');
      if (nk && others.some((k) => BK.normKunn(k.so_kunn || '') === nk)) add('kunn_trung', 3, `Số KUNN ${hs.so_kunn} đã dùng cho KUNN khác trong sổ hóa đơn`, 'Kiểm tra lại số admin cấp (thường sai số trong ngoặc) — ghi sổ sẽ không đè KUNN kia.');
      const cl = chk.groups[0].lines.map((x, i) => ({ line: lines[i], status: x.check.status, note: (x.check.history || []).map((u) => `đã GN ở KUNN ${u.so_kunn} ngày ${dmy(u.ngay_gn)}: ${fmtN(u.tien_gn)} đ`).join('; ') }));
      const bad = cl.filter((x) => ['da_du', 'vuot', 'trung_file'].includes(x.status));
      const warn = cl.filter((x) => x.status === 'nghi_trung');
      bad.forEach((x) => add('dup_' + (x.line.id || x.line.so_hd), 3, `${BK.CHECK[x.status].label}: HĐ ${x.line.so_hd} · ${x.line.ncc}`, x.note || '', [x.line.id]));
      warn.forEach((x) => add('ngh_' + (x.line.id || x.line.so_hd), 2, `Nghi trùng: HĐ ${x.line.so_hd} · ${x.line.ncc}`, x.note || '', [x.line.id]));
      const unchk = cl.filter((x) => ['thieu_tt', 'lech_cot'].includes(x.status));
      unchk.forEach((x) => add('chk_' + (x.line.id || x.line.so_hd), 2, `Chưa soát được trùng: HĐ ${x.line.so_hd || '?'} · ${x.line.ncc || '(thiếu NCC)'}`, x.status === 'lech_cot' ? `Dòng đọc lệch cột: ${x.line.lech || ''}` : 'Thiếu nhà cung cấp hoặc số hóa đơn — sửa dòng để tool đối chiếu với sổ hóa đơn.', [x.line.id]));
      for (const pk of ctx.pendingKunns || []) { if (pk.id === hs.kid || pk.hsId === hs.id) continue; const keys = new Set((pk.lines || []).map((l) => BK.strongKey(l)).filter(Boolean)); for (const l of lines) { const key = BK.strongKey(l); if (key && keys.has(key)) add('pend_' + l.id, 2, `HĐ ${l.so_hd} · ${l.ncc} đang nằm trong hồ sơ GN khác chưa giải ngân (KUNN ${pk.so_kunn || '(chưa số)'})`, 'Nếu hồ sơ kia đã hủy: xóa hồ sơ đó để không soát nhầm.', [l.id]); } }
      if (!bad.length && !unchk.length) add('dup_ok', 0, 'Không hóa đơn nào đã giải ngân đủ trước đó');
      const tiep = cl.filter((x) => x.status === 'tiep');
      if (tiep.length) add('tiep', 0, `${tiep.length} hóa đơn giải ngân tiếp phần còn lại`);
    }
    // từng dòng bảng kê ↔ chứng từ
    if (docs.length && lines.length) {
      let nOk = 0;
      for (const l of lines) {
        const d = findDoc(docs, ['hoa_don', 'to_khai', 'tien_dien', 'invoice', 'de_nghi_tt', 'nsnn', 'po', 'hdmb'], l.so_hd);
        if (!d) { add('ct_' + l.id, 2, `Chưa thấy chứng từ cho dòng HĐ ${l.so_hd || '?'} · ${l.ncc}`, 'Thả thêm file, hoặc mở chứng từ để sửa số AI đọc sai.', [l.id]); continue; }
        const errs = [];
        const dn = iso(d.f.ngay), ln = iso(l.ngay_hd);
        if (dn && ln && dn !== ln) errs.push(`ngày: bảng kê ${dmy(ln)}, chứng từ ${dmy(dn)}`);
        const dt = num(d.f.tien), cmpInv = l.tien_hd != null && !['hdmb', 'po', 'to_khai'].includes(d.loai);
        if (cmpInv && dt != null && Math.abs(dt - l.tien_hd) > 1) errs.push(`tiền: bảng kê ${fmtN(l.tien_hd)}, chứng từ ${fmtN(dt)}`);
        else if (!cmpInv && dt != null && l.tien_gn != null && l.tien_gn > dt + 1) errs.push(`giải ngân ${fmtN(l.tien_gn)} > ${d.loai === 'to_khai' ? 'thuế phải nộp' : 'giá trị ' + TYPES[d.loai].l} ${fmtN(dt)}`);
        if (d.f.ben_ban && l.ncc && d.loai !== 'to_khai' && d.loai !== 'nsnn' && !sameName(d.f.ben_ban, l.ncc)) errs.push(`bên bán “${d.f.ben_ban}” khác bảng kê “${l.ncc}”`);
        if (errs.length) add('ln_' + l.id, 3, `Bảng kê ghi khác ${TYPES[d.loai].l} ${d.f.so}`, errs.join('; '), [l.id, d.id]);
        else nOk++;
      }
      if (nOk) add('ln_ok', 0, `${nOk}/${lines.length} dòng bảng kê khớp số, ngày, tiền với chứng từ`);

    // hóa đơn: bên mua, tuổi hóa đơn, HĐMB

      const dn = iso(d.f.ngay);
      if (d.f.mst_mua && kh.mst && mst10(d.f.mst_mua) !== mst10(kh.mst)) add('mua_' + d.id, 3, `Hóa đơn ${d.f.so}: MST bên mua ${d.f.mst_mua} không phải của KH`, `MST KH: ${kh.mst}`, [d.id]);
      else if (d.f.mst_mua && kh.mst && digits(d.f.mst_mua).length > 10) add('mua_cn_' + d.id, 2, `Hóa đơn ${d.f.so}: xuất cho chi nhánh (MST ${d.f.mst_mua}) của KH`, '', [d.id]);
      else if (d.f.ben_mua && kh.name && !sameName(d.f.ben_mua, kh.name) && !(prof.ten_kh && sameName(d.f.ben_mua, prof.ten_kh))) add('mua_' + d.id, 2, `Hóa đơn ${d.f.so}: bên mua “${d.f.ben_mua}” khác tên KH`, '', [d.id]);
      if (dn) {
        const age = BK.daysBetween(dn, gn);
        if (age < 0) add('hd_sau_' + d.id, 3, `Hóa đơn ${d.f.so} ngày ${dmy(dn)} sau ngày giải ngân`, '', [d.id]);
        else if (age > 90) add('hd90_' + d.id, 2, `Hóa đơn ${d.f.so} đã ${age} ngày (> 90 ngày) — cần đối chiếu công nợ`, '', [d.id]);
      }
    }
    if (types.has('hoa_don') || types.has('hdmb')) {
      const hdmbs = docs.filter((x) => x.loai === 'hdmb');
      const isPurchase = (l) => !!findDoc(docs, ['hoa_don', 'invoice', 'po'], l.so_hd);
      const inRange = (c, l) => { const a = iso(c.f.ngay), b = iso(c.f.hieu_luc_den), d = iso(l.ngay_hd); return !d || ((!a || a <= d) && (!b || d <= b)); };
      const hdmbOf = (l) => {

      };
      const byC = new Map();
      for (const l of lines) { const c = hdmbOf(l); if (c) (byC.get(c) || byC.set(c, []).get(c)).push(l); }
      // từng HĐMB: bên mua là KH, bên bán là NCC trên bảng kê, tổng hóa đơn không vượt giá trị HĐMB, hàng hóa khớp
      const words = (t) => new Set(fold(t || '').split(/[^a-z0-9]+/).filter((w) => w.length >= 3 && !/^(cac|cua|cho|theo|hang|hoa|dich|vu|loai|san|pham|va|the|and)$/.test(w)));

      for (const [c, ls] of byC) {

        const lech = ls.filter((l) => c.f.ben_ban && l.ncc && !sameName(c.f.ben_ban, l.ncc));
        if (lech.length) add('hdmb_ban_' + c.id, 3, `HĐMB ${c.f.so}: bên bán “${c.f.ben_ban}” khác NCC trên bảng kê (${[...new Set(lech.map((l) => l.ncc))].join(', ')})`, '', [c.id, ...lech.map((l) => l.id)]);
