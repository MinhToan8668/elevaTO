// B2 AI: gửi nội dung gốc từng ô của dòng nghi vấn + dòng trước/sau + tiêu đề cột → AI trả giá trị đúng, lý do, độ tin cậy.
// B3 người dùng chọn đề xuất → áp dụng (hoặc xác nhận dòng đúng → không báo lại loại lỗi đó).
function promptAudit(hdr, items) {
  return `Bạn là chuyên viên kiểm soát giải ngân của ngân hàng Việt Nam, rà soát "bảng kê chứng từ/hóa đơn giải ngân vốn vay" do khách hàng gửi.
Công cụ đã đọc file Excel theo hàng tiêu đề, nhưng có thể đọc SAI vì dòng bị ghi lệch cột, lệch dòng (số liệu dòng này nằm ở dòng trên/dưới),
số tờ khai hải quan (10–12 chữ số) bị hiểu là số tiền, số tiền ngoại tệ (có phần lẻ) bị hiểu là số hóa đơn, v.v.

Tiêu đề cột của file: ${hdr || '(không rõ)'}

Với MỖI dòng dưới đây bạn có: nội dung gốc từng ô (RAW, kèm hàng trên/dưới để phát hiện lệch dòng), cách công cụ đang hiểu (DOC) và vấn đề luật phát hiện (LOI).
Hãy xác định giá trị ĐÚNG của dòng:
- so_hd: số hóa đơn / số invoice / số tờ khai (nếu chứng từ là tờ khai thuế), KHÔNG phải số tiền;
- ky_hieu: ký hiệu HĐ hoặc nội dung phân biệt (vd "NK", "GTGT NK") nếu có;
- ngay_hd: ngày hóa đơn YYYY-MM-DD (số 5 chữ số 36000–60000 là ngày dạng số của Excel, 45453 = 2024-06-10);
- tien_hd: trị giá hóa đơn; tien_gn: số tiền đề nghị giải ngân cho dòng đó; loai_tien: "VND" hoặc "USD"/"EUR"… (số có phần lẻ thường là ngoại tệ);
- ncc: nhà cung cấp.
Nếu cách hiểu hiện tại đã đúng (vấn đề chỉ là đặc thù hợp lệ, vd hóa đơn xuất sau ngày giải ngân theo hợp đồng) thì ok=true và giải thích.
Không bịa số: chỉ dùng số có trong RAW. Không chắc thì để null và tin_cay thấp.
Trả JSON: {"items":[{"id":"…","ok":false,"so_hd":"…","ky_hieu":"…","ngay_hd":"YYYY-MM-DD","tien_hd":0,"tien_gn":0,"loai_tien":"USD","ncc":"…","ly_do":"giải thích ngắn tiếng Việt","tin_cay":0.0-1.0}]}

${items.map((x) => `### id=${x.id}
RAW hàng trên: ${x.prev || '—'}
RAW dòng này: ${x.l.raw || '(không lưu dữ liệu gốc)'}
RAW hàng dưới: ${x.next || '—'}
DOC: ncc=${x.l.ncc || ''}; so_hd=${x.l.so_hd || ''}; ky_hieu=${x.l.ky_hieu || ''}; ngay_hd=${x.l.ngay_hd || ''}; tien_hd=${x.l.tien_hd ?? ''}; tien_gn=${x.l.tien_gn ?? ''}; loai_tien=${x.l.loai_tien || 'VND'}; KUNN ${x.k.so_kunn} GN ${x.k.ngay_gn || '?'}
LOI: ${x.issues.map((i) => i.text).join('; ')}`).join('\n\n')}`;
}
const AU_FIELDS = [['so_hd', 'Số HĐ'], ['ky_hieu', 'Ký hiệu'], ['ngay_hd', 'Ngày HĐ'], ['tien_hd', 'Tiền HĐ'], ['tien_gn', 'Giải ngân'], ['loai_tien', 'Loại tiền'], ['ncc', 'NCC']];
function auFmt(f, v, cur) { if (v == null || v === '') return '—'; if (f === 'ngay_hd') return dd(v) || v; if (f === 'tien_hd' || f === 'tien_gn') return money(v, cur); return String(v); }
/** Đề xuất AI → thay đổi thật (chỉ các trường khác giá trị hiện tại). */
function auChanges(l, s) {
  const ch = {};
  if (!s || s.ok) return ch;
  for (const [f] of AU_FIELDS) {
    let v = s[f];
    if (v == null || v === '') continue;
    if (f === 'tien_hd' || f === 'tien_gn') { v = BK.parseAmount(v); if (v == null) continue; }
    if (f === 'ngay_hd') { v = BK.toISO(v); if (!v) continue; }
    if (f === 'loai_tien') { v = String(v).toUpperCase(); if (/^VN/.test(v)) v = ''; }
    if (f === 'so_hd' || f === 'ky_hieu' || f === 'ncc') v = String(v).trim();
    if (String(v) !== String(l[f] ?? '')) ch[f] = v;
  }
  return ch;
}

/**
 * Mở bảng rà soát. src = { title, kunns: [{k, key}], hdrOf(k), apply(list) } — list: [{k, l, patch}]
 * (k = KUNN dạng {so_kunn, ngay_gn, so_tien, lines}, l = dòng; patch = trường cần đổi, {} + ack để xác nhận đúng).
 */
function openAudit(src) {
  const rows = [];
  for (const k of src.kunns) {
    const iss = BK.auditKunn(k);
    const byLine = new Map();
    for (const x of iss) {
      if (x.idx < 0) { rows.push({ k, l: null, idx: -1, issues: [x], id: `${k._key}|KUNN` }); continue; }
      if (!byLine.has(x.idx)) byLine.set(x.idx, []);
      byLine.get(x.idx).push(x);
    }
    for (const [idx, list] of byLine) rows.push({ k, l: k.lines[idx], idx, issues: list, id: `${k._key}|${idx}`, prev: (k.lines[idx - 1] || {}).raw, next: (k.lines[idx + 1] || {}).raw });
  }
  const nLines = BK.sum(src.kunns.map((k) => k.lines.length));
  const st = { flt: '', sug: new Map(), dec: new Map(), busy: false };
  const m = modal(`<div class="mh"><h2>🤖 Rà soát bảng kê — ${esc(src.title)}</h2><button class="x" data-close>&times;</button></div><div class="mb" id="auB"></div>
    <div class="mf"><span id="auF" class="hist" style="flex:1"></span><button class="btn" id="auX">⬇ Xuất Excel danh sách</button><button class="btn" id="auAI">✨ AI đề xuất cách sửa</button><button class="btn pri" id="auGo" disabled>Áp dụng</button></div>`);
  const lineRows = () => rows.filter((r) => r.l);
  const draw = () => {
    const types = Object.keys(BK.AUDIT).map((t) => [t, rows.filter((r) => r.issues.some((i) => i.type === t)).length]).filter(([, n]) => n);
    const vis = rows.filter((r) => !st.flt || r.issues.some((i) => i.type === st.flt));
    const nSev3 = rows.filter((r) => r.issues.some((i) => i.sev >= 3)).length;
    $('#auB', m).innerHTML = `
      ${rows.length ? `<div class="verdict ${nSev3 ? 'err' : 'warn'}"><div><b>${nSev3 ? '✗' : '⚠'} ${rows.length} dòng cần xem trên tổng ${nLines} dòng · ${src.kunns.length} KUNN</b><span>Bấm <b>✨ AI đề xuất cách sửa</b> để Gemini đọc lại dữ liệu gốc từng ô (kèm hàng trên/dưới để bắt lệch dòng) và đề xuất giá trị đúng. Tick dòng muốn sửa rồi bấm <b>Áp dụng</b>.</span></div></div>`
        : `<div class="verdict ok"><div><b>✓ Không thấy dòng nào lệch cột hay sai logic</b><span>Đã rà ${nLines} dòng · ${src.kunns.length} KUNN.</span></div></div>`}
      ${st.sug.size ? decBar(decCount([...st.sug.keys()], st.dec), '<button class="btn sm" data-decai>✓ Duyệt các đề xuất AI ≥75%</button>') : ''}
      ${rows.length ? `<div class="au-sum"><button data-af="" class="${st.flt ? '' : 'on'}">Tất cả<b>${rows.length}</b></button>${types.map(([t, n]) => `<button data-af="${t}" class="${st.flt === t ? 'on' : ''}">${BK.AUDIT[t].label}<b>${n}</b></button>`).join('')}</div>
      ${st.flt && st.flt !== 'tong_lech' && st.flt !== 'lech_cot' ? `<div class="bar"><span class="hist">Nếu nhóm “${BK.AUDIT[st.flt].label}” là hợp lệ theo hồ sơ (vd hóa đơn bổ sung sau giải ngân):</span><button class="btn sm" id="auAck">✓ Xác nhận ${vis.filter((r) => r.l).length} dòng nhóm này là hợp lệ — không báo lại</button></div>` : ''}
      <div class="card tw" style="max-height:60vh"><table class="t"><thead><tr><th>Quyết định</th><th>KUNN · hàng</th><th>Công cụ đang đọc</th><th>Vấn đề</th><th>Dữ liệu gốc trong file</th><th>AI đề xuất</th></tr></thead><tbody>
      ${vis.slice(0, 800).map((r) => {
        const sg = st.sug.get(r.id), l = r.l;
        const ch = l ? auChanges(l, sg) : {};
        const sev = Math.max(...r.issues.map((i) => i.sev));
        const conf = sg && sg.tin_cay != null ? Math.round(sg.tin_cay * 100) : null;
        const aiCell = !l ? '<span class="hist">Mức KUNN — kiểm tra số tiền KUNN</span>'
          : !sg ? (st.busy ? '<span class="hist"><span class="spin"></span></span>' : '<span class="hist">—</span>')
          : sg.err ? `<span class="hist" style="color:var(--err)">${esc(sg.err)}</span>`
          : `${conf != null ? `<span class="conf ${conf >= 75 ? 'hi' : conf >= 50 ? 'mid' : 'lo'}">${conf}%</span> ` : ''}${sg.ok || !Object.keys(ch).length ? '<b style="color:var(--ok)">Dòng này đúng</b>' : `<div class="diff">${Object.entries(ch).map(([f, v]) => `${AU_FIELDS.find((x) => x[0] === f)[1]}: <s>${esc(auFmt(f, l[f], l.loai_tien))}</s> → <ins>${esc(auFmt(f, v, ch.loai_tien ?? l.loai_tien))}</ins>`).join('<br>')}</div>`}<div class="hist">${esc(sg.ly_do || '')}</div>`;
        const dv = st.dec.get(r.id) || '';
        return `<tr class="${dv === 'y' ? 'ok' : dv === 'n' ? 'no' : sev >= 3 ? 'bad' : 'warn'}"><td>${l ? (sg && !sg.err ? decHtml(r.id, dv) + (!dv && (sg.tin_cay ?? 0) >= 0.75 ? '<div class="hist">AI khuyên duyệt</div>' : '') : '<span class="hist">chờ AI đề xuất</span>') : ''}</td>
          <td><b>${esc(r.k.so_kunn)}</b><div class="hist">${l ? `hàng ${esc(l.row || r.idx + 1)}` : 'cả KUNN'}</div></td>
          <td style="min-width:200px">${l ? `<div>${esc(l.ncc)}</div><div><b>${esc(l.so_hd)}</b>${l.ky_hieu ? ' · ' + esc(l.ky_hieu) : ''} · ${dd(l.ngay_hd) || '—'}</div><div class="hist">HĐ ${money(l.tien_hd, l.loai_tien) || '—'} · GN ${money(l.tien_gn, l.loai_tien) || '—'} ${esc(l.loai_tien || '')}</div>` : ''}</td>
          <td style="min-width:180px">${r.issues.map((i) => `<div><span class="pill ${i.sev >= 3 ? 'p-err' : 'p-warn'}">${BK.AUDIT[i.type].label}</span><div class="hist">${esc(i.text)}</div></div>`).join('')}</td>
          <td><div class="raw">${esc(l ? l.raw || '(bản nạp cũ — chưa lưu dữ liệu gốc)' : '')}</div></td>
          <td style="min-width:220px">${aiCell}</td></tr>`; }).join('')}
      </tbody></table></div>${vis.length > 800 ? `<div class="hist">Hiện 800/${vis.length} dòng — lọc theo loại để xem tiếp.</div>` : ''}` : ''}`;
    $$('[data-af]', m).forEach((b) => { b.onclick = () => { st.flt = b.dataset.af; draw(); }; });
    const ackB = $('#auAck', m);
    if (ackB) ackB.onclick = async () => {
      const t = st.flt;
      const list = vis.filter((r) => r.l).map((r) => ({ k: r.k, l: r.l, patch: { ack: [...new Set([...(r.l.ack || []), t])] } }));
      if (!confirm(`Xác nhận ${list.length} dòng “${BK.AUDIT[t].label}” là hợp lệ? Các dòng này sẽ không bị báo lỗi này nữa.`)) return;
      try { await src.apply(list); m.remove(); toast(`Đã xác nhận ${list.length} dòng`, 'ok'); } catch (e) { toast(errMsg(e), 'err'); }
    };
    $$('[data-dec]', m).forEach((b) => { b.onclick = () => { const id = b.dataset.dec; st.dec.set(id, st.dec.get(id) === b.dataset.v ? '' : b.dataset.v); draw(); }; });
    $$('[data-decall]', m).forEach((b) => { b.onclick = () => { for (const [id, sg] of st.sug) if (!sg.err) st.dec.set(id, b.dataset.decall); draw(); }; });
    const dai = $('[data-decai]', m); if (dai) dai.onclick = () => { for (const [id, sg] of st.sug) if (!sg.err && (sg.tin_cay ?? 0) >= 0.75 && !st.dec.get(id)) st.dec.set(id, 'y'); draw(); };
    foot();
  };
  const foot = () => {
    const n = [...st.dec.values()].filter((v) => v === 'y').length;
    $('#auGo', m).disabled = !n || st.busy;
    $('#auGo', m).textContent = n ? `Áp dụng ${n} dòng đã duyệt` : 'Duyệt dòng để áp dụng';
    $('#auAI', m).disabled = st.busy || !lineRows().length;
    $('#auF', m).textContent = st.sug.size ? `AI đã xem ${st.sug.size}/${lineRows().length} dòng · duyệt / không duyệt từng dòng (dòng AI xác nhận đúng mà bạn duyệt sẽ không bị báo lại)` : '';
  };
  $('#auAI', m).onclick = async () => {
    const todo = lineRows().filter((r) => !st.sug.has(r.id)).sort((a, b) => Math.max(...b.issues.map((i) => i.sev)) - Math.max(...a.issues.map((i) => i.sev)));
    const MAX = 400;
    if (!todo.length) return;
    if (todo.length > MAX && !confirm(`Có ${todo.length} dòng nghi vấn — AI xem trước ${MAX} dòng nặng nhất (chạy lại để xem tiếp). Tiếp tục?`)) return;
    st.busy = true; draw();
    const btn = $('#auAI', m);
    try {
      const list = todo.slice(0, MAX);
      for (let i = 0; i < list.length; i += 30) {
        btn.innerHTML = `<span class="spin"></span> AI đang xem ${Math.min(i + 30, list.length)}/${list.length} dòng…`;
        const part = list.slice(i, i + 30);
        const hdr = src.hdrOf(part[0].k);
        const r = await aiJson(promptAudit(hdr, part.map((x, j) => ({ ...x, id: String(j) }))), { thinking: 'medium', maxTokens: 30000 });
        const got = new Map((r.items || []).map((x) => [String(x.id), x]));
        part.forEach((x, j) => {
          const sg = got.get(String(j)) || { err: 'AI không trả lời dòng này' };
          st.sug.set(x.id, sg);
        });
        draw();
      }
      toast(`AI đã xem ${list.length} dòng — kiểm tra đề xuất rồi bấm Áp dụng`, 'ok');
    } catch (e) { toast(errMsg(e), 'err', 9000); }
    st.busy = false; btn.textContent = '✨ AI đề xuất cách sửa'; draw();
  };
  $('#auGo', m).onclick = async () => {
    const list = rows.filter((r) => st.dec.get(r.id) === 'y' && r.l).map((r) => {
      const sg = st.sug.get(r.id);
      const patch = auChanges(r.l, sg);
      const ack = new Set(r.l.ack || []);
      if (sg.ok || !Object.keys(patch).length) r.issues.forEach((i) => ack.add(i.type));   // AI xác nhận đúng → không báo lại
      else r.issues.forEach((i) => { if (i.type !== 'lech_cot') ack.add(i.type); });
      patch.lech = '';                                                                       // đã được người dùng duyệt
      patch.ack = [...ack];
      patch.ghi_chu = [r.l.ghi_chu, `AI rà soát ${BK.todayISO()}: ${sg.ly_do || ''}`].filter(Boolean).join(' · ').slice(0, 400);
      return { k: r.k, l: r.l, patch };
    });
    $('#auGo', m).disabled = true;
    try { await S.store.group(`Rà soát: áp dụng ${list.length} dòng`, () => src.apply(list)); m.remove(); toast(`Đã áp dụng ${list.length} dòng — bấm ↶ (Ctrl+Z) nếu muốn hoàn tác`, 'ok', 6000); }
    catch (e) { toast(errMsg(e), 'err', 9000); $('#auGo', m).disabled = false; }
  };
  $('#auX', m).onclick = () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheet(`RÀ SOÁT BẢNG KÊ — ${src.title}`, stamp(), ['SỐ KUNN', 'HÀNG', 'NHÀ CUNG CẤP', 'SỐ HĐ', 'NGÀY HĐ', 'TIỀN HĐ', 'GIẢI NGÂN', 'VẤN ĐỀ', 'DỮ LIỆU GỐC', 'AI ĐỀ XUẤT', 'LÝ DO', 'TIN CẬY'],
      rows.map((r) => { const l = r.l || {}; const sg = st.sug.get(r.id) || {}; const ch = r.l ? auChanges(r.l, sg) : {};
        return [xc(r.k.so_kunn, { b: true }), xc(l.row || ''), xc(l.ncc), xc(l.so_hd), xc(l.ngay_hd, { date: true }), xc(l.tien_hd), xc(l.tien_gn), xc(r.issues.map((i) => `${BK.AUDIT[i.type].label}: ${i.text}`).join('\n'), { wrap: true, fill: r.issues.some((i) => i.sev >= 3) ? FILL.err : FILL.warn }),
          xc(l.raw, { wrap: true }), xc(sg.ok ? 'Dòng đúng' : Object.entries(ch).map(([f, v]) => `${f}: ${v}`).join('\n'), { wrap: true }), xc(sg.ly_do, { wrap: true }), xc(sg.tin_cay)]; }),
      [16, 8, 30, 14, 12, 14, 14, 40, 50, 30, 40, 8]), 'Rà soát');
    download(wb, `RaSoat_${slug(src.title)}_${BK.todayISO()}.xlsx`);
  };
  draw();
}
function auditStored(cid) {
  const c = cust(cid); if (!c) return toast('Chọn khách hàng trước');
  const ks = S.store.kunnsOf(cid).sort((a, b) => (a.ngay_gn || '').localeCompare(b.ngay_gn || '')).map((k) => ({ ...k, _key: k.id }));
  if (!ks.length) return toast('Khách hàng chưa có KUNN nào');
  openAudit({
    title: c.name, kunns: ks, hdrOf: (k) => k.hdr || '',
    apply: async (list) => {
      const byK = new Map();
      for (const x of list) { if (!byK.has(x.k.id)) byK.set(x.k.id, []); byK.get(x.k.id).push({ id: x.l.id, ...x.patch }); }
      for (const [kid, patches] of byK) await S.store.patchLines(kid, patches, meta(), cid);
      log(cid, 'ra_soat', `Rà soát bảng kê: áp dụng ${list.length} dòng (AI đề xuất)`);
    },
  });
}
function auditImport() {
  if (!IMP.groups || !IMP.groups.length) return toast('Chưa đọc được dòng nào để rà soát');
  const ks = IMP.groups.map((g, gi) => ({ ...g, so_kunn: g.so_kunn || '(chưa số)', _key: 'g' + gi, _g: g }));
  openAudit({
    title: IMP.file, kunns: ks, hdrOf: (k) => k.hdr || '',
    apply: async (list) => {
      for (const x of list) Object.assign(x.l, x.patch);      // sửa thẳng vào dòng đang xem trước
      IMP.edited = true;
      recheck();
    },
  });
}

/** Cặp nút quyết định cho từng mục đề xuất: 'y' = duyệt, 'n' = không duyệt, '' = chưa quyết. */
const decHtml = (id, v, small) => `<span class="dec ${small ? 'sm' : ''}"><button class="y ${v === 'y' ? 'on' : ''}" data-dec="${esc(id)}" data-v="y" title="Duyệt — áp dụng thay đổi này">✓${small ? '' : ' Duyệt'}</button><button class="n ${v === 'n' ? 'on' : ''}" data-dec="${esc(id)}" data-v="n" title="Không duyệt — giữ nguyên">✗${small ? '' : ' Không'}</button></span>`;
const decCount = (ids, dec) => { let y = 0, n = 0; for (const i of ids) { const v = dec.get(i); if (v === 'y') y++; else if (v === 'n') n++; } return { y, n, u: ids.length - y - n }; };
const decBar = (c, extra = '') => `<div class="decbar"><span class="pill p-ok">✓ Duyệt ${c.y}</span><span class="pill p-err">✗ Không ${c.n}</span><span class="pill p-mute">Chưa quyết ${c.u}</span><span style="flex:1"></span>${extra}<button class="btn sm" data-decall="y">✓ Duyệt tất cả</button><button class="btn sm" data-decall="n">✗ Không duyệt tất cả</button><button class="btn sm" data-decall="">↺ Bỏ quyết định</button></div>`;

// ═════════════════ KIỂM TRA DỮ LIỆU ĐÃ NẠP (khách hàng nạp từ trước) ═════════════════
const FIX_TXT = (f) => (f.action === 'currency' ? `Gắn loại tiền ${f.currency || 'USD'} cho các dòng chưa ghi loại tiền` : f.action === 'scale' ? `Nhân số tiền các dòng × ${BK.fmtMoney(f.factor)} (đổi sang đồng)` : f.action === 'swap' ? 'Đảo cột: tiền HĐ ↔ tiền giải ngân' : f.action === 'hd_from_gn' ? 'Tiền HĐ = tiền giải ngân (cột GN là tổng các khoản của chứng từ)' : 'Giữ nguyên');
const KTYPE = { ngoai_te: 'Có thể là ngoại tệ', don_vi: 'Sai đơn vị tiền', dao_cot: 'Đảo cột tiền', cot_tong: 'Tiền HĐ chỉ là 1 phần', ai: 'AI phát hiện' };
function promptOld(c, ks, prof) {
  const pick = [...new Set([...prof.issues.map((i) => i.kid), ...ks.map((k) => k.id)])].slice(0, 60);
  const byId = new Map(ks.map((k) => [k.id, k]));
  return `Bạn là chuyên viên kiểm soát giải ngân ngân hàng Việt Nam. Dưới đây là dữ liệu bảng kê hóa đơn giải ngân ĐÃ NẠP của khách hàng "${c.name}" (nhiều khế ước nhận nợ — KUNN).
Hãy rà xem mỗi KUNN có bị sai ĐƠN VỊ TIỀN (ghi theo nghìn/triệu đồng thay vì đồng), sai LOẠI TIỀN (số tiền là USD/EUR… nhưng không ghi loại tiền — số có phần lẻ thường là ngoại tệ),
hoặc ĐẢO CỘT (tiền hóa đơn ↔ tiền giải ngân) không. So sánh độ lớn số tiền giữa các KUNN của cùng khách hàng. Chỉ đề xuất khi có căn cứ.
Hành động được phép: "currency" (gắn loại tiền, kèm currency), "scale" (nhân số tiền, kèm factor 1000 hoặc 1000000), "swap" (đảo 2 cột tiền), "hd_from_gn" (tiền HĐ đang chỉ lấy 1 khoản, vd chỉ thuế GTGT, trong khi tiền GN là tổng các khoản của chứng từ → đặt tiền HĐ = tiền GN), "none".
Trả JSON: {"items":[{"so_kunn":"…","action":"currency|scale|swap|hd_from_gn|none","currency":"USD","factor":1000,"ly_do":"ngắn, tiếng Việt","tin_cay":0.0-1.0}], "summary":"1–2 câu kết luận"}

${pick.map((id) => { const k = byId.get(id); const ls = k.lines.filter((l) => !l.lech); const s = BK.kunnSummary(k);
    return `KUNN ${k.so_kunn} · GN ${k.ngay_gn || '?'} · số tiền KUNN ${k.so_tien ?? '—'} · ${k.lines.length} dòng · tổng GN các dòng ${s.tong_gn}
${ls.slice(0, 4).map((l) => `  - ${l.ncc} | HĐ ${l.so_hd} | ${l.ngay_hd || ''} | tiền HĐ ${l.tien_hd ?? ''} | GN ${l.tien_gn ?? ''} | loại tiền ${l.loai_tien || '(trống)'}${l.raw ? ` | gốc: ${l.raw.slice(0, 160)}` : ''}`).join('\n')}`; }).join('\n')}`;
}
function openOldCheck(cid) {
  const c = cust(cid); if (!c) return;
  const ks = S.store.kunnsOf(cid).sort((a, b) => (a.ngay_gn || '').localeCompare(b.ngay_gn || ''));
  if (!ks.length) return toast('Khách hàng chưa có KUNN nào');
  const prof = BK.storedProfile(ks);
  const st = { ai: null, busy: false, dec: new Map(), lineNo: new Set(), open: new Set() };
  const m = modal(`<div class="mh"><h2>🧪 Kiểm tra dữ liệu đã nạp — ${esc(c.name)}</h2><button class="x" data-close>&times;</button></div><div class="mb" id="ocB"></div>
    <div class="mf"><span class="hist" style="flex:1">Rà lỗi từng dòng (lệch cột, ngày sau GN…) → <button class="lnk" ${A({ act: 'audit', cid })}>🤖 Rà soát bảng kê</button></span><button class="btn" id="ocAI">🤖 AI rà dữ liệu cũ</button><button class="btn pri" id="ocGo">Áp dụng</button></div>`);
  const props = () => {
    const out = prof.issues.map((i, n) => ({ id: 'r' + n, kid: i.kid, so_kunn: i.so_kunn, type: i.type, text: i.text, fix: i.fix, src: 'Luật' }));
    if (st.ai && st.ai.items) st.ai.items.forEach((x, n) => {
      if (!x || !x.action || x.action === 'none') return;
      const k = ks.find((y) => BK.normKunn(y.so_kunn) === BK.normKunn(x.so_kunn)); if (!k) return;
      out.push({ id: 'a' + n, kid: k.id, so_kunn: k.so_kunn, type: 'ai', text: x.ly_do || '', fix: { action: x.action, currency: x.currency, factor: +x.factor || 1000 }, src: `AI ${x.tin_cay != null ? Math.round(x.tin_cay * 100) + '%' : ''}` });
    });
    return out;
  };
  const draw = () => {
    const ps = props();
    $('#ocB', m).innerHTML = `
      <div class="sec" style="margin-top:0">Sức khỏe từng trường (${prof.n} dòng · ${ks.length} KUNN)</div>
      <div class="card tw"><table class="t"><thead><tr><th>Trường</th><th class="right">Bỏ trống</th><th>Bất thường</th><th>Đánh giá</th></tr></thead><tbody>

  const LAB = { tien_hd: 'Tiền HĐ', tien_gn: 'Tiền GN', loai_tien: 'Loại tiền' };
  function oldDetail(x) {
    const k = ks.find((y) => y.id === x.kid); if (!k) return [];
    const fix = { ...x.fix, currency: curOf(x) };
    const byId = new Map(k.lines.map((l) => [l.id, l]));
    return BK.kunnFixPatches(k, fix).map((pt) => { const l = byId.get(pt.id);
      return { l, pt, ch: Object.keys(pt).filter((f) => f !== 'id').map((f) => ({ lab: LAB[f] || f, o: f === 'loai_tien' ? l[f] || '(trống = VND)' : money(l[f], l.loai_tien) || '—', n: f === 'loai_tien' ? pt[f] : money(pt[f], l.loai_tien) || '—' })) }; });

    if (!aiKeys().length) { openSettings('ai'); return toast('Nạp API key Gemini trước', 'err'); }
    st.busy = true; draw();
    try {
      const r = await aiJson(promptOld(c, ks, prof), { thinking: 'medium', maxTokens: 16000 });
      st.ai = r;

    } catch (e) { st.ai = { err: errMsg(e) }; }
    st.busy = false; draw();
  };
  $('#ocGo', m).onclick = async () => {
    const list = props().filter((x) => st.dec.get(x.id) === 'y');
    const done = new Set();
    try {
      await S.store.group(`Kiểm tra dữ liệu cũ: áp dụng ${list.length} đề xuất`, async () => {
        for (const x of list) {
          const key = x.kid + x.fix.action; if (done.has(key)) continue; done.add(key);
          const fix = { ...x.fix, currency: curOf(x) };
          const k = S.store.kunnsOf(cid).find((y) => y.id === x.kid); if (!k) continue;
          const patches = BK.kunnFixPatches(k, fix).filter((pt) => !st.lineNo.has(x.id + '|' + pt.id));
          if (patches.length) await S.store.patchLines(k.id, patches, meta(), cid);
          log(cid, 'sua_du_lieu', `Kiểm tra dữ liệu cũ — KUNN ${k.so_kunn}: ${FIX_TXT(fix)} (${patches.length} dòng duyệt)`);
        }
      });
      m.remove(); toast(`Đã áp dụng ${done.size} đề xuất — bấm ↶ (Ctrl+Z) nếu muốn hoàn tác`, 'ok', 6000);
    } catch (e) { toast(errMsg(e), 'err', 9000); }
  };
  draw();
}

async function patch(kid, patches, what) {

  try { await S.store.patchLines(kid, patches, meta(), S.cid); log(S.cid, 'sua_dong', `KUNN ${k ? k.so_kunn : ''}: ${what} (${patches.length} dòng)`); refreshSummary(); }
  catch (e) { toast(errMsg(e), 'err'); }
}
async function updKunn(kid, p, what) {

const IMP = {};
async function readWorkbook(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: false });
  const sheets = {};
  for (const n of wb.SheetNames) {
    const ws = wb.Sheets[n];
    if (!ws || !ws['!ref']) continue;
    const g = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    if (g.length) sheets[n] = g;
  }
  return sheets;
}

async function aiDetect(btn) {

  try {
    // gửi sheet đang chọn + vài sheet khác có dữ liệu (không gửi cả file)
    const names = [IMP.sheet, ...Object.keys(IMP.sheets).filter((n) => n !== IMP.sheet && BK.detectHeader(IMP.sheets[n]).score > 0)].slice(0, 3);
    const r = await aiJson(promptMap(Object.fromEntries(names.map((n) => [n, IMP.sheets[n]]))));
    const sheet = IMP.sheets[r.sheet] ? r.sheet : IMP.sheet;
    IMP.sheet = sheet;
    IMP.headerRow = IMP.dataHeader = Math.max(0, (r.header_row | 0) - 1);
    IMP.map = BK.aiMappingToMap(r.columns || {});
    const k = r.kunn || {};
    const title = BK.extractTitleInfo(IMP.sheets[sheet], IMP.headerRow);
    IMP.kinfo = { so_kunn: k.so_kunn || title.so_kunn || IMP.kinfo.so_kunn || '', ngay_gn: BK.toISO(k.ngay_gn) || title.ngay_gn || IMP.kinfo.ngay_gn || '', ngay_dh: BK.toISO(k.ngay_dh) || '', so_tien_kunn: BK.parseAmount(k.so_tien) };
    IMP.aiRows = null;
    IMP.how = `AI (${aiModel()}) nhận dạng: sheet “${sheet}”, tiêu đề hàng ${IMP.headerRow + 1}`;
    IMP.aiNote = r.note || '';
    extract(); renderImport(); toast('AI đã nhận dạng cột — kiểm tra lại bảng ánh xạ', 'ok');
  } catch (e) { toast(e.message, 'err', 8000); btn.innerHTML = old; btn.disabled = false; }
}
async function aiReadAll(btn) {
  const g = IMP.sheets[IMP.sheet];
  const rows = g.map((r, i) => ({ r, i })).filter(({ r }) => r.some((v) => String(v).trim() !== ''));
  if (rows.length > 900 && !confirm(`Sheet có ${rows.length} hàng — AI đọc toàn bộ sẽ chậm và tốn lượt. Tiếp tục?`)) return;
  btn.disabled = true;
  try {
    const head = BK.gridToPrompt(g.slice(0, 12), 12, 80);
    const out = [];
    const CH = 120;
    for (let s = 0; s < g.length; s += CH) {
      btn.innerHTML = `<span class="spin"></span> AI đọc ${Math.min(s + CH, g.length)}/${g.length} hàng…`;
      const part = g.slice(s, s + CH).map((r, i) => (s + i < 12 ? [] : r));
      const text = BK.gridToPrompt([...Array(s).fill([]), ...part], CH + 20, 80);
      if (!text.trim()) continue;
      const r = await aiJson(promptRows(IMP.sheet, `PHẦN ĐẦU SHEET (để biết tiêu đề, số KUNN):\n${head}\n\nCÁC HÀNG CẦN ĐỌC:\n${text}`), { maxTokens: 60000 });
      out.push(...(r.rows || []));
    }
    IMP.aiRows = out; IMP.how = `AI (${aiModel()}) đọc toàn bộ ${out.length} dòng`;
    extract(); renderImport(); toast(`AI đọc được ${out.length} dòng`, 'ok');
  } catch (e) { toast(e.message, 'err', 8000); btn.disabled = false; btn.innerHTML = '✨ AI đọc toàn bộ'; }
}
const ERR_ST = ['da_du', 'vuot', 'trung_file'];
async function saveImport(opt = {}) {
  const m = IMP.m;
  let cid = IMP.cid;
  if (!cid) {
    const name = ($('#iNew', m).value || '').trim();
    if (!name) return toast('Chọn khách hàng hoặc nhập tên khách hàng mới', 'err');
    const ex = S.customers.find((c) => BK.fold(c.name) === BK.fold(name));
    if (ex) cid = ex.id;
    else { const c = { id: BK.uid(), name, mst: '', createdAt: Date.now(), createdBy: userName(), owner: userName(), ...meta() }; await S.store.putCustomer(c); cid = c.id; }
    IMP.cid = cid; await loadExisting(); recheck(false);
  }
  const ch = IMP.check;
  const todo = ch.groups.map((g, gi) => ({ g, gi })).filter(({ gi }) => IMP.mode[gi] !== 'skip');
  const missing = todo.filter(({ g }) => !g.so_kunn || !g.ngay_gn);
  if (missing.length) return toast('Còn KUNN thiếu số KUNN hoặc ngày giải ngân — điền ở mục “Thông tin khế ước”', 'err', 7000);
  if (ch.errors && !opt.skipErr && !opt.all && !confirm(`Có ${ch.errors} dòng bị cảnh báo giải ngân nhầm (vượt / đã GN đủ / trùng). Vẫn nạp cả các dòng này vào sổ?\n(Bấm Hủy rồi chọn “Nạp … bỏ dòng lỗi” nếu chỉ muốn nạp dòng hợp lệ.)`)) return;
  const btns = $$('#iSave, [data-save]', m); btns.forEach((b) => { b.disabled = true; }); const btn = $('#iSave', m); btn.innerHTML = '<span class="spin"></span> Đang nạp…';
  let nBo = 0;
  try {
    let n = 0, nl = 0;
    const docs = [];
    for (const { g } of todo) {
      const old = (IMP.existing || []).find((k) => BK.normKunn(k.so_kunn) === BK.normKunn(g.so_kunn));
      // thay bản cũ: giữ trạng thái hồ sơ gốc của dòng trùng hóa đơn
      const oldBy = new Map((old ? old.lines : []).map((l) => [BK.strongKey(l), l]));
      const keep = opt.skipErr ? g.lines.filter((l) => !ERR_ST.includes(l.check.status)) : g.lines;
      nBo += g.lines.length - keep.length;
      if (!keep.length) continue;
      const lines = keep.map((l) => {
        const o = oldBy.get(BK.strongKey(l));
        const c = BK.cleanLine(l);
        if (o) { c.id = o.id; if (l.goc === 'chua' && !l.thieu) { c.goc = o.goc; c.thieu = o.thieu; c.ngay_nhan = o.ngay_nhan; } if (!c.ghi_chu) c.ghi_chu = o.ghi_chu; }
        return c;
      });
      const k = { ...(old || {}), id: old ? old.id : BK.uid(), customerId: cid, so_kunn: String(g.so_kunn), ngay_gn: g.ngay_gn, ngay_dh: g.ngay_dh || '', so_tien: g.so_tien ?? null,
        han_bs: old ? old.han_bs || '' : '', ghi_chu: old ? old.ghi_chu || '' : '', source: IMP.file, hdr: g.hdr || '', lines, createdAt: old ? old.createdAt : Date.now(), createdBy: old ? old.createdBy : userName(), ...meta() };
      docs.push(k); n++; nl += lines.length;
    }
    await S.store.putKunns(docs);
    if (!docs.length) { btns.forEach((b) => { b.disabled = false; }); btn.textContent = '⬆ Nạp vào sổ theo dõi'; return toast('Không còn dòng hợp lệ nào để nạp', 'err'); }
    await S.store.group(`Nạp ${IMP.file} (${docs.length} KUNN)`, () => S.store.putKunns(docs));
    log(cid, 'tai_bang_ke', `Nạp ${IMP.file}: ${n} KUNN, ${nl} dòng${nBo ? ` — bỏ ${nBo} dòng lỗi (đã GN / vượt / trùng)` : ch.errors ? ` (gồm ${ch.errors} dòng cảnh báo)` : ''}`);
    m.remove();
    toast(`Đã nạp ${n} KUNN, ${nl} dòng vào sổ${nBo ? ` · bỏ ${nBo} dòng lỗi` : ''}`, 'ok', 6000);
    if (docs.length === 1) openKunn(cid, docs[0].id); else { S.tab = 'kunn'; selectCustomer(cid); }
  } catch (e) { toast(errMsg(e), 'err', 9000); btns.forEach((b) => { b.disabled = false; }); btn.textContent = '⬆ Nạp vào sổ theo dõi'; }
}

async function restore(file) {

    if (d.app !== 'bangke-gn') throw new Error('Không phải file sao lưu của công cụ này');
    if (!confirm(`Nạp ${d.customers.length} khách hàng, ${d.kunn.length} KUNN từ file sao lưu (${new Date(d.at).toLocaleString('vi-VN')}, ${d.by})?\nKUNN trùng mã sẽ lấy bản sửa sau cùng.`)) return;
    await mergeData(d);

  } catch (e) { toast('Không nạp được: ' + e.message, 'err', 8000); }
}
async function mergeData(d) {
  const st = S.store;
  const newer = (map, r) => !map.has(r.id) || (r.updatedAt || 0) > (map.get(r.id).updatedAt || 0);
  const cs = d.customers.filter((c) => newer(st.c, c)), ks = d.kunn.filter((k) => newer(st.k, k));
  await st.applyRemote('kh', cs); await st.applyRemote('ku', ks);
  st._out('kh', cs); st._out('ku', ks);
  for (const x of (d.log || []).slice(0, 5000)) await st.addLog(x, true).catch(() => {});
  st.emit('c'); st.emit('k');
  if (S.cid) selectCustomer(S.cid);
}

  file: (kind, cid) => `${kind}_${cid || 'chung'}.docx`,
  async get(kind, cid) {
    for (const id of cid ? [cid, ''] : ['']) {
      let r = await S.store.getMeta(this.key(kind, id));
      if (S.sync && S.sync.state === 'on') {               // máy khác vừa cập nhật mẫu → lấy bản mới
        const b = await S.sync.readBin(this.file(kind, id)).catch(() => null);
        if (b && (!r || b.at > r.at)) { r = { buf: b.buf, at: b.at, by: 'thư mục chung', name: this.file(kind, id) }; await S.store.setMeta(this.key(kind, id), r); }
      }

  async put(kind, cid, rec) {
    if (S.sync && S.sync.state === 'on') {

/** File Word người dùng chọn → mẫu: đã có {{…}} thì dùng luôn, chưa có thì tự nhận các trường từ bản đã điền. */
async function makeTemplate(buf, kindHint) {
  const JSZip = await jszip();
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('Không phải file Word .docx (nếu là .doc, mở bằng Word rồi Lưu thành .docx)');
  const doc = DOCX.parse(await f.async('string'));
  const kind = DOCX.guessKind(doc) || kindHint;
  if (DOCX.fieldsIn(doc).length) return { buf, kind, values: {}, found: DOCX.fieldsIn(doc), learned: false };
  const r = DOCX.learn(doc, kind);
  if (!r.found.length) throw new Error('Không nhận ra trường nào cần điền trong file này — kiểm tra lại có phải KUNN/PDGN không');
  zip.file('word/document.xml', DOCX.serialize(r.doc));
  return { buf: await zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' }), kind: r.kind || kindHint, values: r.values, found: r.found, learned: true };
}

function domText(el) {
  let s = '';
  const ns = [...el.childNodes];
  ns.forEach((c, i) => {
    if (c.nodeType === 3) s += c.nodeValue;
    else if (c.nodeType === 1) {
      if (c.classList.contains('df')) s += `{{${c.dataset.f}}}`;
      else if (c.tagName === 'BR') { if (i < ns.length - 1) s += '\n'; }
      else s += domText(c);
    }
  });
  return s;
}
function domP(n, store) {
  const ps = store[n.dataset.i], items = [], ed = n.classList.contains('ed');
  let cur = null;
  const push = (rPr, text) => { if (ed) text = text.replace(/\u00a0/g, ' '); if (cur && cur.rPr === rPr) cur.text += text; else { cur = { k: 'r', rPr, text }; items.push(cur); } };
  const ns = [...n.childNodes];
  ns.forEach((c, i) => {
    if (c.nodeType === 3) return push(ps.mark, c.nodeValue);
    if (c.nodeType !== 1 || c.classList.contains('dn')) return;
    if (c.classList.contains('dr')) return push(store[c.dataset.i].rPr, domText(c));
    if (c.classList.contains('dx')) { cur = null; items.push({ k: 'x', xml: store[c.dataset.i].xml, text: '' }); return; }
    if (c.classList.contains('dc')) { cur = null; items.push({ k: 'cb', xml: store[c.dataset.i].xml, on: c.dataset.on === '1' }); return; }
    if (c.classList.contains('df')) return push(ps.mark, `{{${c.dataset.f}}}`);
    if (c.tagName === 'BR') { if (i < ns.length - 1) push(ps.mark, '\n'); return; }
    push(ps.mark, domText(c));
  });
  return { t: 'p', pPr: ps.pPr, items, ed };
}
function domBlocks(el, store) {
  const out = [];
  for (const n of el.children) {
    if (n.classList.contains('dp')) out.push(domP(n, store));
    else if (n.classList.contains('dtw')) {
      const t = n.querySelector(':scope > table'), ts = store[t.dataset.i];
      out.push({ t: 'tbl', pre: ts.pre, list: t.classList.contains('lt') ? ts.list || '1' : '', rows: [...t.tBodies[0].rows].map((tr) => ({ pre: store[tr.dataset.i].pre, cells: [...tr.cells].map((td) => ({ pre: td.dataset.vm === 'none' ? DOCX.setVMerge(store[td.dataset.i].pre, '') : store[td.dataset.i].pre, blocks: domBlocks(td, store) })) })) });
    } else if (n.classList.contains('dxb')) out.push({ t: 'x', xml: store[n.dataset.i].xml });
  }
  return out;
}

    const words = BK.fold(raw.replace(/[0-9][0-9A-Za-z./-]*/g, ' ')).split(/\s+/).filter((w) => w.length >= 2);
    if (!nums.length && !words.length) { $('#lkR', m).innerHTML = ''; return; }
    const res = [];
    for (const c of S.customers) {
      if (cid && c.id !== cid) continue;
      for (const iv of analysisOf(c.id).invoices) {
        if (nums.length && !nums.includes(BK.invNo(iv.so_hd))) continue;
        const nf = BK.fold(iv.ncc);
        if (words.length && !words.every((w) => nf.includes(w))) continue;
        res.push({ c, iv });
        if (res.length > 300) break;
      }
    }
    const st = (iv) => iv.status === 'du' ? '<span class="pill p-err">ĐÃ GIẢI NGÂN ĐỦ</span>' : iv.status === 'vuot' ? '<span class="pill p-err">ĐÃ GN VƯỢT</span>' : iv.status === 'mot_phan' ? `<span class="pill p-info">Đã GN 1 phần · còn ${money(iv.con_lai, iv.loai_tien)}</span>` : '<span class="pill p-warn">Đã GN · thiếu tiền HĐ</span>';
    $('#lkR', m).innerHTML = res.length
      ? `<div class="hist" style="margin:6px 0">Tìm thấy ${res.length} hóa đơn khớp — bấm dòng để mở KUNN</div><div class="card tw" style="max-height:60vh"><table class="t click"><thead><tr><th>Khách hàng</th><th>Nhà cung cấp</th><th>Số HĐ</th><th>Ngày HĐ</th><th class="right">Tiền HĐ</th><th class="right">Đã GN</th><th>Tình trạng</th><th>Đã giải ngân ở</th></tr></thead><tbody>
        ${res.map(({ c, iv }) => `<tr ${A({ act: 'open', cid: c.id, k: iv.uses[iv.uses.length - 1].kunnId })}><td>${esc(c.name)}</td><td>${esc(iv.ncc)}</td><td><b>${esc(iv.so_hd)}</b>${iv.ky_hieu ? `<div class="hist">${esc(iv.ky_hieu)}</div>` : ''}</td><td>${dd(iv.ngay_hd)}</td><td class="num">${money(iv.tien_hd, iv.loai_tien)}</td><td class="num"><b>${money(iv.tong_gn, iv.loai_tien)}</b></td><td>${st(iv)}</td>
          <td class="hist">${iv.uses.map((u) => `KUNN ${esc(u.so_kunn)} (${dd(u.ngay_gn)}): ${money(u.tien_gn)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="verdict ok" style="margin-top:10px"><b>✓ Chưa thấy hóa đơn ${esc(raw)} trong sổ ${cid ? 'của khách hàng này' : 'của mọi khách hàng'}</b><span>Hóa đơn này chưa được giải ngân lần nào (theo dữ liệu đã nạp vào tool).</span></div>`;
  };
  let t; $('#lkQ', m).oninput = () => { clearTimeout(t); t = setTimeout(draw, 250); };
  $('#lkC', m).onchange = draw;
  draw(); $('#lkQ', m).focus();
}
$('#bExport').onclick = () => exportCustomer();

// ═════════════════ CÀI ĐẶT (Alt+F9) ═════════════════
function openSettings(focus) {
  const o = aiSettings();
  const mask = (k) => (k.length > 12 ? k.slice(0, 6) + '…' + k.slice(-4) : '••••');
  const curModel = o.model || AI_MODEL_FALLBACK;
  const m = modal(`<div class="mh"><h2>Cài đặt</h2><button class="x" data-close>&times;</button></div><div class="mb">
    <div class="sec" style="margin-top:0">1. API key Gemini</div>
    <div class="hist" style="margin-bottom:8px">Lưu trên trình duyệt máy này . Key hết lượt thì tool tự chuyển sang key bật kế tiếp. Lấy key miễn phí tại aistudio.google.com/apikey.</div>
    <table class="t" style="margin-bottom:8px"><thead><tr><th>Dùng trước</th><th>Bật</th><th>Tên</th><th>Key</th><th></th></tr></thead><tbody>
    ${o.keys.map((k, i) => `<tr><td><input type="radio" name="sk-act" value="${i}" ${(o.active | 0) === i ? 'checked' : ''}></td><td><input type="checkbox" data-on="${i}" ${k.on !== false ? 'checked' : ''}></td><td>${esc(k.name) || '<i class="muted">(không tên)</i>'}</td><td class="mono">${esc(mask(k.key))}</td>
      <td><button class="btn sm" data-test="${i}">Thử</button> <button class="btn sm danger" data-del="${i}">Xóa</button> <span data-res="${i}" class="hist"></span></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Chưa có key nào.</td></tr>'}</tbody></table>
    <div class="bar"><input class="inp" id="skName" placeholder="Tên gợi nhớ" style="width:150px"><input class="inp" id="skKey" placeholder="Dán API key (AIza…) — nhiều key thì cách nhau dấu phẩy" style="flex:1;min-width:240px"><button class="btn pri" id="skAdd">Thêm key</button></div>
    <label class="f" style="max-width:320px">Model<select class="inp" id="skModel">${[...new Set([curModel, ...AI_MODELS])].map((x) => `<option ${x === curModel ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
    <div class="sec">2. Thư mục chung (đồng bộ nhiều máy)</div>
    <div class="hist" style="margin-bottom:8px">Như CIC Analyzer: cả team cùng chọn <b>một thư mục chung nội bộ</b> (ổ mạng chung, thư mục OneDrive / Google Drive đồng bộ…). Mỗi khách hàng, mỗi KUNN được ghi thành một tệp JSON trong thư mục con <b>BangKe_GiaiNgan</b>; máy khác tự quét về (30 giây/lần hoặc bấm “Đồng bộ ngay”). Không qua máy chủ nào. Cần Chrome hoặc Edge trên máy tính.</div>
    <label class="f" style="max-width:340px">Tên của bạn (ghi vào từng tệp & nhật ký)<input class="inp" id="skUser" value="${esc(lsGet(LS.user))}" placeholder="vd: Thu Hà"></label>
    <div id="syncBox" style="margin-top:10px"></div>
    <div class="sec">3. Sao lưu dữ liệu</div>
    <div class="hist" style="margin-bottom:6px">Xuất toàn bộ dữ liệu ra 1 file .json (để chuyển máy / gửi người chưa vào thư mục chung) hoặc nạp file sao lưu — gộp theo bản sửa sau cùng.</div>
    <div class="bar"><button class="btn" id="skBackup">⬇ Sao lưu ra file</button><button class="btn" id="skRestore">⬆ Nạp file sao lưu</button></div>
    <div class="sec">4. Hồ sơ gốc</div>
    <label class="f" style="max-width:320px">Hạn nộp hồ sơ gốc mặc định (số ngày sau giải ngân)<input class="inp" id="skHan" type="number" min="1" value="${hanNgay()}"></label>
    <div id="skMsg" class="hist" style="margin-top:8px"></div></div>
    <div class="mf"><button class="btn" data-close>Đóng</button><button class="btn pri" id="skSave">Lưu cài đặt</button></div>`, 'sm');
  const collect = () => {
    $$('[data-on]', m).forEach((cb) => { o.keys[+cb.dataset.on].on = cb.checked; });
    const a = $('input[name=sk-act]:checked', m); if (a) o.active = +a.value;
    o.model = $('#skModel', m).value;
  };
  $('#skAdd', m).onclick = () => {
    collect();
    const ks = ($('#skKey', m).value || '').split(/[\s,;]+/).map((x) => x.trim()).filter((x) => x.length > 15);
    if (!ks.length) return toast('Chưa dán key hợp lệ', 'err');
    ks.forEach((k, i) => { if (!o.keys.some((x) => x.key === k)) o.keys.push({ key: k, name: ($('#skName', m).value || '').trim() + (ks.length > 1 ? ` #${i + 1}` : ''), on: true }); });
    aiSave(o); m.remove(); openSettings(); toast(`Đã thêm ${ks.length} key`, 'ok');
  };
  $$('[data-del]', m).forEach((b) => b.onclick = () => { collect(); o.keys.splice(+b.dataset.del, 1); if ((o.active | 0) >= o.keys.length) o.active = 0; aiSave(o); m.remove(); openSettings(); });
  $$('[data-test]', m).forEach((b) => b.onclick = async () => {
    collect(); const i = +b.dataset.test, out = $(`[data-res="${i}"]`, m); out.textContent = 'đang thử…';
    const body = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Trả lời đúng một chữ: OK' }] }], generationConfig: { maxOutputTokens: 64 } });
    let ok = '', why = '';
    for (const gw of AI_GATEWAYS) {
      try { const r = await fetch(gw(o.model || AI_MODEL_FALLBACK, o.keys[i].key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        if (r.ok) { ok = gw === AI_GATEWAYS[0] ? 'Vertex' : 'Gemini API'; break; }
        const t = await r.text(); why = `${r.status}: ${(t.match(/"message":\s*"([^"]{0,120})/) || [, t.slice(0, 120)])[1]}`;
      } catch (e) { why = 'mạng chặn'; }
    }
    out.textContent = ok ? `✓ chạy được (${ok})` : `✗ ${why}`; out.style.color = ok ? 'var(--ok)' : 'var(--err)';
  });
  renderSyncBox(m);
  $('#skBackup', m).onclick = () => backup().catch((e) => toast(e.message, 'err'));
  $('#skRestore', m).onclick = () => { m.remove(); $('#fileRestore').click(); };
  $('#skUser', m).onchange = (e) => lsSet(LS.user, e.target.value.trim());
  $('#skSave', m).onclick = async () => {
    collect(); aiSave(o);
    lsSet(LS.user, $('#skUser', m).value.trim());
    lsSet(LS.han, String(Math.max(1, +$('#skHan', m).value || 30)));
    m.remove();
    toast('Đã lưu cài đặt', 'ok');
    renderMain();
  };
  if (focus === 'ai') setTimeout(() => $('#skKey', m).focus(), 50);
}
function renderSyncBox(m) {
  const box = $('#syncBox', m); if (!box) return;
  const sy = S.sync; if (!sy) return;
  const st = sy.state;
  const chips = Object.entries(sy.people || {}).map(([n, c]) => `<span class="pill p-info">${esc(n)} <b>${c}</b></span>`).join(' ');
  const info = st === 'on' ? `<b>✓ Đang kết nối: ${esc(sy.name)}</b>${sy.busy ? `<div class="hist" style="color:var(--blue)"><span class="spin"></span> ${esc(sy.busy)}</div>` : ''}<div class="hist">Lần đồng bộ cuối: ${sy.last ? new Date(sy.last).toLocaleString('vi-VN') : '—'} · ${sy.nFiles} tệp trong thư mục</div><div class="chips">${chips}</div>`
    : st === 'reconnect' ? `<b>Thư mục “${esc(sy.name)}” cần cấp quyền lại</b><div class="hist">Trình duyệt hỏi lại quyền mỗi lần mở file — bấm “Kết nối lại”.</div>`
    : st === 'error' ? `<b style="color:var(--err)">Lỗi thư mục chung</b><div class="hist">${esc(sy.err)}</div>`
    : '<b>Chưa kết nối thư mục chung</b><div class="hist">Dữ liệu đang chỉ lưu trên trình duyệt máy này.</div>';
  const btns = st === 'on' ? '<button class="btn pri" data-sy="pull">Đồng bộ ngay</button><button class="btn" data-sy="push">Gửi toàn bộ kho lên</button><button class="btn" data-sy="pick">Đổi thư mục</button><button class="btn danger" data-sy="off">Ngắt kết nối</button>'
    : st === 'reconnect' ? '<button class="btn pri" data-sy="re">Kết nối lại</button><button class="btn" data-sy="pick">Chọn thư mục khác</button><button class="btn danger" data-sy="off">Ngắt kết nối</button>'
    : '<button class="btn pri" data-sy="pick">📁 Chọn thư mục chung</button>' + (st === 'error' ? '<button class="btn danger" data-sy="off">Ngắt kết nối</button>' : '');
  box.innerHTML = !sy.supported
    ? '<div class="note err">Trình duyệt này không hỗ trợ chọn thư mục. Mở file bằng <b>Chrome</b> hoặc <b>Edge</b> trên máy tính. Tạm thời dùng Sao lưu / Nạp sao lưu để chuyển dữ liệu.</div>'
    : `<div class="card" style="padding:12px 14px;border-left:4px solid ${st === 'on' ? 'var(--ok)' : st === 'off' ? 'var(--line)' : 'var(--err)'}">${info}<div class="bar" style="margin:10px 0 0">${btns}</div></div>`;
  $$('[data-sy]', box).forEach((b) => { b.onclick = () => syncAction(b.dataset.sy, b); });
}
async function syncAction(a, btn) {
  const sy = S.sync;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + btn.textContent; }
  try {
    if (a === 'pick') {
      await sy.pick();
      toast(`Đã kết nối thư mục “${sy.name}”`, 'ok');
      if (S.store.customers().length && confirm('Gửi toàn bộ dữ liệu đang có trên máy này lên thư mục chung để cả team thấy?')) sy.pushAll().then((n) => toast(`Đã gửi ${n} hồ sơ lên thư mục chung`, 'ok')).catch((e) => toast(errMsg(e), 'err', 9000));
    } else if (a === 're') { await sy.reconnect(); if (sy.state === 'on') toast('Đã kết nối lại thư mục chung', 'ok'); }
    else if (a === 'pull') { const n = await sy.pull(); await sy.flush(); if (!n) toast('Đã đồng bộ — không có gì mới'); }
    else if (a === 'push') { const n = await sy.pushAll(); toast(`Đã gửi ${n} hồ sơ lên thư mục chung`, 'ok'); }
    else if (a === 'off') { if (confirm('Ngắt kết nối thư mục chung? Dữ liệu trên máy này vẫn giữ nguyên.')) await sy.disconnect(); }
  } catch (e) {
    if (e.name === 'AbortError') toast('Đã hủy chọn thư mục');
    else if (e.name === 'SecurityError' || e.name === 'NotAllowedError') toast('Trình duyệt không cho dùng thư mục này (thư mục hệ thống, hoặc bạn bấm “Không cho phép”). Chọn một thư mục con trong ổ chung, vd Z:\\BangKe, rồi bấm “Cho phép sửa”.', 'err', 12000);
    else toast(errMsg(e), 'err', 9000);
  }
  if ($('#syncBox')) renderSyncBox(document);
}
$('#bSettings').onclick = () => openSettings();
function renderHist() {
  const st = S.store; if (!st) return;
  const u = st.undoS[st.undoS.length - 1], r = st.redoS[st.redoS.length - 1];
  $('#bUndo').disabled = !u; $('#bRedo').disabled = !r;
  $('#bUndo').title = u ? `Hoàn tác: ${u.label} (Ctrl+Z)` : 'Không có gì để hoàn tác';
  $('#bRedo').title = r ? `Làm lại: ${r.label} (Ctrl+Y)` : 'Không có gì để làm lại';
}
async function doUndo(redo) {
  const st = S.store; if (!st) return;
  const e = redo ? await st.redo() : await st.undo();
  if (!e) return toast(redo ? 'Không có gì để làm lại' : 'Không có gì để hoàn tác');
  toast(`${redo ? '↷ Đã làm lại' : '↶ Đã hoàn tác'}: ${e.label}`, 'ok');
  if (S.cid) log(S.cid, redo ? 'lam_lai' : 'hoan_tac', `${redo ? 'Làm lại' : 'Hoàn tác'}: ${e.label}`);
}
$('#bUndo').onclick = () => doUndo(false);
$('#bRedo').onclick = () => doUndo(true);
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;   // để ô nhập tự hoàn tác chữ
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(false); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); doUndo(true); }
});
$('#syncPill').onclick = () => { if (S.sync && S.sync.state === 'reconnect') syncAction('re'); else openSettings(); };
document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'F9') { e.preventDefault(); openSettings(); } });

window.BKAPP = { exportDashboard, state: S, buildCustomerWorkbook };
startStore().catch((e) => { console.error(e); toast('Lỗi khởi động: ' + e.message, 'err', 10000); });
// cổng cho bài kiểm tra tự động (không dùng trong giao diện)
window.BKAPP = { S, cust, selectCustomer, makeTemplate, TPL, openHoSo };
})();
