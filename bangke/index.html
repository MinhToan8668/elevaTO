          const sameHd = (so) => { const x = String(so || '').replace(/^(hđmb|hdmb|hợp đồng|hd)[:\s]*/i, ''), n1 = normNo(x), n2 = normNo(c.f.so || ''), d1 = digits(x), d2 = digits(c.f.so || ''); return !!n2 && (n1 === n2 || (d2.length >= 6 && d1.includes(d2))); };

          if (c.f.mat_hang && !overlap(d.f.mat_hang, c.f.mat_hang)) add('hdmb_hang_' + d.id, 2, `Hàng hóa trên hóa đơn ${d.f.so} (“${d.f.mat_hang}”) khác HĐMB ${c.f.so} (“${c.f.mat_hang}”)`, 'Đối chiếu hàng hóa / dịch vụ trên hóa đơn với hợp đồng.', [d.id, c.id]);

      }
      // hàng hóa trên hóa đơn so với mục đích vay (đánh giá kỹ bằng 🤖 AI tra soát)
      const md = prof.muc_dich_pdgn || prof.muc_dich || '';
      if (md) for (const d of docs.filter((x) => (x.loai === 'hoa_don' || x.loai === 'invoice') && x.f.mat_hang)) if (!overlap(d.f.mat_hang, md)) add('md_' + d.id, 1, `Hàng hóa trên hóa đơn ${d.f.so} (“${d.f.mat_hang}”) không thấy trong mục đích vay`, `Mục đích: ${md}. Bấm 🤖 AI tra soát mục đích & HĐMB để đánh giá.`, [d.id]);
      for (const l of lines) {
        const c = hdmbOf(l);
        if (!c) { if (l.so_hdmb && types.has('hdmb')) add('hdmb_' + l.id, 2, `Chưa thấy HĐMB ${l.so_hdmb} của dòng HĐ ${l.so_hd}`, '', [l.id]); continue; }

        if (hl && (hl < gn || (ln && hl < ln))) add('hdhh_' + l.id, 3, `HĐMB ${c.f.so} hết hiệu lực ${dmy(hl)}`, '', [l.id, c.id]);
      }
      const hdOk = docs.filter((x) => x.loai === 'hdmb' && (!iso(x.f.hieu_luc_den) || iso(x.f.hieu_luc_den) >= gn));
      if (hdOk.length) add('hdmb_ok', 0, `${hdOk.length} HĐMB còn hiệu lực đến ngày giải ngân`);
    }
    // tiền điện / đề nghị thanh toán / UNC: tài khoản nhận tiền
    const memo = prof.tk || {};
    for (const d of docs.filter((x) => ['tien_dien', 'de_nghi_tt', 'unc'].includes(x.loai) && x.f.tk_nhan)) {
      const known = memo[BK.supKey(d.f.ben_ban)] || null;
      const unc = d.loai === 'unc' ? null : docs.find((u) => u.loai === 'unc' && u.f.tk_nhan && sameName(u.f.ben_ban, d.f.ben_ban));
      const ref = (ctx.tth || []).find((t) => sameName(t.ten, d.f.ben_ban)) || known || (unc ? { tk: unc.f.tk_nhan, nh: unc.f.ngan_hang, src: TYPES[unc.loai].l } : null);
      if (ref && ref.tk && digits(ref.tk) !== digits(d.f.tk_nhan)) add('tk_' + d.id, 3, `Số tài khoản nhận tiền ${d.f.ben_ban || ''} không khớp`, `${TYPES[d.loai].l} ${d.f.so || ''} ghi TK ${d.f.tk_nhan}${d.f.ngan_hang ? ' — ' + d.f.ngan_hang : ''}, ${ref.src ? ref.src + ' ghi' : 'hồ sơ đang dùng'} ${ref.tk}${ref.nh ? ' — ' + ref.nh : ''}.`, [d.id, ...(unc ? [unc.id] : [])]);
    }

    if (tks.length || nss.length) {
      const paid = new Map();
      for (const n of nss) for (const s of String(n.f.to_khai || '').split(/[,;\s]+/).filter((x) => digits(x).length >= 8)) paid.set(digits(s), (paid.get(digits(s)) || 0) + (num(n.f.tien) || 0) / Math.max(1, String(n.f.to_khai).split(/[,;\s]+/).filter((x) => digits(x).length >= 8).length));
      let ok = 0;
      for (const t of tks) {
        const k = digits(t.f.so);
        if (!nss.length) continue;
        if (!paid.has(k)) add('nsnn_' + t.id, 2, `Tờ khai ${t.f.so}: chưa thấy giấy nộp NSNN`, '', [t.id]);
        else ok++;
      }
      if (ok) add('nsnn_ok', 0, `${ok} tờ khai có giấy nộp NSNN tương ứng`);
      if (tks.length && !nss.length) add('nsnn_none', 2, 'Có tờ khai nhưng chưa có giấy nộp tiền NSNN', 'Nếu giải ngân nộp thuế nhập khẩu, cần giấy nộp NSNN / chứng từ thu của KBNN.');
    }

    const cics = docs.filter((x) => x.loai === 'cic').map((d) => ({ d, x: cicInfo(d, kh) }));
    if (!cics.length) { const cd0 = iso(prof.ngay_cic_cuoi); add('cic_none', 2, 'Chưa có CIC trong hồ sơ', cd0 ? `Lần tra gần nhất ${dmy(cd0)}.` : 'Thả file CIC vào hồ sơ, AI đọc mẫu báo cáo, đối tượng tra, ngày tra và nhóm nợ.'); }
    else {
      // mỗi đối tượng (KH vay, người đại diện, bên bảo lãnh…) xét CIC mới nhất của đối tượng đó
      const by = new Map(); for (const c of cics) (by.get(c.x.key) || by.set(c.x.key, []).get(c.x.key)).push(c);
      const multi = by.size > 1, okWho = []; let allOk = true;
      for (const [k, cs0] of by) {

        const same = cs.filter((c) => c.x.ngay === dt), nh = same.map((c) => c.x.nhom).filter((n) => n != null), nhom = nh.length ? Math.max(...nh) : null;
        const who = k === '_kh' ? 'KH vay' : last.x.ten, sfx = multi ? '_' + k : '', tag = multi ? ` — ${who}` : '', ids = same.map((c) => c.d.id);
        const age = dt ? BK.daysBetween(dt, gn) : null;

      const dup = new Map(); for (const c of cics) { const kk = `${c.x.mau}|${c.x.key}|${c.x.ngay}`; (dup.get(kk) || dup.set(kk, []).get(kk)).push(c); }

    if (lines.length) {

      if (thieu.length) add('theo_doi', hs.done ? 2 : 1, `Thiếu ${thieu.join(', ')} để theo dõi KUNN sau giải ngân`, 'Nhập ở ô trên cùng hồ sơ, hoặc soạn KUNN & PDGN — lưu / xuất Word là tool tự lấy từ văn bản.');

      if (kd != null && tgn > kd && !hs.done) add('cltf_vuot', 3, `Số tiền giải ngân ${fmtN(tgn)} vượt hạn mức khả dụng trên CLTF (${fmtN(kd)})`, '', [cl.id]);

    }

    if (ctx.hmHist && ctx.hmHist.length && !hv && lines.length) add('hm_chua_hl', 3, `Ngày giải ngân ${dmy(gn)} trước ngày hạn mức bắt đầu hiệu lực`, 'Kiểm tra lại ngày giải ngân hoặc ngày hiệu lực ở mục Hạn mức tín dụng (tab Thông tin).');

    else if (lines.length) add('hm_none', 2, 'Chưa đọc file Excel quản lý giải ngân của công ty', 'Vào tab Thông tin & mẫu Word → chọn file để tool lấy dư nợ, hạn mức.');
    const han = (hv && hv.den_ngay) || iso(prof.han_hm), hdtd = (hv && hv.ngay_hdtd) || iso(prof.ngay_hdtd);
    if (han && gn > han) add('hm_het', 3, `Ngày giải ngân sau ngày hết hạn duy trì hạn mức ${dmy(han)}${hv && hv.so_hdtd ? ` (HĐTD ${hv.so_hdtd})` : ''}`, 'Nếu đã được cấp lại / gia hạn hạn mức: thêm dòng hạn mức mới ở tab Thông tin.');
    else if (han && gn && BK.daysBetween(gn, han) <= 30 && lines.length) add('hm_sap_het', 2, `Hạn mức hết hạn duy trì ngày ${dmy(han)} — còn ${BK.daysBetween(gn, han)} ngày sau ngày GN`, 'Đáo hạn khoản vay có thể vượt thời hạn hạn mức — kiểm tra quy định.');
    // gói lãi suất / UBG
    const goiL = ctx.goi || [];
    if (goiL.length && lines.length) {
      const pk = hs.goi ? goiL.find((g) => fold(g.ma) === fold(hs.goi)) : null;
      if (hs.goi && !pk) add('goi_khong', 2, `Không thấy gói lãi suất “${hs.goi}” trong danh sách gói`, 'Chọn lại gói ở ô Gói lãi suất của hồ sơ.');
      else if (pk) {
        if (!goiActive({ ...pk, an: false }, gn)) add('goi_het', 3, `Gói ${pk.ma} không hiệu lực vào ngày GN ${dmy(gn)}${pk.den_ngay ? ` (hiệu lực đến ${dmy(pk.den_ngay)})` : ''}`, 'Chọn gói khác hoặc lãi suất thông thường.');
        if (pk.tong && !hs.done) { const used = goiUsed(pk, ctx.goiRows || [], { hsId: hs.id, kid: hs.kid, so: hs.so_kunn }); if (used + total > pk.tong + 0.5) add('goi_vuot', 3, `Vượt hạn mức gói ${pk.ma}: đã dùng ${fmtN(used)} / ${fmtN(pk.tong)}, lần này ${fmtN(total)}`); else add('goi_ok', 0, `Gói ${pk.ma}${pk.ls != null ? ` ${pk.ls}%` : ''}: còn ${fmtN(pk.tong - used - total)} đ sau lần này`); }
        const snv = num(hs.so_ngay_vay || prof.so_ngay_vay);
        if (pk.so_ngay_max && snv && snv > pk.so_ngay_max) add('goi_ky_han', 2, `Số ngày vay ${snv} vượt kỳ hạn tối đa của gói ${pk.ma} (${pk.so_ngay_max} ngày)`);
      } else if (goiAt(goiL, gn).length) add('goi_chon', 1, `Có ${goiAt(goiL, gn).length} gói lãi suất đang hiệu lực — chưa chọn gói cho hồ sơ`, 'Chọn ở ô Gói lãi suất (trên cùng hồ sơ) nếu khoản này áp dụng gói / UBG.');
    }
    if (hdtd && gn < hdtd) add('hdtd_truoc', 3, `Ngày giải ngân trước ngày ký HĐTD ${dmy(hdtd)}`);
    // 🤖 AI tra soát mục đích vay & phù hợp HĐMB (kết quả lưu trong hồ sơ)
    if (hs.aiMd && Array.isArray(hs.aiMd.issues)) {
      const stale = (hs.aiMd.sig || '') !== aiMdSig(hs);
      hs.aiMd.issues.forEach((x, i) => { const sev = x.muc_do === 'loi' ? 3 : x.muc_do === 'dat' ? 0 : 2; add('aimd_' + i, sev, `AI: ${x.van_de}`, [x.chi_tiet, x.so_chung_tu ? 'Chứng từ: ' + x.so_chung_tu : '', stale ? '(chứng từ đã đổi sau lần AI soát — bấm soát lại)' : ''].filter(Boolean).join(' · ')); });
    }
    // bỏ qua có lý do
    const ack = hs.ack || {};
    for (const c of out) if (c.sev > 0 && ack[c.key]) { c.ack = ack[c.key]; c.sev = 1; }
    return out.sort((a, b) => b.sev - a.sev);
  }
  // ── hạn mức tín dụng theo thời gian (HĐTD, phụ lục cấp lại / điều chỉnh) ──
  // hist: [{id, tu_ngay ISO (hiệu lực), den_ngay ISO (hết hạn duy trì), so_hdtd, ngay_hdtd ISO, hm_tong, hm_vay, hm_lc (đồng), ghi_chu}]
  function hmAt(hist, date) {
    const xs = (hist || []).filter((h) => !h.del).slice().sort((a, b) => (a.tu_ngay || '').localeCompare(b.tu_ngay || ''));
    let cur = null;
    for (const h of xs) if (!h.tu_ngay || !date || h.tu_ngay <= date) cur = h;
    return cur;
  }
  // ── gói lãi suất / UBG: từ sheet UBG của file Excel + gói nhập tay (ghi đè theo mã) ──
  // gói: {ma, ten, ls (%/năm), tu_ngay, den_ngay ISO, so_ngay_max, tong (hạn mức gói, đồng), so_pd, src: 'excel'|'tay', an}
  function goiMerge(ubg, manual) {
    const by = new Map();
    for (const u of ubg || []) by.set(fold(u.ma), { ma: u.ma, ten: u.ten || '', ls: u.ls ?? null, tu_ngay: u.ngay || '', den_ngay: u.hieu_luc || '', so_ngay_md: u.so_ngay ?? null, so_ngay_max: null, tong: u.tong ?? null, so_pd: u.so || '', ma_ls: u.ma_ls || '', src: 'excel' });
    for (const m of manual || []) { if (!m || !m.ma) continue; const k = fold(m.ma); by.set(k, { ...(by.get(k) || {}), ...m, src: by.has(k) && by.get(k).src === 'excel' ? 'excel+tay' : 'tay' }); }
    return [...by.values()];
  }
  const goiActive = (g, date) => !g.an && (!g.tu_ngay || !date || g.tu_ngay <= date) && (!g.den_ngay || !date || date <= g.den_ngay);
  function goiAt(list, date) { return (list || []).filter((g) => goiActive(g, date)); }
  /** Số tiền đã giải ngân theo gói: KUNN trong file Excel (cột Gói) + KUNN của tool không có trong file. */
  const soKey = (s) => String(s || '').split(')')[0].replace(/\s/g, '').toLowerCase();
  /** except: { hsId, kid, so } — bỏ chính hồ sơ / KUNN đang xét. */
  function goiUsed(g, rows, except) {
    const k = fold(g.ma), ex = except || {}, exSo = ex.so && !/chưa số/i.test(ex.so) ? soKey(ex.so) : '';
    return BK.sum((rows || []).filter((r) => r.goi && fold(r.goi) === k && !(ex.hsId && r.hsId === ex.hsId) && !(ex.kid && r.kid === ex.kid) && !(exSo && soKey(r.so) === exSo)).map((r) => r.goc || 0));
  }
  /** Chữ ký nội dung AI đã soát (chứng từ + dòng bảng kê) — đổi thì báo kết quả AI cũ. */
  const aiMdSig = (hs) => JSON.stringify([(hs.docs || []).filter((d) => !d.del).map((d) => [d.id, d.loai, d.f]), (hs.lines || []).map((l) => [l.id, l.ncc, l.so_hdmb, l.so_hd, l.ngay_hd, l.tien_hd, l.tien_gn, l.ghi_chu])]);
  // ── lãi suất thả nổi: lịch điều chỉnh của từng KUNN ──
  /** adj: [{tu_ngay ISO, ls}] → lãi suất áp dụng vào ngày date (chưa có điều chỉnh → lãi suất ban đầu). */
  function lsAt(base, adj, date) {
    let v = base ?? null;
    for (const a of (adj || []).filter((x) => x && x.tu_ngay && x.ls != null).slice().sort((x, y) => x.tu_ngay.localeCompare(y.tu_ngay))) if (!date || a.tu_ngay <= date) v = a.ls;
    return v;
  }
  /** Lãi suất mới khi điều chỉnh hàng loạt: mode 'set' = đặt bằng, 'add' = cộng / trừ điểm %. */
  const lsApply = (cur, mode, val) => (mode === 'add' ? (cur == null ? null : +(+cur + +val).toFixed(4)) : +(+val).toFixed(4));
  // ── nhắc hạn mức / gói lãi suất sắp hết hiệu lực, gói gần hết hạn mức ──
  function creditAlerts(c, rows, today) {
    const out = [], push = (sev, text, when) => out.push({ key: 'cr:' + fold(text).replace(/\d+/g, '#'), sev, cid: c.id, cname: c.name, text, when, go: { tab: 'info' } });
    const hist = (c.hmHist || []).filter((h) => !h.del), cur = hmAt(hist, today);
    const den = cur ? cur.den_ngay : iso((c.hs || {}).han_hm);
    if (den) { const d = BK.daysBetween(today, den); if (d < 0) push(3, `Hạn mức ${cur && cur.so_hdtd ? `(${cur.so_hdtd}) ` : ''}đã hết hạn duy trì ${dmy(den)}`, `quá ${-d} ngày`); else if (d <= 60) push(d <= 30 ? 2 : 1, `Hạn mức ${cur && cur.so_hdtd ? `(${cur.so_hdtd}) ` : ''}hết hạn duy trì ${dmy(den)} — chuẩn bị cấp lại / gia hạn`, `còn ${d} ngày`); }
    for (const h of hist) if (h.tu_ngay && h.tu_ngay > today && BK.daysBetween(today, h.tu_ngay) <= 30) push(1, `Hạn mức mới ${h.so_hdtd || ''} hiệu lực từ ${dmy(h.tu_ngay)}${h.hm_tong ? ` — ${fmtN(h.hm_tong / 1e6)} tr` : ''}`, `còn ${BK.daysBetween(today, h.tu_ngay)} ngày`);
    for (const g of goiMerge(c.ledger ? c.ledger.ubg : [], c.goiLs)) {
      if (g.an || !goiActive(g, today)) continue;
      if (g.den_ngay) { const d = BK.daysBetween(today, g.den_ngay); if (d <= 30) push(d <= 7 ? 2 : 1, `Gói ${g.ma} hết hiệu lực ${dmy(g.den_ngay)}`, `còn ${d} ngày`); }
      if (g.tong) { const used = goiUsed(g, rows); const pct = used / g.tong; if (pct >= 0.9) push(pct >= 1 ? 3 : 2, `Gói ${g.ma} ${pct >= 1 ? 'đã hết' : 'sắp hết'} hạn mức gói: đã dùng ${fmtN(used)} / ${fmtN(g.tong)}`, `${Math.round(pct * 100)}%`); }
    }
    return out;
  }
  const counts = (cs) => ({ err: cs.filter((c) => c.sev === 3).length, warn: cs.filter((c) => c.sev === 2).length, ok: cs.filter((c) => c.sev === 0).length, ack: cs.filter((c) => c.sev === 1).length });

  // ── file Excel QUẢN LÝ GIẢI NGÂN (sổ khế ước, danh mục, UBG) ──
  const DM = { TEN_KH: 'ten_kh', TEN_KH_NGAN: 'ten_kh_ngan', CIF: 'cif', GCN_DKKD: 'gcn', DIA_CHI_KH: 'dia_chi', NGUOI_DAI_DIEN: 'dai_dien', CHUC_DANH: 'chuc_danh', SO_HDTD: 'so_hdtd', NGAY_HDTD: 'ngay_hdtd', NGAY_HET_HAN_HM: 'han_hm', SO_PDTD: 'so_pdtd', NGAY_PDTD: 'ngay_pdtd', SO_NGAY_VAY_MD: 'so_ngay_vay', TEN_TTKD: 'ttkd', MA_TTKD: 'ma_ttkd', TEN_QLKH: 'qlkh', MA_QLKH: 'ma_qlkh', PROFIT_CENTER: 'profit', TK_GHI_CO: 'tk_ghi_co', TEN_TK_GHI_CO: 'ten_tk_ghi_co', LOAN_SUB_TYPE: 'loan_sub', MA_TT41: 'ma_tt41', MA_ANALYSIS: 'ma_an1', MA_INFOR: 'ma_inf1', LOAI_TIEN: 'loai_tien', PREFIX_KUNN: 'prefix_kunn', HAU_TO_KUNN: 'hau_to_kunn', BEN_BAO_LANH: 'ben_bao_lanh' };
  const LCOLS = [['so', /^so kunn/], ['hm', /^han muc/], ['ngay_gn', /^ngay gn|^ngay giai ngan/], ['dao_han', /^ngay dao han|^dao han/], ['so_ngay', /^so ngay/], ['ls', /^lai suat/], ['goi', /^goi/], ['goc', /^goc vay|^so tien giai ngan/], ['da_thu', /^da thu/], ['ngay_thu', /^ngay thu/], ['con_lai', /^goc con lai|^du no/], ['ben', /^ben thu huong/], ['ct', /^chung tu/], ['note', /^ghi chu/]];
  /** grids: {TEN_SHEET: mảng 2 chiều (raw)}. Trả { profile, kunns, ubg, hm, hmList, du_no } */
  function readLedger(grids, opts = {}) {
    const g = (n) => { const k = Object.keys(grids).find((x) => fold(x).replace(/\s/g, '_') === fold(n)); return k ? grids[k] : null; };
    const ku = g('khe_uoc');
    if (!ku) throw new Error('Không thấy sheet KHE_UOC — chọn đúng file QUẢN LÝ GIẢI NGÂN của công ty');
    const hi = ku.findIndex((r) => r.some((c) => /^so kunn$/.test(fold(c))));
    if (hi < 0) throw new Error('Sheet KHE_UOC không có cột “Số KUNN”');
    const col = {};
    ku[hi].forEach((c, i) => { const f = fold(c); const r = LCOLS.find(([k, re]) => col[k] == null && re.test(f)); if (r) col[r[0]] = i; });
    const kunns = [];
    for (const r of ku.slice(hi + 1)) {
      const so = r[col.so] == null ? '' : String(r[col.so]).trim();
      if (!so || /^tong/.test(fold(so))) continue;
      const goc = num(r[col.goc]) || 0, thu = numZ(r[col.da_thu]) || 0;
      const cl = col.con_lai != null ? numZ(r[col.con_lai]) : null;
      const k = { so, hm: String(r[col.hm] || '').trim(), ngay_gn: iso(r[col.ngay_gn]), dao_han: iso(r[col.dao_han]), so_ngay: num(r[col.so_ngay]), ls: num(r[col.ls]), goi: String(r[col.goi] || '').trim(), goc, da_thu: thu, ngay_thu: iso(r[col.ngay_thu]), con_lai: cl != null && (cl !== 0 || typeof r[col.con_lai] === 'string' || thu) ? Math.max(0, cl) : Math.max(0, goc - thu), ben: String(r[col.ben] || '').trim(), ct: String(r[col.ct] || '').trim(), note: String(r[col.note] || '').trim() };
      if (k.ls != null && k.ls < 1) k.ls = +(k.ls * 100).toFixed(4);
      kunns.push(applyThuNote(k));
    }
    const profile = {}, hmList = [];
    const dm = g('danh_muc');
    if (dm) for (const r of dm) {
      const code = String(r[3] || '').trim(), v = r[2];
      if (/^HM\d$/.test(code) && num(v)) hmList.push({ ma: `HMTD ${code.slice(2)}`, ten: String(r[1] || '').trim(), han_muc: num(v) });
      const k = DM[code]; if (!k || v == null || v === '') continue;
      profile[k] = /^ngay_|han_hm/.test(k) ? dmy(v) || String(v) : String(v).trim();
    }
    const ubg = [];
    const ub = g('ubg');
    if (ub) {
      const h = ub.findIndex((r) => r.some((c) => /^ma goi/.test(fold(c))));
      if (h >= 0) for (const r of ub.slice(h + 1)) {
        if (!r[1]) continue;
        const ls = num(r[6]);
        if (ls == null && !iso(r[3]) && !num(r[9])) continue;          // dòng ghi chú / hướng dẫn
        ubg.push({ ma: String(r[1]).trim(), so: String(r[2] || ''), ngay: iso(r[3]), hieu_luc: iso(r[4]), ten: String(r[5] || ''), ls: ls != null && ls < 1 ? +(ls * 100).toFixed(4) : ls, so_ngay: num(r[7]), ma_ls: String(r[8] || ''), tong: num(r[9]) });
      }
    }
    const today = opts.today || BK.todayISO();
    const live = kunns.filter((k) => k.con_lai > 0.5);
    const du_no = BK.sum(live.map((k) => k.con_lai));
    const hm = BK.sum(hmList.map((x) => x.han_muc)) || null;
    hmList.forEach((h) => { h.du_no = BK.sum(live.filter((k) => fold(k.hm) === fold(h.ma)).map((k) => k.con_lai)); });
    return { profile, kunns, ubg, hm, hmList, du_no, n_live: live.length, at: Date.now(), today };
  }
  /** Dư nợ trước một lần giải ngân (bỏ chính KUNN đó nếu sổ đã ghi, so phần trước dấu ")"). */
  function duNoTruoc(L, soKunn) {
    if (!L) return null;
    const key = (s) => String(s || '').split(')')[0].replace(/\s/g, '');
    const k = key(soKunn);
    return BK.sum(L.kunns.filter((x) => x.con_lai > 0.5 && (!k || key(x.so) !== k)).map((x) => x.con_lai));
  }

  // ── việc cần làm (mỗi việc thuộc một công ty, không cộng số liệu giữa các công ty) ──
  /** input: [{c, hoso:[{hs, checks}], kunns, ledger, hanNgay}] → [{sev, cid, cname, text, when, go}] */
  function tasks(rows, today = BK.todayISO()) {
    const out = [];
    for (const { c, hoso = [], kunns = [], ledger, hanNgay = 30, due } of rows) {
      const doneHs = new Set(hoso.filter((x) => x.hs.done).map((x) => x.hs.id));
      const hsBs = new Set(hoso.filter((x) => (x.hs.bo_sung || []).length || x.hs.bs_none).map((x) => x.hs.id));
      const pending = (k) => !!(k.hsId && !k.giai_ngan && !k.manual && !k.old && !doneHs.has(k.hsId));
      const T = (key, sev, text, when, go) => out.push({ key, sev, cid: c.id, cname: c.name, text, when, go });
      for (const { hs, checks: cs } of hoso) {
        // chứng từ bổ sung bản gốc: nhắc cả khi hồ sơ đã giải ngân (hạn lưu dạng dd/mm/yyyy → đổi ISO trước khi so)
        for (const b of hs.bo_sung || []) {
          const han = iso(b.han); if (b.xong || !han) continue;
          const d = BK.daysBetween(today, han);
          if (d <= 7) T(`bs:${hs.id}:${b.ten}`, d < 0 ? 3 : 2, `Bổ sung ${b.ten} — KUNN ${hs.so_kunn || ''}`, d < 0 ? `quá hạn ${-d} ngày` : `hạn ${dmy(han)}`, { hs: hs.id });
        }
        if (hs.done) continue;
        const n = counts(cs || []);
        const label = `Hồ sơ GN ${hs.ngay_gn ? dmy(hs.ngay_gn).slice(0, 5) : 'mới'}`;
        if (n.err) T(`err:${hs.id}`, 3, `${label}: ${(cs.find((x) => x.sev === 3) || {}).title}${n.err > 1 ? ` (+${n.err - 1} lỗi)` : ''}`, hs.ngay_gn ? `GN ${dmy(hs.ngay_gn)}` : '', { hs: hs.id });
        const st = stageOf(hs, n.err);
        const ms = hs.ms || {};
        const prev = Object.values(ms).filter((x) => x && x !== 'skip').sort().pop();
        if (!n.err && st.k !== 'xong') {
          const wait = prev ? BK.daysBetween(prev, today) : null;
          T(`stage:${hs.id}:${st.k}`, wait >= 2 ? 2 : 1, `${label}: ${st.l}${wait >= 2 ? ` — chờ ${wait} ngày` : ''}`, hs.ngay_gn ? `GN ${dmy(hs.ngay_gn)}` : '', { hs: hs.id });
        }
      }
      for (const k of kunns) {
        if (pending(k) || (k.hsId && hsBs.has(k.hsId))) continue;   // chưa giải ngân / hồ sơ đã có danh sách bổ sung riêng (nhắc ở trên)
        const s = BK.kunnSummary(k, { hanNgay, today });
        if (s.quaHan) T(`goc:${k.id}`, 3, `KUNN ${k.so_kunn} quá hạn hồ sơ gốc ${s.quaHan} ngày`, 'quá hạn', { kunn: k.id });
        else if (!s.done && s.han && BK.daysBetween(today, s.han) <= 5) T(`goc:${k.id}`, 2, `KUNN ${k.so_kunn} sắp hết hạn hồ sơ gốc`, `hạn ${dmy(s.han)}`, { kunn: k.id });
      }
      { const have = new Set((ledger ? ledger.kunns : []).map((x) => soKey(x.so))); const tk = new Map(kunns.map((k) => [soKey(k.so_kunn), k])); const rows = (ledger ? ledger.kunns.map((x) => ({ so: x.so, goi: x.goi || (tk.get(soKey(x.so)) || {}).goi || '', goc: x.goc })) : []).concat(kunns.filter((k) => !have.has(soKey(k.so_kunn))).map((k) => ({ so: k.so_kunn, goi: k.goi, goc: k.manual ? k.so_tien || 0 : BK.sum((k.lines || []).map((l) => l.tien_gn)) })));
        out.push(...creditAlerts({ ...c, ledger }, rows, today)); }
      // đáo hạn: theo danh sách `due` (bảng theo dõi đã áp ghi chú, gồm KUNN chỉ có trong tool) — không có thì theo sổ Excel thô
      for (const k of due || (ledger ? ledger.kunns.map((x) => ({ ...x, x: true })) : [])) {
        if (!(k.con_lai > 0.5) || !k.dao_han) continue;
        const d = BK.daysBetween(today, k.dao_han);
        if (d >= 0 && d <= 15) T(`dh:${soKey(k.so)}`, d <= 5 ? 2 : 1, `KUNN ${k.so} đáo hạn ${dmy(k.dao_han)} — ${fmtN(k.con_lai)} đ`, `còn ${d} ngày`, { tab: 'kunn', so: k.so });
        else if (d < 0) T(`qh:${soKey(k.so)}`, 3, `KUNN ${k.so} quá hạn trả nợ ${-d} ngày${k.x ? ' (theo sổ Excel)' : ''}`, 'quá hạn', { tab: 'kunn', so: k.so });
      }
    }
    return out.sort((a, b) => b.sev - a.sev);
  }

  /** Tên file trong gói tải lên hệ thống: 01_KUNN…, theo thứ tự loại chứng từ. */
  function packageNames(hs, files, order) {
    const ord = order || Object.fromEntries(Object.entries(TYPES).map(([k, t]) => [k, t.ord]));
    const byFile = new Map();
    const fname = (id) => ((files || []).find((f) => f.id === id) || {}).name || '';
    for (const d of hs.docs || []) if (!d.del) { const o = ord[d.loai] || 10; let so = d.f.so || d.f.mau; if (d.loai === 'cic') { const x = cicInfo(d, {}, fname(d.fileId)); so = [x.mau, x.ten && fold(x.ten).toUpperCase().replace(/^(CONG TY|CTY)\s+(TNHH|CO PHAN|CP)?\s*/, '').replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 24)].filter(Boolean).join('_'); } if (!byFile.has(d.fileId) || byFile.get(d.fileId).o > o) byFile.set(d.fileId, { o, loai: d.loai, so }); }
    const used = {};
    const own = hs.pkgNames || {};
    return files.filter((f) => !(hs.skipUp || {})[f.id]).map((f) => {
      const t = byFile.get(f.id) || { o: f.name && /\.xlsx?$/i.test(f.name) ? 3 : 10, loai: f.name && /\.xlsx?$/i.test(f.name) ? 'bang_ke' : 'khac', so: '' };

        try { env = JSON.parse(await f.text()); } catch (e) { continue; }   // tệp đang được máy khác ghi dở → lần sau đọc lại
        if (!env || env.app !== 'bangke-gn') continue;
        this.seen.set(name, { sig, by: env.by });
        people[env.by || '?'] = (people[env.by || '?'] || 0) + 1;
        if (env.type === 'kh') kh.push(env.data);
        else if (env.type === 'ku') ku.push(env.data);
        else if (env.type === 'hs') hs.push(env.data);
        else if (env.type === 'cfg' && env.data && (!S.cfg || (env.data.at || 0) > (S.cfg.at || 0))) { S.cfg = env.data; await this.store.setMeta('cfg', env.data); changed++; }
        else if (env.type === 'nk' && env.dev !== DEVICE) for (const x of env.data || []) { const before = this.store.log.length; await this.store.addLog(x, true); if (this.store.log.length > before) nLog++; }
      }
      const a = await this.store.applyRemote('kh', kh), b = await this.store.applyRemote('ku', ku), c = await this.store.applyRemote('hs', hs);
      changed += a + b + c;
      if (a || changed > a + b + c) this.store.emit('c');
      if (b) this.store.emit('k');
      if (c) this.store.emit('h');
      this.busy = ''; this.people = people; this.nFiles = n; this.last = Date.now(); this.emit('state');
      if (changed || nLog) this.emit('pulled', { changed, nLog });
    } catch (e) { console.error(e); this._set(/NotAllowed|permission/i.test(e.name + e.message) ? 'reconnect' : 'error', e.message); }
    finally { this._pulling = false; if (this.busy) this._busy(''); }
    return changed;
  }
}

  el.querySelectorAll('input[type=date]:not([min])').forEach((n) => { n.min = '1990-01-01'; n.max = '2099-12-31'; });

/** Nạp hàng loạt bảng kê cũ: mỗi file / sheet tự nhận KUNN + hóa đơn; bỏ qua KUNN đã có trong sổ. */
async function bulkImport(cid, files) {
  if (!files.length) return;
  const have = new Set(S.store.kunnsOf(cid).map((k) => BK.normKunn(k.so_kunn)));
  const docs = [], bad = [], dup = [];
  toast(`Đang đọc ${files.length} file…`);
  for (const f of files) {
    try {
      const grids = await readWorkbook(f); let got = 0;
      for (const [n, g] of Object.entries(grids)) {
        const r = BK.autoParseSheet(g); if (!r.ok) continue;
        for (const gr of r.groups) {
          if (!gr.lines.length) continue;
          if (!gr.so_kunn) { bad.push(`${f.name} · ${n}: có ${gr.lines.length} dòng nhưng không thấy số KUNN`); continue; }
          const key = BK.normKunn(gr.so_kunn);
          if (have.has(key)) { dup.push(gr.so_kunn); continue; }
          have.add(key); got++;
          docs.push({ id: BK.uid(), customerId: cid, so_kunn: String(gr.so_kunn), ngay_gn: gr.ngay_gn || '', ngay_dh: gr.ngay_dh || '', so_tien: gr.so_tien ?? null, han_bs: '', ghi_chu: '', source: f.name, hdr: gr.hdr || '', lines: gr.lines.map((l) => ({ ...BK.cleanLine(l), goc: 'da_nhan' })), old: true, createdAt: Date.now(), createdBy: userName(), ...meta() });
        }
      }
      if (!got && !bad.some((b) => b.startsWith(f.name))) bad.push(`${f.name}: không nhận ra bảng kê (hoặc mọi KUNN đã có)`);
    } catch (e) { bad.push(`${f.name}: ${errMsg(e)}`); }
  }
  if (docs.length) { await S.store.group(`Nạp ${docs.length} KUNN cũ (${files.length} file)`, () => S.store.putKunns(docs)); log(cid, 'nap_hang_loat', `Nạp hàng loạt ${docs.length} KUNN từ ${files.length} file`); }
  modal(`<div class="mh"><h2>Thêm file bảng kê cũ</h2><button class="x" data-close aria-label="Đóng">&times;</button></div><div class="mb">
    <p><b>Đã thêm ${docs.length} KUNN</b> (${BK.sum(docs.map((k) => k.lines.length))} hóa đơn)${dup.length ? ` · bỏ qua ${dup.length} KUNN đã có trong sổ` : ''}.</p>
    ${docs.length ? `<div class="hist">${docs.map((k) => esc(k.so_kunn)).join(', ')}</div>` : ''}
    ${bad.length ? `<div class="note warn" style="margin-top:10px"><b>Chưa đọc được:</b><ul>${bad.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>File trình bày lạ: mở riêng từng file bằng nút “⬆ Nạp bảng kê mới cho KH này” để chọn cột.</div>` : ''}

}

    ${tile('Hồ sơ gốc đã nhận đủ', pf.pctDone + '%', `${pf.goc.done}/${pf.n} KUNN`, { meter: pf.pctDone, tone: pf.pctDone === 100 ? 'good' : '', act: A({ act: 'kl', goc: 'pending' }) })}

// ═════════════════ GHI VÀO FILE BẢNG KÊ TỔNG HỢP CÓ SẴN ═════════════════
// Mở file Excel bảng kê tổng hợp đang theo dõi → tìm sheet & cột như lúc nạp → thêm các KUNN chưa có vào cuối bảng
// (giữ nguyên các sheet, cột, dòng cũ; định dạng dòng mới chép theo dòng cuối) → tải file đã cập nhật về.
function appendToMaster(groups, label) {
  if (!groups.length) return toast('Chưa có KUNN nào để ghi');
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xls,.xlsx,.xlsm';
  inp.onchange = () => { if (inp.files[0]) appendToMasterFile(inp.files[0], groups, label).catch((e) => toast('Không ghi được: ' + errMsg(e), 'err', 9000)); };
  inp.click();
}
async function appendToMasterFile(file, groups, label) {
  const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellStyles: true, cellNF: true });
  const sheets = {};
  for (const n of wb.SheetNames) { const ws = wb.Sheets[n]; if (ws && ws['!ref']) sheets[n] = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }); }
  const pick = BK.pickSheet(sheets);
  if (!pick || !pick.header.ok) throw new Error('không nhận ra bảng kê trong file (cần các cột số hóa đơn, số tiền)');
  const name = pick.name, g = sheets[name], h = pick.header, map = h.map;
  if (map.so_kunn == null) throw new Error(`sheet “${name}” không có cột Số KUNN — đây không phải bảng kê tổng hợp nhiều KUNN`);
  const hdr = h.twoRow ? h.row + 1 : h.row;
  const have = new Set();
  let last = hdr, totalRow = -1;
  const isTot = (row) => row.slice(0, 4).some((v) => /^(tong|cong)\b/.test(BK.fold(String(v ?? ''))));
  for (let r = hdr + 1; r < g.length; r++) {
    const row = g[r] || [];
    if (isTot(row)) { if (totalRow < 0) totalRow = r; continue; }
    const hasTxt = ['so_kunn', 'so_hd', 'ncc'].some((f) => map[f] != null && String(row[map[f]] ?? '').trim() !== '');
    if (hasTxt) { last = r; totalRow = -1; }
    const k = BK.normKunn(row[map.so_kunn]); if (k) have.add(k);
  }
  const add = groups.filter((x) => !have.has(BK.normKunn(x.so_kunn)));
  const skip = groups.length - add.length;
  const nLines = BK.sum(add.map((x) => x.lines.length));
  const cols = BK.FIELDS.filter((f) => map[f.k] != null);
  const m = modal(`<div class="mh"><h2>Ghi vào file bảng kê có sẵn</h2><button class="x" data-close>&times;</button></div><div class="mb">
    <div class="grid2"><div><div class="hist">File</div><b>${esc(file.name)}</b></div><div><div class="hist">Sheet bảng kê</div><b>${esc(name)}</b> · tiêu đề hàng ${h.row + 1} · dữ liệu đến hàng ${last + 1}</div></div>
    <div class="sec">Cột nhận ra trong file</div><div class="chips">${cols.map((f) => `<span class="pill p-info">${BK.colName(map[f.k])} · ${f.label}</span>`).join('')}</div>
    ${add.length ? `<div class="note ok">Sẽ thêm <b>${add.length} KUNN · ${nLines} dòng</b> từ hàng ${last + 2}: ${add.slice(0, 12).map((x) => esc(x.so_kunn)).join(', ')}${add.length > 12 ? '…' : ''}</div>` : '<div class="note">File đã có đủ các KUNN này — không có gì để thêm.</div>'}
    ${skip ? `<div class="note warn">Bỏ qua ${skip} KUNN đã có sẵn trong file (không ghi trùng).</div>` : ''}
    <div class="hist">Các sheet, dòng cũ giữ nguyên. File cập nhật được tải về dạng .xlsx (tên thêm “_capnhat”); file gốc trên máy không bị sửa.</div></div>
    <div class="mf"><button class="btn" data-close>Hủy</button><button class="btn pri" id="mGo" ${add.length ? '' : 'disabled'}>⬇ Ghi & tải file</button></div>`, 'sm');
  $('#mGo', m).onclick = () => {
    const ws = wb.Sheets[name];
    const rng = XLSX.utils.decode_range(ws['!ref']);
    if (totalRow > last) {                                 // dời khối từ dòng TỔNG xuống dưới để chèn dòng mới vào giữa
      const delta = (last + 1 + nLines) - totalRow;
      if (delta > 0) {
        for (let r = rng.e.r; r >= totalRow; r--) for (let c = rng.s.c; c <= rng.e.c; c++) { const a = XLSX.utils.encode_cell({ r, c }), b = XLSX.utils.encode_cell({ r: r + delta, c }); if (ws[a]) { ws[b] = ws[a]; if (ws[b].f) ws[b].f = ws[b].f.replace(/([A-Z]+)(\d+)/g, (m0, col, rw) => (+rw >= totalRow + 1 ? col + (+rw + delta) : m0)); delete ws[a]; } else delete ws[b]; }
        rng.e.r += delta;
        if (ws['!merges']) ws['!merges'].forEach((mg) => { if (mg.s.r >= totalRow) { mg.s.r += delta; mg.e.r += delta; } });
        if (ws['!rows']) for (let r = rng.e.r; r >= totalRow; r--) ws['!rows'][r + delta] = ws['!rows'][r];
      }
    }
    const styleOf = (c) => { const cell = ws[XLSX.utils.encode_cell({ r: last, c })]; return cell && cell.s ? JSON.parse(JSON.stringify(cell.s)) : undefined; };
    const put = (r, f, v, kind) => {
      const c = map[f]; if (c == null || v == null || v === '') return;
      const addr = XLSX.utils.encode_cell({ r, c }), s = styleOf(c);
      let cell;
      if (kind === 'date') { const d = Date.parse(v + 'T00:00:00Z'); if (isNaN(d)) return; cell = { t: 'n', v: d / 86400000 + 25569, z: 'dd/mm/yyyy' }; }
      else if (typeof v === 'number') cell = { t: 'n', v, z: Number.isInteger(v) ? '#,##0' : '#,##0.00' };
      else cell = { t: 's', v: String(v) };
      if (s) { cell.s = s; if (cell.z) cell.s.numFmt = cell.z; }
      ws[addr] = cell;
      if (c > rng.e.c) rng.e.c = c;
    };
    let r = last + 1;
    for (const x of add) {
      x.lines.forEach((l, i) => {
        if (i === 0) { put(r, 'so_kunn', x.so_kunn); put(r, 'ngay_gn', x.ngay_gn, 'date'); put(r, 'ngay_dh', x.ngay_dh, 'date'); put(r, 'so_tien_kunn', x.so_tien ?? BK.sum(x.lines.map((y) => y.tien_gn))); }
        put(r, 'stt', i + 1); put(r, 'ncc', l.ncc); put(r, 'mst_ncc', l.mst_ncc); put(r, 'so_hdmb', l.so_hdmb); put(r, 'ky_hieu', l.ky_hieu);
        put(r, 'so_hd', l.so_hd); put(r, 'ngay_hd', l.ngay_hd, 'date'); put(r, 'tien_hd', l.tien_hd); put(r, 'tien_gn', l.tien_gn); put(r, 'loai_tien', l.loai_tien);
        put(r, 'ho_so', l.goc === 'da_nhan' ? 'ok' : l.thieu || (l.goc === 'chua' ? 'chưa nhận' : ''));
        put(r, 'ghi_chu', l.ghi_chu);
        r++;
      });
    }
    rng.e.r = Math.max(rng.e.r, r - 1);
    ws['!ref'] = XLSX.utils.encode_range(rng);
    if (ws['!autofilter']) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: h.row, c: rng.s.c }, e: rng.e }) };
    download(wb, file.name.replace(/\.[^.]+$/, '') + `_capnhat_${BK.todayISO()}.xlsx`);
    m.remove();
    toast(`Đã thêm ${add.length} KUNN (${nLines} dòng) vào ${file.name}`, 'ok');
    if (S.cid) log(S.cid, 'ghi_file', `Ghi ${add.length} KUNN vào file ${file.name} (${label || ''})`);
  };
}

  const kq = $('#kq', body);

  $('#kfg', body).onchange = (e) => { S.fGoc = e.target.value; renderKunnTab(body, an); };

  bindKunnEvents(body, an);
}

  ${open ? `<div class="kbody"><div class="bar">

      <button class="btn sm pri" data-hs="${k.id}" title="Soạn Đơn đề nghị GN kiêm KUNN và Phê duyệt kiêm đề nghị GN từ mẫu Word của KH">📝 Soạn KUNN & PDGN</button><button class="btn sm danger" data-delk="${k.id}">Xóa KUNN</button></div>
    <div class="tw" style="max-height:60vh"><table class="t"><thead><tr><th><input type="checkbox" data-selall="${k.id}"></th><th>STT</th><th>Nhà cung cấp</th><th>HĐMB/ĐĐH</th><th>Số HĐ</th><th>Ngày HĐ</th><th class="right">Tiền HĐ</th><th class="right">Giải ngân</th><th class="right">Lũy kế GN HĐ</th><th class="right">Còn lại</th><th>Kiểm tra</th><th>Hồ sơ gốc</th><th>Chứng từ thiếu</th><th>Ghi chú</th></tr></thead><tbody>
    ${lines.map((l, i) => { const li = an.lineInfo.get(l.id || `${k.id}#${i}`) || {}; const sev = (BK.CHECK[li.status] || {}).sev || 0;
      return `<tr class="${sev >= 3 ? 'bad' : sev === 2 ? 'warn' : ''}"><td><input type="checkbox" data-sel="${l.id}"></td><td>${esc(l.stt)}</td><td>${esc(l.ncc)}${l.mst_ncc ? `<div class="hist">MST ${esc(l.mst_ncc)}</div>` : ''}</td><td>${esc(l.so_hdmb)}</td>

function historyHtml(li, an, lineId) {
  if (!li || !li.key) return '';
  const iv = an.invoices.find((x) => x.key === li.key);
  if (!iv || iv.uses.length < 2) return '';
  const others = iv.uses.filter((u) => u.lineId !== lineId);
  return `<div class="hist">Cũng GN ở: ${others.map((u) => `${esc(u.so_kunn)} (${dd(u.ngay_gn)}): ${money(u.tien_gn)}`).join('; ')}</div>`;
}
function bindKunnEvents(body, an) {
  body.onclick = async (e) => {
    const t = e.target;
    const tg = t.closest('[data-toggle]');
    if (tg && !t.closest('input,select,button')) { const id = tg.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderKunnTab(body, an); return; }
    if (t.dataset.allgoc) { const k = S.kunns.find((x) => x.id === t.dataset.allgoc); await setGoc(k, k.lines.map((l) => l.id), 'da_nhan'); return; }
    if (t.dataset.selgoc) {
      const k = S.kunns.find((x) => x.id === t.dataset.selgoc);
      const ids = $$(`[data-k="${k.id}"] [data-sel]:checked`, body).map((c) => c.dataset.sel);
      if (!ids.length) return toast('Chưa chọn dòng nào (tick ô đầu dòng)');
      await setGoc(k, ids, t.dataset.v); return;
    }
    if (t.dataset.editl) { const [kid, lid] = t.dataset.editl.split('|'); return editLine(kid, lid); }
    if (t.dataset.hs) return openHoSo(S.cid, t.dataset.hs).catch((er) => toast(errMsg(er), 'err'));
    if (t.dataset.selall) { $$(`[data-k="${t.dataset.selall}"] [data-sel]`, body).forEach((c) => { c.checked = t.checked; }); return; }
    if (t.dataset.delk) {
      const k = S.kunns.find((x) => x.id === t.dataset.delk);
      if (!confirm(`Xóa KUNN ${k.so_kunn} (${k.lines.length} dòng)? Lịch sử giải ngân các hóa đơn trong KUNN này sẽ mất.`)) return;
      try { await S.store.delKunn(k.id, S.cid); log(S.cid, 'xoa_kunn', `Xóa KUNN ${k.so_kunn} (${k.lines.length} dòng, ${money(BK.sum(k.lines.map((l) => l.tien_gn)))})`); refreshSummary(); } catch (er) { toast(errMsg(er), 'err'); }
    }
  };
  body.onchange = async (e) => {
    const t = e.target;
    if (t.dataset.goc) { const [kid, lid] = t.dataset.goc.split('|'); await setGoc(S.kunns.find((x) => x.id === kid), [lid], t.value); }
    else if (t.dataset.thieu != null) { const [kid, lid] = t.dataset.thieu.split('|'); const p = { id: lid, thieu: t.value.trim() }; if (p.thieu) p.goc = 'thieu'; await patch(kid, [p], `sửa chứng từ thiếu: ${p.thieu || '(trống)'}`); }
    else if (t.dataset.note != null) { const [kid, lid] = t.dataset.note.split('|'); await patch(kid, [{ id: lid, ghi_chu: t.value.trim() }], 'sửa ghi chú dòng'); }
    else if (t.dataset.han != null) { await updKunn(t.dataset.han, { han_bs: t.value }, `đặt hạn bổ sung ${dd(t.value) || '(bỏ)'}`); }
    else if (t.dataset.knote != null) { await updKunn(t.dataset.knote, { ghi_chu: t.value.trim() }, 'sửa ghi chú KUNN'); }
  };
}

function promptAudit(hdr, items) {
  return `Bạn là chuyên viên kiểm soát giải ngân của ngân hàng Việt Nam, rà soát "bảng kê chứng từ/hóa đơn giải ngân vốn vay" do khách hàng gửi.
Công cụ đã đọc file Excel theo hàng tiêu đề, nhưng có thể đọc SAI vì dòng bị ghi lệch cột, lệch dòng (số liệu dòng này nằm ở dòng trên/dưới),
số tờ khai hải quan (10–12 chữ số) bị hiểu là số tiền, số tiền ngoại tệ (có phần lẻ) bị hiểu là số hóa đơn, v.v.

Tiêu đề cột của file: ${hdr || '(không rõ)'}

Với MỖI dòng dưới đây bạn có: nội dung gốc từng ô (RAW, kèm hàng trên/dưới để phát hiện lệch dòng), cách công cụ đang hiểu (DOC) và vấn đề luật phát hiện (LOI).
Hãy xác định giá trị ĐÚNG của dòng:
- so_hd: số hóa đơn / số invoice / số tờ khai (nếu chứng từ là tờ khai thuế), KHÔNG phải số tiền;
- ky_hieu: ký hiệu HĐ hoặc nội dung phân biệt (vd "NK", "GTGT NK") nếu có;
- ngay_hd: ngày hóa đơn YYYY-MM-DD (số 5 chữ số 36000–60000 là ngày dạng số của Excel, 45453 = 2024-06-10);
- tien_hd: trị giá hóa đơn; tien_gn: số tiền đề nghị giải ngân cho dòng đó; loai_tien: "VND" hoặc "USD"/"EUR"… (số có phần lẻ thường là ngoại tệ);
- ncc: nhà cung cấp.
Nếu cách hiểu hiện tại đã đúng (vấn đề chỉ là đặc thù hợp lệ, vd hóa đơn xuất sau ngày giải ngân theo hợp đồng) thì ok=true và giải thích.
Không bịa số: chỉ dùng số có trong RAW. Không chắc thì để null và tin_cay thấp.
Trả JSON: {"items":[{"id":"…","ok":false,"so_hd":"…","ky_hieu":"…","ngay_hd":"YYYY-MM-DD","tien_hd":0,"tien_gn":0,"loai_tien":"USD","ncc":"…","ly_do":"giải thích ngắn tiếng Việt","tin_cay":0.0-1.0}]}

${items.map((x) => `### id=${x.id}
RAW hàng trên: ${x.prev || '—'}
RAW dòng này: ${x.l.raw || '(không lưu dữ liệu gốc)'}
RAW hàng dưới: ${x.next || '—'}
DOC: ncc=${x.l.ncc || ''}; so_hd=${x.l.so_hd || ''}; ky_hieu=${x.l.ky_hieu || ''}; ngay_hd=${x.l.ngay_hd || ''}; tien_hd=${x.l.tien_hd ?? ''}; tien_gn=${x.l.tien_gn ?? ''}; loai_tien=${x.l.loai_tien || 'VND'}; KUNN ${x.k.so_kunn} GN ${x.k.ngay_gn || '?'}
LOI: ${x.issues.map((i) => i.text).join('; ')}`).join('\n\n')}`;
}
const AU_FIELDS = [['so_hd', 'Số HĐ'], ['ky_hieu', 'Ký hiệu'], ['ngay_hd', 'Ngày HĐ'], ['tien_hd', 'Tiền HĐ'], ['tien_gn', 'Giải ngân'], ['loai_tien', 'Loại tiền'], ['ncc', 'NCC']];
function auFmt(f, v, cur) { if (v == null || v === '') return '—'; if (f === 'ngay_hd') return dd(v) || v; if (f === 'tien_hd' || f === 'tien_gn') return money(v, cur); return String(v); }
/** Đề xuất AI → thay đổi thật (chỉ các trường khác giá trị hiện tại). */
function auChanges(l, s) {
  const ch = {};
  if (!s || s.ok) return ch;
  for (const [f] of AU_FIELDS) {
    let v = s[f];
    if (v == null || v === '') continue;
    if (f === 'tien_hd' || f === 'tien_gn') { v = BK.parseAmount(v); if (v == null) continue; }
    if (f === 'ngay_hd') { v = BK.toISO(v); if (!v) continue; }
    if (f === 'loai_tien') { v = String(v).toUpperCase(); if (/^VN/.test(v)) v = ''; }
    if (f === 'so_hd' || f === 'ky_hieu' || f === 'ncc') v = String(v).trim();
    if (String(v) !== String(l[f] ?? '')) ch[f] = v;
  }
  return ch;
}

/**
 * Mở bảng rà soát. src = { title, kunns: [{k, key}], hdrOf(k), apply(list) } — list: [{k, l, patch}]
 * (k = KUNN dạng {so_kunn, ngay_gn, so_tien, lines}, l = dòng; patch = trường cần đổi, {} + ack để xác nhận đúng).
 */
function openAudit(src) {
  const rows = [];
  for (const k of src.kunns) {
    const iss = BK.auditKunn(k);
    const byLine = new Map();
    for (const x of iss) {
      if (x.idx < 0) { rows.push({ k, l: null, idx: -1, issues: [x], id: `${k._key}|KUNN` }); continue; }
      if (!byLine.has(x.idx)) byLine.set(x.idx, []);
      byLine.get(x.idx).push(x);
    }
    for (const [idx, list] of byLine) rows.push({ k, l: k.lines[idx], idx, issues: list, id: `${k._key}|${idx}`, prev: (k.lines[idx - 1] || {}).raw, next: (k.lines[idx + 1] || {}).raw });
  }
  const nLines = BK.sum(src.kunns.map((k) => k.lines.length));
  const st = { flt: '', sug: new Map(), dec: new Map(), busy: false };
  const m = modal(`<div class="mh"><h2>🤖 Rà soát bảng kê — ${esc(src.title)}</h2><button class="x" data-close>&times;</button></div><div class="mb" id="auB"></div>
    <div class="mf"><span id="auF" class="hist" style="flex:1"></span><button class="btn" id="auX">⬇ Xuất Excel danh sách</button><button class="btn" id="auAI">✨ AI đề xuất cách sửa</button><button class="btn pri" id="auGo" disabled>Áp dụng</button></div>`);
  const lineRows = () => rows.filter((r) => r.l);
  const draw = () => {
    const types = Object.keys(BK.AUDIT).map((t) => [t, rows.filter((r) => r.issues.some((i) => i.type === t)).length]).filter(([, n]) => n);
    const vis = rows.filter((r) => !st.flt || r.issues.some((i) => i.type === st.flt));
    const nSev3 = rows.filter((r) => r.issues.some((i) => i.sev >= 3)).length;
    $('#auB', m).innerHTML = `
      ${rows.length ? `<div class="verdict ${nSev3 ? 'err' : 'warn'}"><div><b>${nSev3 ? '✗' : '⚠'} ${rows.length} dòng cần xem trên tổng ${nLines} dòng · ${src.kunns.length} KUNN</b><span>Bấm <b>✨ AI đề xuất cách sửa</b> để Gemini đọc lại dữ liệu gốc từng ô (kèm hàng trên/dưới để bắt lệch dòng) và đề xuất giá trị đúng. Tick dòng muốn sửa rồi bấm <b>Áp dụng</b>.</span></div></div>`
        : `<div class="verdict ok"><div><b>✓ Không thấy dòng nào lệch cột hay sai logic</b><span>Đã rà ${nLines} dòng · ${src.kunns.length} KUNN.</span></div></div>`}
      ${st.sug.size ? decBar(decCount([...st.sug.keys()], st.dec), '<button class="btn sm" data-decai>✓ Duyệt các đề xuất AI ≥75%</button>') : ''}
      ${rows.length ? `<div class="au-sum"><button data-af="" class="${st.flt ? '' : 'on'}">Tất cả<b>${rows.length}</b></button>${types.map(([t, n]) => `<button data-af="${t}" class="${st.flt === t ? 'on' : ''}">${BK.AUDIT[t].label}<b>${n}</b></button>`).join('')}</div>
      ${st.flt && st.flt !== 'tong_lech' && st.flt !== 'lech_cot' ? `<div class="bar"><span class="hist">Nếu nhóm “${BK.AUDIT[st.flt].label}” là hợp lệ theo hồ sơ (vd hóa đơn bổ sung sau giải ngân):</span><button class="btn sm" id="auAck">✓ Xác nhận ${vis.filter((r) => r.l).length} dòng nhóm này là hợp lệ — không báo lại</button></div>` : ''}
      <div class="card tw" style="max-height:60vh"><table class="t"><thead><tr><th>Quyết định</th><th>KUNN · hàng</th><th>Công cụ đang đọc</th><th>Vấn đề</th><th>Dữ liệu gốc trong file</th><th>AI đề xuất</th></tr></thead><tbody>
      ${vis.slice(0, 800).map((r) => {
        const sg = st.sug.get(r.id), l = r.l;
        const ch = l ? auChanges(l, sg) : {};
        const sev = Math.max(...r.issues.map((i) => i.sev));
        const conf = sg && sg.tin_cay != null ? Math.round(sg.tin_cay * 100) : null;
        const aiCell = !l ? '<span class="hist">Mức KUNN — kiểm tra số tiền KUNN</span>'
          : !sg ? (st.busy ? '<span class="hist"><span class="spin"></span></span>' : '<span class="hist">—</span>')
          : sg.err ? `<span class="hist" style="color:var(--err)">${esc(sg.err)}</span>`
          : `${conf != null ? `<span class="conf ${conf >= 75 ? 'hi' : conf >= 50 ? 'mid' : 'lo'}">${conf}%</span> ` : ''}${sg.ok || !Object.keys(ch).length ? '<b style="color:var(--ok)">Dòng này đúng</b>' : `<div class="diff">${Object.entries(ch).map(([f, v]) => `${AU_FIELDS.find((x) => x[0] === f)[1]}: <s>${esc(auFmt(f, l[f], l.loai_tien))}</s> → <ins>${esc(auFmt(f, v, ch.loai_tien ?? l.loai_tien))}</ins>`).join('<br>')}</div>`}<div class="hist">${esc(sg.ly_do || '')}</div>`;
        const dv = st.dec.get(r.id) || '';
        return `<tr class="${dv === 'y' ? 'ok' : dv === 'n' ? 'no' : sev >= 3 ? 'bad' : 'warn'}"><td>${l ? (sg && !sg.err ? decHtml(r.id, dv) + (!dv && (sg.tin_cay ?? 0) >= 0.75 ? '<div class="hist">AI khuyên duyệt</div>' : '') : '<span class="hist">chờ AI đề xuất</span>') : ''}</td>
          <td><b>${esc(r.k.so_kunn)}</b><div class="hist">${l ? `hàng ${esc(l.row || r.idx + 1)}` : 'cả KUNN'}</div></td>
          <td style="min-width:200px">${l ? `<div>${esc(l.ncc)}</div><div><b>${esc(l.so_hd)}</b>${l.ky_hieu ? ' · ' + esc(l.ky_hieu) : ''} · ${dd(l.ngay_hd) || '—'}</div><div class="hist">HĐ ${money(l.tien_hd, l.loai_tien) || '—'} · GN ${money(l.tien_gn, l.loai_tien) || '—'} ${esc(l.loai_tien || '')}</div>` : ''}</td>
          <td style="min-width:180px">${r.issues.map((i) => `<div><span class="pill ${i.sev >= 3 ? 'p-err' : 'p-warn'}">${BK.AUDIT[i.type].label}</span><div class="hist">${esc(i.text)}</div></div>`).join('')}</td>
          <td><div class="raw">${esc(l ? l.raw || '(bản nạp cũ — chưa lưu dữ liệu gốc)' : '')}</div></td>
          <td style="min-width:220px">${aiCell}</td></tr>`; }).join('')}
      </tbody></table></div>${vis.length > 800 ? `<div class="hist">Hiện 800/${vis.length} dòng — lọc theo loại để xem tiếp.</div>` : ''}` : ''}`;
    $$('[data-af]', m).forEach((b) => { b.onclick = () => { st.flt = b.dataset.af; draw(); }; });
    const ackB = $('#auAck', m);
    if (ackB) ackB.onclick = async () => {
      const t = st.flt;
      const list = vis.filter((r) => r.l).map((r) => ({ k: r.k, l: r.l, patch: { ack: [...new Set([...(r.l.ack || []), t])] } }));
      if (!confirm(`Xác nhận ${list.length} dòng “${BK.AUDIT[t].label}” là hợp lệ? Các dòng này sẽ không bị báo lỗi này nữa.`)) return;
      try { await src.apply(list); m.remove(); toast(`Đã xác nhận ${list.length} dòng`, 'ok'); } catch (e) { toast(errMsg(e), 'err'); }
    };
    $$('[data-dec]', m).forEach((b) => { b.onclick = () => { const id = b.dataset.dec; st.dec.set(id, st.dec.get(id) === b.dataset.v ? '' : b.dataset.v); draw(); }; });
    $$('[data-decall]', m).forEach((b) => { b.onclick = () => { for (const [id, sg] of st.sug) if (!sg.err) st.dec.set(id, b.dataset.decall); draw(); }; });
    const dai = $('[data-decai]', m); if (dai) dai.onclick = () => { for (const [id, sg] of st.sug) if (!sg.err && (sg.tin_cay ?? 0) >= 0.75 && !st.dec.get(id)) st.dec.set(id, 'y'); draw(); };
    foot();
  };
  const foot = () => {
    const n = [...st.dec.values()].filter((v) => v === 'y').length;
    $('#auGo', m).disabled = !n || st.busy;
    $('#auGo', m).textContent = n ? `Áp dụng ${n} dòng đã duyệt` : 'Duyệt dòng để áp dụng';
    $('#auAI', m).disabled = st.busy || !lineRows().length;
    $('#auF', m).textContent = st.sug.size ? `AI đã xem ${st.sug.size}/${lineRows().length} dòng · duyệt / không duyệt từng dòng (dòng AI xác nhận đúng mà bạn duyệt sẽ không bị báo lại)` : '';
  };
  $('#auAI', m).onclick = async () => {
    const todo = lineRows().filter((r) => !st.sug.has(r.id)).sort((a, b) => Math.max(...b.issues.map((i) => i.sev)) - Math.max(...a.issues.map((i) => i.sev)));
    const MAX = 400;
    if (!todo.length) return;
    if (todo.length > MAX && !confirm(`Có ${todo.length} dòng nghi vấn — AI xem trước ${MAX} dòng nặng nhất (chạy lại để xem tiếp). Tiếp tục?`)) return;
    st.busy = true; draw();
    const btn = $('#auAI', m);
    try {
      const list = todo.slice(0, MAX);
      for (let i = 0; i < list.length; i += 30) {
        btn.innerHTML = `<span class="spin"></span> AI đang xem ${Math.min(i + 30, list.length)}/${list.length} dòng…`;
        const part = list.slice(i, i + 30);
        const hdr = src.hdrOf(part[0].k);
        const r = await aiJson(promptAudit(hdr, part.map((x, j) => ({ ...x, id: String(j) }))), { thinking: 'medium', maxTokens: 30000 });
        const got = new Map((r.items || []).map((x) => [String(x.id), x]));
        part.forEach((x, j) => {
          const sg = got.get(String(j)) || { err: 'AI không trả lời dòng này' };
          st.sug.set(x.id, sg);
        });
        draw();
      }
      toast(`AI đã xem ${list.length} dòng — kiểm tra đề xuất rồi bấm Áp dụng`, 'ok');
    } catch (e) { toast(errMsg(e), 'err', 9000); }
    st.busy = false; btn.textContent = '✨ AI đề xuất cách sửa'; draw();
  };
  $('#auGo', m).onclick = async () => {
    const list = rows.filter((r) => st.dec.get(r.id) === 'y' && r.l).map((r) => {
      const sg = st.sug.get(r.id);
      const patch = auChanges(r.l, sg);
      const ack = new Set(r.l.ack || []);
      if (sg.ok || !Object.keys(patch).length) r.issues.forEach((i) => ack.add(i.type));   // AI xác nhận đúng → không báo lại
      else r.issues.forEach((i) => { if (i.type !== 'lech_cot') ack.add(i.type); });
      patch.lech = '';                                                                       // đã được người dùng duyệt
      patch.ack = [...ack];
      patch.ghi_chu = [r.l.ghi_chu, `AI rà soát ${BK.todayISO()}: ${sg.ly_do || ''}`].filter(Boolean).join(' · ').slice(0, 400);
      return { k: r.k, l: r.l, patch };
    });
    $('#auGo', m).disabled = true;
    try { await S.store.group(`Rà soát: áp dụng ${list.length} dòng`, () => src.apply(list)); m.remove(); toast(`Đã áp dụng ${list.length} dòng — bấm ↶ (Ctrl+Z) nếu muốn hoàn tác`, 'ok', 6000); }
    catch (e) { toast(errMsg(e), 'err', 9000); $('#auGo', m).disabled = false; }
  };
  $('#auX', m).onclick = () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheet(`RÀ SOÁT BẢNG KÊ — ${src.title}`, stamp(), ['SỐ KUNN', 'HÀNG', 'NHÀ CUNG CẤP', 'SỐ HĐ', 'NGÀY HĐ', 'TIỀN HĐ', 'GIẢI NGÂN', 'VẤN ĐỀ', 'DỮ LIỆU GỐC', 'AI ĐỀ XUẤT', 'LÝ DO', 'TIN CẬY'],
      rows.map((r) => { const l = r.l || {}; const sg = st.sug.get(r.id) || {}; const ch = r.l ? auChanges(r.l, sg) : {};
        return [xc(r.k.so_kunn, { b: true }), xc(l.row || ''), xc(l.ncc), xc(l.so_hd), xc(l.ngay_hd, { date: true }), xc(l.tien_hd), xc(l.tien_gn), xc(r.issues.map((i) => `${BK.AUDIT[i.type].label}: ${i.text}`).join('\n'), { wrap: true, fill: r.issues.some((i) => i.sev >= 3) ? FILL.err : FILL.warn }),
          xc(l.raw, { wrap: true }), xc(sg.ok ? 'Dòng đúng' : Object.entries(ch).map(([f, v]) => `${f}: ${v}`).join('\n'), { wrap: true }), xc(sg.ly_do, { wrap: true }), xc(sg.tin_cay)]; }),
      [16, 8, 30, 14, 12, 14, 14, 40, 50, 30, 40, 8]), 'Rà soát');
    download(wb, `RaSoat_${slug(src.title)}_${BK.todayISO()}.xlsx`);
  };
  draw();
}
function auditStored(cid) {
  const c = cust(cid); if (!c) return toast('Chọn khách hàng trước');
  const ks = S.store.kunnsOf(cid).sort((a, b) => (a.ngay_gn || '').localeCompare(b.ngay_gn || '')).map((k) => ({ ...k, _key: k.id }));
  if (!ks.length) return toast('Khách hàng chưa có KUNN nào');
  openAudit({
    title: c.name, kunns: ks, hdrOf: (k) => k.hdr || '',
    apply: async (list) => {
      const byK = new Map();
      for (const x of list) { if (!byK.has(x.k.id)) byK.set(x.k.id, []); byK.get(x.k.id).push({ id: x.l.id, ...x.patch }); }
      for (const [kid, patches] of byK) await S.store.patchLines(kid, patches, meta(), cid);
      log(cid, 'ra_soat', `Rà soát bảng kê: áp dụng ${list.length} dòng (AI đề xuất)`);
    },
  });
}
function auditImport() {
  if (!IMP.groups || !IMP.groups.length) return toast('Chưa đọc được dòng nào để rà soát');
  const ks = IMP.groups.map((g, gi) => ({ ...g, so_kunn: g.so_kunn || '(chưa số)', _key: 'g' + gi, _g: g }));
  openAudit({
    title: IMP.file, kunns: ks, hdrOf: (k) => k.hdr || '',
    apply: async (list) => {
      for (const x of list) Object.assign(x.l, x.patch);      // sửa thẳng vào dòng đang xem trước
      IMP.edited = true;
      recheck();
    },
  });
}

/** Cặp nút quyết định cho từng mục đề xuất: 'y' = duyệt, 'n' = không duyệt, '' = chưa quyết. */
const decHtml = (id, v, small) => `<span class="dec ${small ? 'sm' : ''}"><button class="y ${v === 'y' ? 'on' : ''}" data-dec="${esc(id)}" data-v="y" title="Duyệt — áp dụng thay đổi này">✓${small ? '' : ' Duyệt'}</button><button class="n ${v === 'n' ? 'on' : ''}" data-dec="${esc(id)}" data-v="n" title="Không duyệt — giữ nguyên">✗${small ? '' : ' Không'}</button></span>`;
const decCount = (ids, dec) => { let y = 0, n = 0; for (const i of ids) { const v = dec.get(i); if (v === 'y') y++; else if (v === 'n') n++; } return { y, n, u: ids.length - y - n }; };
const decBar = (c, extra = '') => `<div class="decbar"><span class="pill p-ok">✓ Duyệt ${c.y}</span><span class="pill p-err">✗ Không ${c.n}</span><span class="pill p-mute">Chưa quyết ${c.u}</span><span style="flex:1"></span>${extra}<button class="btn sm" data-decall="y">✓ Duyệt tất cả</button><button class="btn sm" data-decall="n">✗ Không duyệt tất cả</button><button class="btn sm" data-decall="">↺ Bỏ quyết định</button></div>`;

// ═════════════════ KIỂM TRA DỮ LIỆU ĐÃ NẠP (khách hàng nạp từ trước) ═════════════════
const FIX_TXT = (f) => (f.action === 'currency' ? `Gắn loại tiền ${f.currency || 'USD'} cho các dòng chưa ghi loại tiền` : f.action === 'scale' ? `Nhân số tiền các dòng × ${BK.fmtMoney(f.factor)} (đổi sang đồng)` : f.action === 'swap' ? 'Đảo cột: tiền HĐ ↔ tiền giải ngân' : f.action === 'hd_from_gn' ? 'Tiền HĐ = tiền giải ngân (cột GN là tổng các khoản của chứng từ)' : 'Giữ nguyên');
const KTYPE = { ngoai_te: 'Có thể là ngoại tệ', don_vi: 'Sai đơn vị tiền', dao_cot: 'Đảo cột tiền', cot_tong: 'Tiền HĐ chỉ là 1 phần', ai: 'AI phát hiện' };
function promptOld(c, ks, prof) {
  const pick = [...new Set([...prof.issues.map((i) => i.kid), ...ks.map((k) => k.id)])].slice(0, 60);
  const byId = new Map(ks.map((k) => [k.id, k]));
  return `Bạn là chuyên viên kiểm soát giải ngân ngân hàng Việt Nam. Dưới đây là dữ liệu bảng kê hóa đơn giải ngân ĐÃ NẠP của khách hàng "${c.name}" (nhiều khế ước nhận nợ — KUNN).
Hãy rà xem mỗi KUNN có bị sai ĐƠN VỊ TIỀN (ghi theo nghìn/triệu đồng thay vì đồng), sai LOẠI TIỀN (số tiền là USD/EUR… nhưng không ghi loại tiền — số có phần lẻ thường là ngoại tệ),
hoặc ĐẢO CỘT (tiền hóa đơn ↔ tiền giải ngân) không. So sánh độ lớn số tiền giữa các KUNN của cùng khách hàng. Chỉ đề xuất khi có căn cứ.
Hành động được phép: "currency" (gắn loại tiền, kèm currency), "scale" (nhân số tiền, kèm factor 1000 hoặc 1000000), "swap" (đảo 2 cột tiền), "hd_from_gn" (tiền HĐ đang chỉ lấy 1 khoản, vd chỉ thuế GTGT, trong khi tiền GN là tổng các khoản của chứng từ → đặt tiền HĐ = tiền GN), "none".
Trả JSON: {"items":[{"so_kunn":"…","action":"currency|scale|swap|hd_from_gn|none","currency":"USD","factor":1000,"ly_do":"ngắn, tiếng Việt","tin_cay":0.0-1.0}], "summary":"1–2 câu kết luận"}

${pick.map((id) => { const k = byId.get(id); const ls = k.lines.filter((l) => !l.lech); const s = BK.kunnSummary(k);
    return `KUNN ${k.so_kunn} · GN ${k.ngay_gn || '?'} · số tiền KUNN ${k.so_tien ?? '—'} · ${k.lines.length} dòng · tổng GN các dòng ${s.tong_gn}

async function patch(kid, patches, what) {

  try { await S.store.patchLines(kid, patches, meta(), S.cid); log(S.cid, 'sua_dong', `KUNN ${k ? k.so_kunn : ''}: ${what} (${patches.length} dòng)`); refreshSummary(); }

}

const IMP = {};
async function readWorkbook(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: false });
  const sheets = {};
  for (const n of wb.SheetNames) {
    const ws = wb.Sheets[n];
    if (!ws || !ws['!ref']) continue;
    const g = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    if (g.length) sheets[n] = g;
  }
  return sheets;
}

async function gotFile(file) {

    const pick = BK.pickSheet(IMP.sheets);

async function aiColCheck(auto) {

    const cols = BK.aiMappingToMap(r.columns || {});
    const changes = BK.FIELDS.filter((f) => r.columns && Object.prototype.hasOwnProperty.call(r.columns, f.k) && (cols[f.k] ?? null) !== (IMP.map[f.k] ?? null))
      .map((f) => ({ k: f.k, label: f.label, from: IMP.map[f.k], to: cols[f.k] }));
    IMP.colAI = { ...r, cols, changes, unitChange: r.unit && BK.UNITS[r.unit] && r.unit !== IMP.unit ? r.unit : null, curRows: (r.currency_rows || []).filter((x) => x && x.from && x.to && x.currency && !/^VN/i.test(x.currency)) };

  if (IMP.m && document.body.contains(IMP.m)) renderImport();
}

async function aiDetect(btn) {
  const old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> AI đang đọc…'; btn.disabled = true;
  try {
    // gửi sheet đang chọn + vài sheet khác có dữ liệu (không gửi cả file)
    const names = [IMP.sheet, ...Object.keys(IMP.sheets).filter((n) => n !== IMP.sheet && BK.detectHeader(IMP.sheets[n]).score > 0)].slice(0, 3);
    const r = await aiJson(promptMap(Object.fromEntries(names.map((n) => [n, IMP.sheets[n]]))));
    const sheet = IMP.sheets[r.sheet] ? r.sheet : IMP.sheet;
    IMP.sheet = sheet;
    IMP.headerRow = IMP.dataHeader = Math.max(0, (r.header_row | 0) - 1);
    IMP.map = BK.aiMappingToMap(r.columns || {});
    const k = r.kunn || {};
    const title = BK.extractTitleInfo(IMP.sheets[sheet], IMP.headerRow);
    IMP.kinfo = { so_kunn: k.so_kunn || title.so_kunn || IMP.kinfo.so_kunn || '', ngay_gn: BK.toISO(k.ngay_gn) || title.ngay_gn || IMP.kinfo.ngay_gn || '', ngay_dh: BK.toISO(k.ngay_dh) || '', so_tien_kunn: BK.parseAmount(k.so_tien) };
    IMP.aiRows = null;
    IMP.how = `AI (${aiModel()}) nhận dạng: sheet “${sheet}”, tiêu đề hàng ${IMP.headerRow + 1}`;
    IMP.aiNote = r.note || '';
    extract(); renderImport(); toast('AI đã nhận dạng cột — kiểm tra lại bảng ánh xạ', 'ok');
  } catch (e) { toast(e.message, 'err', 8000); btn.innerHTML = old; btn.disabled = false; }
}
async function aiReadAll(btn) {
  const g = IMP.sheets[IMP.sheet];
  const rows = g.map((r, i) => ({ r, i })).filter(({ r }) => r.some((v) => String(v).trim() !== ''));
  if (rows.length > 900 && !confirm(`Sheet có ${rows.length} hàng — AI đọc toàn bộ sẽ chậm và tốn lượt. Tiếp tục?`)) return;
  btn.disabled = true;
  try {
    const head = BK.gridToPrompt(g.slice(0, 12), 12, 80);
    const out = [];
    const CH = 120;
    for (let s = 0; s < g.length; s += CH) {
      btn.innerHTML = `<span class="spin"></span> AI đọc ${Math.min(s + CH, g.length)}/${g.length} hàng…`;
      const part = g.slice(s, s + CH).map((r, i) => (s + i < 12 ? [] : r));
      const text = BK.gridToPrompt([...Array(s).fill([]), ...part], CH + 20, 80);
      if (!text.trim()) continue;
      const r = await aiJson(promptRows(IMP.sheet, `PHẦN ĐẦU SHEET (để biết tiêu đề, số KUNN):\n${head}\n\nCÁC HÀNG CẦN ĐỌC:\n${text}`), { maxTokens: 60000 });
      out.push(...(r.rows || []));
    }
    IMP.aiRows = out; IMP.how = `AI (${aiModel()}) đọc toàn bộ ${out.length} dòng`;
    extract(); renderImport(); toast(`AI đọc được ${out.length} dòng`, 'ok');
  } catch (e) { toast(e.message, 'err', 8000); btn.disabled = false; btn.innerHTML = '✨ AI đọc toàn bộ'; }
}
const ERR_ST = ['da_du', 'vuot', 'trung_file'];
async function saveImport(opt = {}) {
  const m = IMP.m;
  let cid = IMP.cid;
  if (!cid) {
    const name = ($('#iNew', m).value || '').trim();
    if (!name) return toast('Chọn khách hàng hoặc nhập tên khách hàng mới', 'err');
    const ex = S.customers.find((c) => BK.fold(c.name) === BK.fold(name));
    if (ex) cid = ex.id;
    else { const c = { id: BK.uid(), name, mst: '', createdAt: Date.now(), createdBy: userName(), owner: userName(), ...meta() }; await S.store.putCustomer(c); cid = c.id; }
    IMP.cid = cid; await loadExisting(); recheck(false);
  }
  const ch = IMP.check;
  const todo = ch.groups.map((g, gi) => ({ g, gi })).filter(({ gi }) => IMP.mode[gi] !== 'skip');
  const missing = todo.filter(({ g }) => !g.so_kunn || !g.ngay_gn);
  if (missing.length) return toast('Còn KUNN thiếu số KUNN hoặc ngày giải ngân — điền ở mục “Thông tin khế ước”', 'err', 7000);
  if (ch.errors && !opt.skipErr && !opt.all && !confirm(`Có ${ch.errors} dòng bị cảnh báo giải ngân nhầm (vượt / đã GN đủ / trùng). Vẫn nạp cả các dòng này vào sổ?\n(Bấm Hủy rồi chọn “Nạp … bỏ dòng lỗi” nếu chỉ muốn nạp dòng hợp lệ.)`)) return;
  const btns = $$('#iSave, [data-save]', m); btns.forEach((b) => { b.disabled = true; }); const btn = $('#iSave', m); btn.innerHTML = '<span class="spin"></span> Đang nạp…';
  let nBo = 0;
  try {
    let n = 0, nl = 0;
    const docs = [];
    for (const { g } of todo) {
      const old = (IMP.existing || []).find((k) => BK.normKunn(k.so_kunn) === BK.normKunn(g.so_kunn));
      // thay bản cũ: giữ trạng thái hồ sơ gốc của dòng trùng hóa đơn
      const oldBy = new Map((old ? old.lines : []).map((l) => [BK.strongKey(l), l]));
      const keep = opt.skipErr ? g.lines.filter((l) => !ERR_ST.includes(l.check.status)) : g.lines;
      nBo += g.lines.length - keep.length;
      if (!keep.length) continue;
      const lines = keep.map((l) => {
        const o = oldBy.get(BK.strongKey(l));
        const c = BK.cleanLine(l);
        if (o) { c.id = o.id; if (l.goc === 'chua' && !l.thieu) { c.goc = o.goc; c.thieu = o.thieu; c.ngay_nhan = o.ngay_nhan; } if (!c.ghi_chu) c.ghi_chu = o.ghi_chu; }
        return c;
      });
      const k = { ...(old || {}), id: old ? old.id : BK.uid(), customerId: cid, so_kunn: String(g.so_kunn), ngay_gn: g.ngay_gn, ngay_dh: g.ngay_dh || '', so_tien: g.so_tien ?? null,
        han_bs: old ? old.han_bs || '' : '', ghi_chu: old ? old.ghi_chu || '' : '', source: IMP.file, hdr: g.hdr || '', lines, createdAt: old ? old.createdAt : Date.now(), createdBy: old ? old.createdBy : userName(), ...meta() };
      docs.push(k); n++; nl += lines.length;
    }
    if (!docs.length) { btns.forEach((b) => { b.disabled = false; }); btn.textContent = '⬆ Nạp vào sổ theo dõi'; return toast('Không còn dòng hợp lệ nào để nạp', 'err'); }
    await S.store.group(`Nạp ${IMP.file} (${docs.length} KUNN)`, () => S.store.putKunns(docs));
    log(cid, 'tai_bang_ke', `Nạp ${IMP.file}: ${n} KUNN, ${nl} dòng${nBo ? ` — bỏ ${nBo} dòng lỗi (đã GN / vượt / trùng)` : ch.errors ? ` (gồm ${ch.errors} dòng cảnh báo)` : ''}`);
    m.remove();
    toast(`Đã nạp ${n} KUNN, ${nl} dòng vào sổ${nBo ? ` · bỏ ${nBo} dòng lỗi` : ''}`, 'ok', 6000);
    if (docs.length === 1) openKunn(cid, docs[0].id); else { S.tab = 'kunn'; go({ cid, tab: 'so', hs: null, doc: null }); }
  } catch (e) { toast(errMsg(e), 'err', 9000); btns.forEach((b) => { b.disabled = false; }); btn.textContent = '⬆ Nạp vào sổ theo dõi'; }
}

async function restore(file) {

  const cs = d.customers.filter((c) => newer(st.c, c)), ks = d.kunn.filter((k) => newer(st.k, k)), hs = (d.hoso || []).filter((x) => newer(st.h, x));

const TPL = {

/** File Word người dùng chọn → mẫu: đã có {{…}} thì dùng luôn, chưa có thì tự nhận các trường từ bản đã điền. */
async function makeTemplate(buf, kindHint) {
  const JSZip = await jszip();
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('Không phải file Word .docx (nếu là .doc, mở bằng Word rồi Lưu thành .docx)');
  const doc = DOCX.parse(await f.async('string'));
  const kind = DOCX.guessKind(doc) || kindHint;
  if (DOCX.fieldsIn(doc).length) return { buf, kind, values: {}, found: DOCX.fieldsIn(doc), learned: false };
  const r = DOCX.learn(doc, kind);
  if (!r.found.length) throw new Error('Không nhận ra trường nào cần điền trong file này — kiểm tra lại có phải KUNN/PDGN không');
  zip.file('word/document.xml', DOCX.serialize(r.doc));
  return { buf: await zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' }), kind: r.kind || kindHint, values: r.values, found: r.found, learned: true };
}

function dropZone(id, text) {
  return `<label class="drop" id="${id}"><input type="file" multiple hidden>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
    <span>${text}</span></label>`;

function bindDrop(zone, onFiles) {
  if (!zone) return;
  const inp = $('input', zone);
  inp.onchange = () => { if (inp.files.length) onFiles([...inp.files]); inp.value = ''; };
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('over'); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
}

/** Các lần quá hạn của một KUNN: trả sau đáo hạn, đang quá hạn, quá hạn rồi được gia hạn. key ổn định để “Không tính”. */

async function pickLedger(c, choose) {
  try {
    let file = null, handle = choose ? null : await S.store.getMeta('ledgerHandle:' + c.id);
    if (handle && handle.queryPermission) { if ((await handle.queryPermission({ mode: 'read' })) !== 'granted' && (await handle.requestPermission({ mode: 'read' })) !== 'granted') handle = null; }
    if (handle) file = await handle.getFile().catch(() => null);
    if (!file && typeof window.showOpenFilePicker === 'function') {
      const [h] = await window.showOpenFilePicker({ id: 'bk-ledger', types: [{ description: 'Excel', accept: { 'application/vnd.ms-excel': ['.xls', '.xlsx', '.xlsm'] } }] });
      file = await h.getFile(); await S.store.setMeta('ledgerHandle:' + c.id, h);
    }
    if (!file) file = await new Promise((res) => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.xlsx,.xlsm,.xls'; i.onchange = () => res(i.files[0] || null); i.click(); });
    if (!file) return;
    const grids = await readWorkbook(file);
    // file mẫu QUẢN LÝ GIẢI NGÂN (có sheet KHE_UOC) → đọc thẳng
    if (Object.keys(grids).some((n) => BK.fold(n).replace(/\s/g, '_') === 'khe_uoc')) {
      const L = HSC.readLedger(grids); L.file = file.name; delete L.today;
      return saveLedger(c, L, null, file.name);
    }
    // sổ tự lập: dùng cách đọc đã lưu cho công ty; chưa có / sheet đổi tên → hộp chọn sheet & cột
    const cfg = cust(c.id).ledgerCfg;
    if (!choose && cfg && grids[cfg.sheet]) {
      try {
        const cf = HSC.relocateLedger(grids[cfg.sheet], cfg);
        const L = HSC.readLedgerSheet(grids[cfg.sheet], cf, { hm: hmOf(c) });
        if (cf.moved) toast('File đã đổi bố cục (chèn / dời cột, tiêu đề) — tool tự tìm lại cột theo tên tiêu đề', '', 6000);
        const { moved, ...keep } = cf;
        return saveLedger(c, L, { ...keep, labels: HSC.ledgerLabels(grids[cfg.sheet], keep) }, file.name);
      } catch (e) { toast(errMsg(e) + ' — chọn lại sheet / cột', 'err'); }
    }
    openLedgerDialog(c, grids, file.name, cfg);
  } catch (e) { if (e && e.name === 'AbortError') return; toast(errMsg(e), 'err', 8000); }
}

  const rec = await S.store.getFile(fileId); if (!rec) throw new Error('Không tìm thấy nội dung file trên máy này');
  const kh = cust(hs.customerId) || {};
  const text = await fileText(rec, fm.name);
  const parts = [];
  if (text == null) {
    if (rec.blob.size > 18 * 1024 * 1024) throw new Error('File quá lớn để gửi AI (> 18MB) — tách nhỏ file PDF');
    parts.push({ inline_data: { mime_type: fm.type || mimeOf(fm), data: await blobB64(rec.blob) } });
  }
  setBusy(fileId, true);
  try {
    const r = await aiJson(HSC.promptRead(fm.name, kh.name, text), { thinking: 'low', maxTokens: 16384, parts });
    const docs = HSC.normDocs(r, fileId);
    await hsPatch(hsId, (x) => { x.docs = x.docs.filter((d) => d.fileId !== fileId).concat(docs.length ? docs : [{ id: fileId + '_0', fileId, loai: 'khac', f: { mo_ta: 'AI không nhận ra chứng từ' }, conf: 0 }]); }, `AI đọc ${fm.name}`);
    toast(`AI đọc ${fm.name}: ${docs.length} chứng từ`, 'ok');
  } finally { setBusy(fileId, false); }
}

  if (d.fdl) { const r = await S.store.getFile(d.fdl); if (!r) return toast('File không có trên máy này', 'err'); const nm = (HSC.packageNames(hs, hs.files).find((x) => x.id === d.fdl) || {}).name || (hs.files.find((f) => f.id === d.fdl) || {}).name; return saveBlob(r.blob, nm); }
  if (d.kn) { V.knOff = { ...(V.knOff || {}), [hs.id]: ((V.knOff || {})[hs.id] || 0) + +d.kn }; return renderMain(); }
  if (d.knuse) {
    const so = `${$('[data-knpre]', el).value.trim()}(${parseInt($('[data-knn]', el).value, 10) || 1})${$('[data-knsuf]', el).value.trim()}`;
    if (kunnTaken(c, hs).has(kkey(so)) && !confirm(`Số ${so} đã có trong sổ / hồ sơ khác. Vẫn dùng?`)) return;
    V.knOff = { ...(V.knOff || {}), [hs.id]: 0 };
    return patch((x) => { x.so_kunn = so; }, `Lấy số KUNN ${so}`);
  }
}
function editHsLine(hsId, lineId) {
  const hs = hsGet(hsId), l0 = lineId ? hs.lines.find((q) => q.id === lineId) : null;
  const l = l0 || { ncc: '', so_hdmb: '', so_hd: '', ngay_hd: '', tien_hd: null, tien_gn: null, loai_tien: '' };
  const F = [['ncc', 'Nhà cung cấp'], ['so_hdmb', 'HĐMB / PO'], ['so_hd', 'Số hóa đơn / PO'], ['ngay_hd', 'Ngày chứng từ', 'date'], ['tien_hd', 'Tiền hóa đơn / chứng từ', 'money'], ['tien_gn', 'Số tiền giải ngân', 'money'], ['loai_tien', 'Loại tiền (trống = VND)'], ['ghi_chu', 'Ghi chú']];
  const shown = (k, ty) => (ty === 'money' ? BK.fmtMoney(l[k], l.loai_tien) : l[k] || '');
  const m = modal(`<div class="mh"><h2>${l0 ? 'Sửa dòng bảng kê' : 'Thêm dòng bảng kê'}</h2><button class="x" data-close>&times;</button></div>
    <div class="mb"><div class="grid2">${F.map(([k, lb, ty]) => `<label class="f">${lb}<input class="inp" data-lf="${k}" ${ty === 'date' ? 'type="date"' : ''} value="${esc(shown(k, ty))}"></label>`).join('')}</div>
    <div class="hist" style="margin-top:8px">Thay đổi được ghi vào lịch sử hồ sơ · sửa nhầm thì bấm ↶ để hoàn tác.</div></div>
    <div class="mf"><button class="btn" data-close>Hủy</button><button class="btn pri" id="lfSave">Lưu</button></div>`, 'sm');
  $('#lfSave', m).onclick = async () => {
    const v = {};
    $$('[data-lf]', m).forEach((i) => { const k = i.dataset.lf; if (/^tien/.test(k)) { if (i.value === shown(k, 'money')) { if (!l0) v[k] = null; return; } v[k] = i.value.trim() ? BK.parseAmount(i.value) : null; } else v[k] = k === 'loai_tien' ? i.value.trim().toUpperCase().replace(/^VN.*/, '') : i.value.trim(); });
    if (!v.so_hd && !v.ncc) return toast('Nhập ít nhất nhà cung cấp hoặc số chứng từ', 'err');
    const diff = l0 ? F.filter(([k]) => k in v && String(l0[k] ?? '') !== String(v[k] ?? '')).map(([k, lb, ty]) => `${lb}: ${ty === 'money' ? money(l0[k], l0.loai_tien) : ty === 'date' ? dd(l0[k]) : l0[k] || '—'} → ${ty === 'money' ? money(v[k], v.loai_tien ?? l0.loai_tien) : ty === 'date' ? dd(v[k]) : v[k] || '—'}`) : [];
    if (l0 && !diff.length) { m.remove(); return; }
    await hsPatch(hsId, (x) => {
      if (l0) { const q = x.lines.find((y) => y.id === lineId); Object.assign(q, v); } else x.lines.push({ ...v, id: BK.uid(10), goc: 'chua' });
    }, l0 ? `Sửa dòng ${l0.so_hd || l0.ncc}: ${diff.join('; ')}` : `Thêm dòng bảng kê ${v.so_hd} · ${v.ncc}`);
    m.remove();
  };
}

async function previewFiles(hs, fileId) {
  const files = hs.files;
  let i = Math.max(0, files.findIndex((f) => f.id === fileId));
  const urls = [];
  const m = modal(`<div class="mh"><h2 id="pvT"></h2><span style="flex:1"></span><button class="btn sm" id="pvP">‹ Trước</button><button class="btn sm" id="pvN">Sau ›</button><button class="btn sm" id="pvD">⬇ Tải</button><button class="x" data-close>&times;</button></div><div class="mb pvb" id="pvB"></div>`, 'full');
  const show = async () => {
    const f = files[i]; $('#pvT', m).textContent = `${i + 1}/${files.length} · ${f.name}`;
    const box = $('#pvB', m); box.innerHTML = '<div class="hist">Đang mở…</div>';
    const r = await S.store.getFile(f.id);
    if (!r) { box.innerHTML = '<div class="empty">File không có trên máy này (chưa đồng bộ từ thư mục chung)</div>'; return; }
    const docs = hs.docs.filter((d) => d.fileId === f.id && !d.del);
    const side = `<aside class="pvs"><b>Tool đọc được</b>${docs.map((d) => `<a class="dline" href="${hashOf({ cid: hs.customerId, hs: hs.id, doc: d.id })}" data-close><i></i><span>${esc(d.loai === 'cic' ? HSC.cicLabel(d, cust(hs.customerId) || {}, f.name).main : HSC.TYPES[d.loai].l + ' ' + (d.f.so || ''))}<small>${esc(d.loai === 'cic' ? HSC.cicLabel(d, cust(hs.customerId) || {}, f.name).sub : [d.f.ben_ban, d.f.ngay, d.f.tien && vnd(+d.f.tien)].filter(Boolean).join(' · '))}</small></span></a>`).join('') || '<div class="hist">Chưa đọc</div>'}</aside>`;
    const u = URL.createObjectURL(r.blob); urls.push(u);
    const ty = f.type || '';
    let main;
    if (/pdf/.test(ty)) main = `<iframe title="Xem file" src="${u}"></iframe>`;
    else if (/^image\//.test(ty)) main = `<div class="pvi"><img alt="" src="${u}"></div>`;
    else if (isExcel(f)) main = `<div class="pvx">${await excelHtml(r.blob)}</div>`;
    else { const tx = await fileText(r, f.name).catch(() => null); main = tx != null ? `<pre class="pvt">${esc(tx.slice(0, 20000))}</pre>` : `<div class="empty">Không xem trước được loại file này — bấm ⬇ Tải để mở bằng ứng dụng khác</div>`; }
    box.innerHTML = `<div class="pvm">${main}</div>${side}`;
  };
  $('#pvP', m).onclick = () => { i = (i - 1 + files.length) % files.length; show(); };
  $('#pvN', m).onclick = () => { i = (i + 1) % files.length; show(); };
  $('#pvD', m).onclick = async () => { const f = files[i], r = await S.store.getFile(f.id); if (r) saveBlob(r.blob, (HSC.packageNames(hs, hs.files).find((x) => x.id === f.id) || {}).name || f.name); };
  const onKey = (e) => { if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') $('#pvN', m).click(); else if (e.key === 'ArrowLeft') $('#pvP', m).click(); else if (e.key === 'Escape') m.remove(); };
  document.addEventListener('keydown', onKey); m.tabIndex = -1; m.focus();
  new MutationObserver((_, o) => { if (!m.isConnected) { urls.forEach((u) => URL.revokeObjectURL(u)); document.removeEventListener('keydown', onKey); o.disconnect(); } }).observe(document.body, { childList: true });
  show();
}

async function hsZip(hs, c) {
  const JSZip = await jszip();
  const z = new JSZip();
  const names = HSC.packageNames(hs, hs.files);
  let n = 0;
  const missing = [];
  for (const x of names) { const r = await S.store.getFile(x.id); if (r) { z.file(x.name, await r.blob.arrayBuffer()); n++; } else missing.push(x.name); }
  if (hs.lines.length && hs.pkgBk !== false) { z.file(`03_BANG_KE_CHUAN_${kunnSlug(hs.so_kunn, 'chua_so')}.xlsx`, XLSX.write(bkWorkbook(hs, c), { type: 'array', bookType: 'xlsx', compression: true })); n++; }
  if (!n) throw new Error('Không có file nào trên máy này');
  saveBlob(await z.generateAsync({ type: 'blob', compression: 'DEFLATE' }), zipName(hs, c));
  if (missing.length) toast(`Gói thiếu ${missing.length}/${names.length} file đính kèm không có trên máy này (${missing.slice(0, 3).join(', ')}${missing.length > 3 ? '…' : ''}) — kết nối thư mục chung để lấy`, 'err', 9000);
  else toast('Đã tải gói file — đưa lên hệ thống và giải ngân xong thì bấm “✓ Đã giải ngân” ở mốc cuối của hồ sơ', 'ok', 6000);
}

function openLookup(q0) {
  const m = modal(`<div class="mh"><h2>🔎 Tra hóa đơn đã giải ngân chưa</h2><button class="x" data-close>&times;</button></div><div class="mb">

    <div id="lkR"></div></div>`);
  const draw = () => {
    const raw = $('#lkQ', m).value.trim(), cid = $('#lkC', m).value;
    const nums = (raw.match(/[0-9][0-9A-Za-z./-]*/g) || []).map((x) => BK.invNo(x));
    const words = BK.fold(raw.replace(/[0-9][0-9A-Za-z./-]*/g, ' ')).split(/\s+/).filter((w) => w.length >= 2);
    if (!nums.length && !words.length) { $('#lkR', m).innerHTML = ''; return; }
    const res = [];
    for (const c of S.customers) {

        ${res.map(({ c, iv }) => `<tr ${A({ act: 'open', cid: c.id, k: iv.uses[iv.uses.length - 1].kunnId })}><td>${esc(c.name)}</td><td>${esc(iv.ncc)}</td><td><b>${esc(iv.so_hd)}</b>${iv.ky_hieu ? `<div class="hist">${esc(iv.ky_hieu)}</div>` : ''}</td><td>${dd(iv.ngay_hd)}</td><td class="num">${money(iv.tien_hd, iv.loai_tien)}</td><td class="num"><b>${money(iv.tong_gn, iv.loai_tien)}</b></td><td>${st(iv)}</td>
          <td class="hist">${iv.uses.map((u) => `KUNN ${esc(u.so_kunn)} (${dd(u.ngay_gn)}): ${money(u.tien_gn)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="verdict ok" style="margin-top:10px"><b>✓ Chưa thấy hóa đơn ${esc(raw)} trong sổ ${cid ? 'của khách hàng này' : 'của mọi khách hàng'}</b><span>Hóa đơn này chưa được giải ngân lần nào (theo dữ liệu đã nạp vào tool).</span></div>`;
  };
  let t; $('#lkQ', m).oninput = () => { clearTimeout(t); t = setTimeout(draw, 250); };

}
