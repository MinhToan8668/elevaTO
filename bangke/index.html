<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng kê Giải ngân — Theo dõi hóa đơn & hồ sơ gốc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>window.XLSX || document.write('<script src="vendor/xlsx-js-style.bundle.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>window.JSZip || document.write('<script src="vendor/jszip.min.js"><\/script>');</script>
<style>
:root{
  --navy:#002855;--blue:#005baa;--blue2:#0072ce;--blue-bg:#EAF2FA;
  --bg:#F7F3EC;--card:#fff;--card2:#FAF6EF;--ink:#20160F;--ink2:#5E5346;--ink3:#8C7E71;--line:#E6DECF;--line2:#F0EADF;
  --ok:#1F7A4D;--ok-bg:#E7F3EC;--err:#C0392B;--err-bg:#FBEAE8;--warn:#B5791A;--warn-bg:#FBF1DC;--orange:#E08A1E;
  --r:14px;--sh:0 1px 2px rgba(32,22,15,.06),0 1px 3px rgba(32,22,15,.05);--shm:0 6px 20px rgba(32,22,15,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Myriad Pro','Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hdr{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;position:sticky;top:0;z-index:50;box-shadow:var(--shm)}
.hdr-in{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:-.3px}.logo small{display:block;font-weight:400;font-size:11.5px;opacity:.7}
.hdr .sp{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:#aab}.sync.on i{background:#3ee08f}.sync.err i{background:#ff6b5b}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.26)}.hbtn.pri{background:#fff;color:var(--navy)}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.side{padding:12px;position:sticky;top:72px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:4px 4px 8px}
.inp{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;width:100%}
.inp:focus{outline:2px solid var(--blue2);outline-offset:-1px}
.clist{overflow:auto;margin-top:8px;flex:1}
.citem{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.citem:hover{background:var(--card2)}.citem.act{background:var(--blue-bg);color:var(--navy);font-weight:600}
.citem small{display:block;color:var(--ink3);font-weight:400;font-size:11.5px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.danger{color:var(--err);border-color:#f0c4be}
.btn.sm{padding:4px 9px;font-size:12px}.btn[disabled]{opacity:.45;pointer-events:none}
.main{min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph h1{font-size:22px;color:var(--navy);letter-spacing:-.3px}.ph .sub{color:var(--ink3);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:auto}
.tab{padding:9px 14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tab.act{color:var(--blue);border-color:var(--blue)}.tab .n{font-size:11px;background:var(--line2);border-radius:999px;padding:1px 7px;margin-left:4px}
.tab .n.r{background:var(--err-bg);color:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px}.kpi b{display:block;font-size:20px;color:var(--navy);margin-top:2px}.kpi span{font-size:12px;color:var(--ink3)}
.kpi.r b{color:var(--err)}.kpi.w b{color:var(--warn)}.kpi.g b{color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
.t th{background:var(--card2);color:var(--ink2);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr:hover td{background:#fffdf8}.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.bad td{background:#fff4f2}.t tr.warn td{background:#fffaf0}
.tw{overflow:auto;max-height:68vh;border-radius:var(--r)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-err{background:var(--err-bg);color:var(--err)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-info{background:var(--blue-bg);color:var(--blue)}.p-mute{background:var(--line2);color:var(--ink2)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .inp{width:auto}
.kunn{margin-bottom:8px;overflow:hidden}
.kh{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.kh:hover{background:var(--card2)}.kh b{color:var(--navy);font-size:14.5px}.kh .m{color:var(--ink3);font-size:12.5px}
.kh .sp{flex:1}.kbody{border-top:1px solid var(--line);padding:10px}
.cell-in{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;width:100%;min-width:90px}
.cell-in:hover,.cell-in:focus{border-color:var(--line);background:#fff}
select.cell-in{min-width:110px}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:1280px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.sm{max-width:620px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}.mh h2{font-size:17px;color:var(--navy);flex:1}
.mb{padding:16px 20px}.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.x{font-size:24px;line-height:1;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label.f{display:block;font-size:12px;color:var(--ink2);font-weight:600}label.f .inp{margin-top:3px;font-weight:400}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--card2)}
.drop:hover,.drop.ov{border-color:var(--blue);background:var(--blue-bg)}
.note{font-size:12.5px;color:var(--ink2);background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin:8px 0}
.note.err{background:var(--err-bg);color:var(--err);border-color:#f3cbc5}.note.ok{background:var(--ok-bg);color:var(--ok);border-color:#cfe6d8}
.note.warn{background:var(--warn-bg);color:#8a5a0c;border-color:#f0dcb0}
.sec{font-weight:700;color:var(--navy);margin:14px 0 8px;font-size:14px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.map label{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:5px 8px}
.map label span{flex:1;color:var(--ink2)}.map select{border:1px solid var(--line);border-radius:7px;padding:3px 4px;max-width:120px}
.map label.on{border-color:#b9d3ee;background:var(--blue-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shm);max-width:420px;font-size:13px}
.toast div.err{background:var(--err)}.toast div.ok{background:var(--ok)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hist{font-size:11.5px;color:var(--ink3)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.muted{color:var(--ink3)}.right{text-align:right}
/* dashboard */
.crumb{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}.crumb a{cursor:pointer;color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:1350px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.tile.crit::before{background:#d03b3b}.tile.good::before{background:#0ca30c}
.tl{font-size:12px;color:var(--ink2);font-weight:600;display:flex;gap:6px;align-items:center}
.ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--blue-bg);color:var(--blue);font-size:12px}
.tile.crit .ic{background:var(--err-bg);color:var(--err)}.tile.good .ic{background:var(--ok-bg);color:var(--ok)}
.tv{font-size:22px;white-space:nowrap;font-weight:700;color:var(--navy);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ts{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--ink3);gap:6px}
.meter{height:6px;border-radius:999px;background:#cfe0f1;overflow:hidden;margin:2px 0}.meter i{display:block;height:100%;background:var(--blue);border-radius:999px}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;margin-bottom:12px;align-items:start}
@media(max-width:1100px){.g2{grid-template-columns:1fr}}
.panel{padding:14px 16px;margin-bottom:12px}.g2 .panel{margin-bottom:0}
.panel header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.panel h3{font-size:14.5px;color:var(--navy)}.panel header p{font-size:12px;color:var(--ink3)}
.sub2{font-size:12px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
svg.viz{width:100%;height:auto;display:block}svg .ax{font-size:11px;fill:#8C7E71}svg .vl{font-size:11.5px;fill:#20160F;font-weight:600}
.seg{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden}.seg i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink)}.legend em{font-style:normal;color:var(--ink3)}
.hb{display:flex;flex-direction:column;gap:7px}.hbr{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;align-items:center;font-size:12.5px}
.hbr[data-open]{cursor:pointer}.hbr[data-open]:hover .hbl{color:var(--blue);text-decoration:underline}
.hbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hbt{display:flex;align-items:center;gap:8px}.hbt i{display:block;height:14px;border-radius:0 4px 4px 0}.hbt b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.todo{list-style:none;display:flex;flex-direction:column;max-height:300px;overflow:auto}
.todo li{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line2);cursor:pointer}.todo li:hover{background:var(--card2)}
.todo b{font-size:13px}.todo p{font-size:12px;color:var(--ink3)}.todo div{flex:1;min-width:0}.todo em{font-style:normal;font-weight:700;font-size:12.5px;white-space:nowrap}
.ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}.ti.crit{background:var(--err-bg);color:var(--err)}.ti.warn{background:var(--warn-bg);color:var(--warn)}
.okbox{padding:18px;text-align:center;color:var(--ok);background:var(--ok-bg);border-radius:10px;font-size:13px}
.mini{height:6px;border-radius:999px;background:#e9e2d4;overflow:hidden}.mini i{display:block;height:100%;background:#0ca30c}
table.click tbody tr{cursor:pointer}
.vtip{position:fixed;z-index:300;pointer-events:none;background:#14233a;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:var(--shm);display:none;max-width:320px}
.spark{display:block}
.grid-b table.t td:first-child{min-width:150px;max-width:230px}.grid-b .tw{overflow-x:auto}
.hdr-in{row-gap:8px}
.dec{display:inline-flex;gap:4px}.dec button{border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12px;background:#fff;font-weight:600;color:var(--ink2);white-space:nowrap}
.dec.sm button{padding:1px 7px}.dec button.y:hover{border-color:var(--ok);color:var(--ok)}.dec button.n:hover{border-color:var(--err);color:var(--err)}
.dec button.y.on{background:var(--ok);border-color:var(--ok);color:#fff}.dec button.n.on{background:var(--err);border-color:var(--err);color:#fff}
.decbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 8px}
.t tr.ok td{background:#f1faf4}.t tr.no td{background:#f6f4f1;color:var(--ink3)}.t tr.no td s,.t tr.no td ins{opacity:.6}
.t tr.sub>td{background:#fbf9f5;padding:8px 10px 12px 34px}
.aitab{margin-top:6px;background:#fff;border-radius:8px}
.hbtn[disabled]{opacity:.35;cursor:default}


.colchk{padding:10px 14px;margin:10px 0}.cc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cc-h b{color:var(--navy)}
.cc-l{margin:8px 0 0 18px;font-size:12.5px}.cc-l li.e{color:var(--err)}.cc-l li.w{color:#8a5a0c}
.aibox{margin-top:8px;border-radius:10px;padding:9px 12px;font-size:12.5px;border:1px solid}.aibox.ok{background:var(--ok-bg);border-color:#cfe6d8;color:var(--ok)}.aibox.warn{background:var(--blue-bg);border-color:#b9d3ee;color:var(--navy)}
.aibox ul{margin:4px 0 4px 18px}.aich{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.map label.bad{border-color:#f0c4be;background:var(--err-bg)}.map label em{display:block;font-style:normal;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

.au-sum{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.au-sum button{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;background:#fff}
.au-sum button.on{background:var(--blue);border-color:var(--blue);color:#fff}.au-sum button b{margin-left:4px}
.diff{font-size:12px;line-height:1.5}.diff s{color:var(--ink3)}.diff ins{text-decoration:none;color:var(--ok);font-weight:700}
.raw{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink3);max-width:360px;word-break:break-word}
.conf{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}.conf.hi{background:var(--ok-bg);color:var(--ok)}.conf.mid{background:var(--warn-bg);color:var(--warn)}.conf.lo{background:var(--err-bg);color:var(--err)}

.mapbox summary{cursor:pointer;list-style:none}.mapbox summary::before{content:'▸ ';color:var(--ink3)}.mapbox[open] summary::before{content:'▾ '}
.hsearch input{border:0;border-radius:9px;padding:7px 12px;width:210px;background:rgba(255,255,255,.95);color:var(--ink);font-size:13px}
.chctl{display:flex;gap:6px;flex-wrap:wrap}.chctl .inp{width:auto;padding:4px 8px;font-size:12.5px}
.verdict{border-radius:12px;padding:12px 16px;margin:6px 0 10px;display:flex;gap:12px;border:1px solid;align-items:center;flex-wrap:wrap}
.verdict>div:first-child{display:flex;flex-direction:column;gap:3px;flex:1;min-width:280px}.vact{display:flex;gap:8px;flex-wrap:wrap}
.verdict b{font-size:15px}.verdict span{font-size:12.5px}
.verdict.err{background:var(--err-bg);border-color:#f0c4be;color:var(--err)}.verdict.warn{background:var(--warn-bg);border-color:#f0dcb0;color:#8a5a0c}.verdict.ok{background:var(--ok-bg);border-color:#cfe6d8;color:var(--ok)}
.vcards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:4px}
@media(max-width:1100px){.vcards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{text-align:left;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;display:flex;flex-direction:column;gap:1px;border-top:3px solid var(--line)}
.vcard b{font-size:20px;color:var(--navy)}.vcard span{font-size:12px;font-weight:600;color:var(--ink2)}.vcard em{font-style:normal;font-size:11.5px;color:var(--ink3)}
.vcard.err{border-top-color:#d03b3b}.vcard.err:not(.zero) b{color:var(--err)}.vcard.warn{border-top-color:#fab219}.vcard.info{border-top-color:#005baa}.vcard.ok{border-top-color:#0ca30c}
.vcard.zero{opacity:.55}.vcard:not([disabled]):hover{box-shadow:var(--shm)}.vcard.on{outline:2px solid var(--blue);background:var(--blue-bg)}

.grid-a{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:12px;align-items:stretch}
@media(max-width:1100px){.grid-a{grid-template-columns:1fr}}
.grid-a .panel{margin-bottom:0;display:flex;flex-direction:column}.grid-a .pbody{flex:1;min-height:0}
.grid-b{height:470px}.grid-b .panel{min-height:0;overflow:hidden}.grid-b .pbody{overflow:auto}
.grid-b .tw{max-height:none;overflow:visible}.grid-b .todo{max-height:none}
@media(max-width:1100px){.grid-b{height:auto}.grid-b .pbody{max-height:420px}}
.lnk{color:var(--blue);font-weight:600;font-size:12.5px;white-space:nowrap;padding:2px 0}.lnk:hover{text-decoration:underline}
.go{cursor:pointer}
.tile.go{transition:box-shadow .15s,transform .15s}.tile.go:hover{box-shadow:var(--shm);transform:translateY(-1px)}
.tgo{font-size:11.5px;color:var(--blue);font-weight:600;opacity:0;transition:opacity .15s;margin-top:2px}.tile.go:hover .tgo{opacity:1}
svg .hit.go{cursor:pointer}svg .hit.go:hover{fill:rgba(0,91,170,.06)}
.seg i[data-act]{cursor:pointer}.seg i[data-act]:hover{filter:brightness(.92)}
.legend span.go:hover{color:var(--blue)}
.hbr.go:hover .hbl{color:var(--blue);text-decoration:underline}
.ib{height:8px;border-radius:0 4px 4px 0;background:transparent;margin-top:4px}.ib i{display:block;height:100%;background:#005baa;border-radius:0 4px 4px 0}
.kunn.flash{box-shadow:0 0 0 3px #0072ce}
.kbody .t td:nth-child(3){min-width:230px}.kbody .t td:nth-child(4){min-width:160px}



/* ── soạn KUNN & PDGN ── */
.mbox.full{max-width:none;width:calc(100vw - 24px);height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden}
.modal:has(.mbox.full){padding:12px;align-items:stretch}
.hs{flex:1;min-height:0;display:grid;grid-template-columns:400px minmax(0,1fr)}
.hs-side{overflow:auto;border-right:1px solid var(--line);padding:10px 12px;background:var(--card2)}
.hs-doc{display:flex;flex-direction:column;min-width:0;min-height:0}.hs-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px}
.hs-legend{font-size:12px;color:var(--ink2);padding:6px 14px;border-bottom:1px solid var(--line2)}.hs-legend .df{cursor:default}.lg-ed{background:#fff6cc;padding:0 4px}
.hs-scroll{flex:1;overflow:auto;background:#e9e5de;padding:18px;position:relative}
.dpage{background:#fff;margin:0 auto 24px;box-shadow:0 2px 10px rgba(0,0,0,.18);color:#000;line-height:1.17;min-height:1000px}
.dpage .dp{outline:none;white-space:pre-wrap;word-wrap:break-word;min-height:1em;border-radius:2px;tab-size:36px}
.dpage .dp:hover{box-shadow:0 0 0 1px #d5e3f3}.dpage .dp:focus{box-shadow:0 0 0 1px #6aa3dc;background:#f7fbff}
.dpage .dp.ed{background:#fff6cc}
.dpage .dn{display:inline-block;min-width:26px;padding-right:6px;text-indent:0}
.dpage table.dt{border-collapse:collapse;table-layout:fixed;margin:2px 0}.dpage td{padding:1px 5px;word-wrap:break-word}
.dpage td .dp{margin:0!important}
.df{color:#d40000;font-weight:inherit;cursor:pointer;border-bottom:1px dashed #e88;white-space:pre-wrap}
.df:hover{background:#ffe8e8}.df.empty{border-bottom:0}.df.empty::before{content:attr(data-ph);color:#d40000;background:#ffecec;font-style:italic;font-size:.9em;padding:0 3px;border:1px dashed #e88;border-radius:3px}
.dc{cursor:pointer}.dc:hover{background:#e6f0fb}
.rowbar{position:absolute;display:none;gap:2px;z-index:5}.rowbar button{background:#fff;border:1px solid var(--line);border-radius:6px;font-size:11px;padding:1px 5px;box-shadow:var(--sh)}.rowbar button:hover{background:var(--blue-bg)}
.hs-box{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:9px;font-size:12.5px}
.hs-box.bad{border-color:#f0c4be}.hs-box.warn{border-color:#f0dcb0}.hs-box.ok{border-color:#cfe6d8}
.hs-tpl{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}.hs-tpl>span{flex:1}
.hs-ck{list-style:none;margin:6px 0;max-height:220px;overflow:auto}.hs-ck li{padding:3px 0;cursor:pointer;border-bottom:1px dashed var(--line2)}.hs-ck li.e{color:var(--err)}.hs-ck li.w{color:#8a5a0c}.hs-ck li.o{color:var(--ok)}
.hg{background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 10px;margin-bottom:9px}.hg summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:13px;padding:3px 0}
.hf{display:block;font-size:11.5px;color:var(--ink2);margin:6px 0}.hf>span{display:block;font-weight:600}.hf .inp{padding:5px 8px;font-size:13px;margin-top:2px}
.hf em{font-style:normal;font-size:10.5px;background:var(--line2);border-radius:5px;padding:0 5px;margin-left:4px;font-weight:600}.hf em.ov{background:var(--warn-bg);color:#8a5a0c}
.hf.used>span::after{content:' •';color:#d40000}.hf.auto .inp{color:#d40000;background:#fffafa}
.t.hl td{padding:2px 3px}.t.hl .cell-in{min-width:70px;font-size:12px}
.fpop{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shm);padding:10px 12px;width:330px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hs-empty{max-width:640px;margin:40px auto;padding:22px}.hs-empty h3{color:var(--navy);margin-bottom:8px}.hs-empty p{margin-bottom:8px;font-size:13px}.hs-empty .err,.hs-tpl .err{color:var(--err)}
</style>

<body>
<header class="hdr"><div class="hdr-in">
  <div class="logo">Bảng kê Giải ngân<small>Theo dõi hóa đơn giải ngân · hồ sơ gốc</small></div>
  <span class="sync" id="syncPill" title="Thư mục chung của team (đồng bộ nhiều máy)"><i></i><span>Chỉ trên máy này</span></span>
  <div class="sp"></div>
  <form id="qInv" class="hsearch" autocomplete="off"><input id="qInvT" placeholder="🔎 Tra hóa đơn: số HĐ, NCC…" title="Hóa đơn này đã giải ngân chưa? Gõ số hóa đơn (có thể kèm tên NCC) rồi Enter"></form>
  <button class="hbtn" id="bCheck">🔍 Kiểm tra bảng kê</button>
