    ${(() => { const kt = keyTable(); return `<div class="hist" style="margin-bottom:6px">${kt ? `✓ Đã nạp bảng key${kt.src ? ` từ <b>${esc(kt.src)}</b>` : ''}${kt.at ? ` lúc ${new Date(kt.at).toLocaleString('vi-VN')}` : ''} — tool tự tính TestKey trong hồ sơ và KUNN theo mã TTKD, ngày GN, số tiền.` : 'Chưa nạp bảng key. Chọn file Excel / .json / file HTML công cụ TestKey cũ; có logic / bảng key mới thì chọn file đó — AI đọc hiểu (cần API key Gemini).'} Bảng key chỉ lưu trên máy này.</div>
      <div class="bar"><button class="btn" id="skTk">🔑 ${kt ? 'Đổi' : 'Nạp'} bảng key / logic TestKey</button>${kt ? '<button class="btn" id="skTkTry">Thử tính</button><button class="btn danger" id="skTkDel">Gỡ bảng key</button>' : ''}</div>`; })()}
    <div id="skMsg" class="hist" style="margin-top:8px"></div></div>
    <div class="mf"><button class="btn" data-close>Đóng</button><button class="btn pri" id="skSave">Lưu cài đặt</button></div>`, 'sm');
  $('#skTk', m).onclick = () => { m.remove(); pickKeyFile(() => { renderMain(); openSettings(); }); };
  if ($('#skTkTry', m)) $('#skTkTry', m).onclick = () => { const kt = keyTable(); m.remove(); keyPreview(kt, kt.src || 'bảng key đang dùng', 'đã nạp trên máy này', '', () => openSettings()); };
  if ($('#skTkDel', m)) $('#skTkDel', m).onclick = () => { if (!confirm('Gỡ bảng key TestKey khỏi máy này?')) return; lsSet(TK_LS, ''); m.remove(); toast('Đã gỡ bảng key', 'ok'); openSettings(); };
  const collect = () => {
    $$('[data-on]', m).forEach((cb) => { o.keys[+cb.dataset.on].on = cb.checked; });
    const a = $('input[name=sk-act]:checked', m); if (a) o.active = +a.value;
    o.model = $('#skModel', m).value;
  };
  $('#skAdd', m).onclick = () => {
    collect();
    const ks = ($('#skKey', m).value || '').split(/[\s,;]+/).map((x) => x.trim()).filter((x) => x.length > 15);
    if (!ks.length) return toast('Chưa dán key hợp lệ', 'err');
    ks.forEach((k, i) => { if (!o.keys.some((x) => x.key === k)) o.keys.push({ key: k, name: ($('#skName', m).value || '').trim() + (ks.length > 1 ? ` #${i + 1}` : ''), on: true }); });
    aiSave(o); m.remove(); openSettings(); toast(`Đã thêm ${ks.length} key`, 'ok');
  };
  $$('[data-del]', m).forEach((b) => b.onclick = () => { collect(); o.keys.splice(+b.dataset.del, 1); if ((o.active | 0) >= o.keys.length) o.active = 0; aiSave(o); m.remove(); openSettings(); });
  $$('[data-test]', m).forEach((b) => b.onclick = async () => {
    collect(); const i = +b.dataset.test, out = $(`[data-res="${i}"]`, m); out.textContent = 'đang thử…';
    const body = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Trả lời đúng một chữ: OK' }] }], generationConfig: { maxOutputTokens: 64 } });
    let ok = '', why = '';
    for (const gw of AI_GATEWAYS) {
      try { const r = await fetch(gw(o.model || AI_MODEL_FALLBACK, o.keys[i].key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        if (r.ok) { ok = gw === AI_GATEWAYS[0] ? 'Vertex' : 'Gemini API'; break; }
        const t = await r.text(); why = `${r.status}: ${(t.match(/"message":\s*"([^"]{0,120})/) || [, t.slice(0, 120)])[1]}`;
      } catch (e) { why = 'mạng chặn'; }
    }
    out.textContent = ok ? `✓ chạy được (${ok})` : `✗ ${why}`; out.style.color = ok ? 'var(--ok)' : 'var(--err)';
  });
  renderSyncBox(m);
  $('#skBackup', m).onclick = () => backup().catch((e) => toast(e.message, 'err'));
  $('#skRestore', m).onclick = () => { m.remove(); $('#fileRestore').click(); };
  $('#skUser', m).onchange = (e) => lsSet(LS.user, e.target.value.trim());
  $('#skSave', m).onclick = async () => {
    collect(); aiSave(o);
    lsSet(LS.user, $('#skUser', m).value.trim());
    const nf = ($('input[name=sk-nf]:checked', m) || {}).value || 'us'; lsSet('bangke_numfmt', nf); BK.setNumFmt(nf);
    const hanV = String(Math.max(1, +$('#skHan', m).value || 30)); lsSet(LS.han, hanV);
    const holV = $('#skHol', m).value; lsSet(HOL_LS, holV);
    await setTeamCfg({ han: +hanV, hol: holV }).catch(() => {});
    m.remove();
    toast('Đã lưu cài đặt', 'ok');
    renderMain();
  };
  if (focus === 'ai') setTimeout(() => $('#skKey', m).focus(), 50);
}
function renderSyncBox(m) {
  const box = $('#syncBox', m); if (!box) return;
  const sy = S.sync; if (!sy) return;
  const st = sy.state;
  const chips = Object.entries(sy.people || {}).map(([n, c]) => `<span class="pill p-info">${esc(n)} <b>${c}</b></span>`).join(' ');
  const info = st === 'on' ? `<b>✓ Đang kết nối: ${esc(sy.name)}</b>${sy.busy ? `<div class="hist" style="color:var(--blue)"><span class="spin"></span> ${esc(sy.busy)}</div>` : ''}<div class="hist">Lần đồng bộ cuối: ${sy.last ? new Date(sy.last).toLocaleString('vi-VN') : '—'} · ${sy.nFiles} tệp trong thư mục</div><div class="chips">${chips}</div>`
    : st === 'reconnect' ? `<b>Thư mục “${esc(sy.name)}” cần cấp quyền lại</b><div class="hist">Trình duyệt hỏi lại quyền mỗi lần mở file — bấm “Kết nối lại”.</div>`
    : st === 'error' ? `<b style="color:var(--err)">Lỗi thư mục chung</b><div class="hist">${esc(sy.err)}</div>`
    : '<b>Chưa kết nối thư mục chung</b><div class="hist">Dữ liệu đang chỉ lưu trên trình duyệt máy này.</div>';
  const btns = st === 'on' ? '<button class="btn pri" data-sy="pull">Đồng bộ ngay</button><button class="btn" data-sy="push">Gửi toàn bộ kho lên</button><button class="btn" data-sy="pick">Đổi thư mục</button><button class="btn danger" data-sy="off">Ngắt kết nối</button>'
    : st === 'reconnect' ? '<button class="btn pri" data-sy="re">Kết nối lại</button><button class="btn" data-sy="pick">Chọn thư mục khác</button><button class="btn danger" data-sy="off">Ngắt kết nối</button>'
    : '<button class="btn pri" data-sy="pick">📁 Chọn thư mục chung</button>' + (st === 'error' ? '<button class="btn danger" data-sy="off">Ngắt kết nối</button>' : '');
  box.innerHTML = !sy.supported
    ? '<div class="note err">Trình duyệt này không hỗ trợ chọn thư mục. Mở file bằng <b>Chrome</b> hoặc <b>Edge</b> trên máy tính. Tạm thời dùng Sao lưu / Nạp sao lưu để chuyển dữ liệu.</div>'
    : `<div class="card" style="padding:12px 14px;border-left:4px solid ${st === 'on' ? 'var(--ok)' : st === 'off' ? 'var(--line)' : 'var(--err)'}">${info}<div class="bar" style="margin:10px 0 0">${btns}</div></div>`;
  $$('[data-sy]', box).forEach((b) => { b.onclick = () => syncAction(b.dataset.sy, b); });
}
async function syncAction(a, btn) {
  const sy = S.sync;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + btn.textContent; }
  try {
    if (a === 'pick') {
      await sy.pick();
      toast(`Đã kết nối thư mục “${sy.name}”`, 'ok');
      if (S.store.customers().length && confirm('Gửi toàn bộ dữ liệu đang có trên máy này lên thư mục chung để cả team thấy?')) sy.pushAll().then((n) => toast(`Đã gửi ${n} hồ sơ lên thư mục chung`, 'ok')).catch((e) => toast(errMsg(e), 'err', 9000));
    } else if (a === 're') { await sy.reconnect(); if (sy.state === 'on') toast('Đã kết nối lại thư mục chung', 'ok'); }
    else if (a === 'pull') { const n = await sy.pull(); await sy.flush(); if (!n) toast('Đã đồng bộ — không có gì mới'); }
    else if (a === 'push') { const n = await sy.pushAll(); toast(`Đã gửi ${n} hồ sơ lên thư mục chung`, 'ok'); }
    else if (a === 'off') { if (confirm('Ngắt kết nối thư mục chung? Dữ liệu trên máy này vẫn giữ nguyên.')) await sy.disconnect(); }
  } catch (e) {
    if (e.name === 'AbortError') toast('Đã hủy chọn thư mục');
    else if (e.name === 'SecurityError' || e.name === 'NotAllowedError') toast('Trình duyệt không cho dùng thư mục này (thư mục hệ thống, hoặc bạn bấm “Không cho phép”). Chọn một thư mục con trong ổ chung, vd Z:\\BangKe, rồi bấm “Cho phép sửa”.', 'err', 12000);
    else toast(errMsg(e), 'err', 9000);
  }
  if ($('#syncBox')) renderSyncBox(document);
}
$('#bSettings').onclick = () => openSettings();
$('#bCoPick').onclick = () => openCompanyPicker();
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { if (document.querySelector('.modal')) return; e.preventDefault(); openCompanyPicker(); } });
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('.hsrow[data-href]')) { e.preventDefault(); location.hash = e.target.dataset.href; } });
function themeIcon() { const d = document.documentElement.dataset.theme === 'dark'; $('#bTheme').textContent = d ? '☾' : '☀'; }
$('#bTheme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; lsSet('bangke_theme', r.dataset.theme); themeIcon(); };
themeIcon();
function renderHist() {
  const st = S.store; if (!st) return;
  const u = st.undoS[st.undoS.length - 1], r = st.redoS[st.redoS.length - 1];
  $('#bUndo').disabled = !u; $('#bRedo').disabled = !r;
  $('#bUndo').title = u ? `Hoàn tác: ${u.label} (Ctrl+Z)` : 'Không có gì để hoàn tác';
  $('#bRedo').title = r ? `Làm lại: ${r.label} (Ctrl+Y)` : 'Không có gì để làm lại';
}
async function doUndo(redo) {
  const st = S.store; if (!st) return;
  const e = redo ? await st.redo() : await st.undo();
  if (!e) return toast(redo ? 'Không có gì để làm lại' : 'Không có gì để hoàn tác');
  toast(`${redo ? '↷ Đã làm lại' : '↶ Đã hoàn tác'}: ${e.label}`, 'ok');
  const cids = new Set((e.items || []).map((it) => { const r = it.after || it.before || {}; return it.type === 'kh' ? r.id : r.customerId; }).filter(Boolean));
  if (!cids.size && S.cid) cids.add(S.cid);
  for (const cid of cids) log(cid, redo ? 'lam_lai' : 'hoan_tac', `${redo ? 'Làm lại' : 'Hoàn tác'}: ${e.label}`);
}
$('#bUndo').onclick = () => doUndo(false);
$('#bRedo').onclick = () => doUndo(true);
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;   // để ô nhập tự hoàn tác chữ
  const k = e.key.toLowerCase();
  if (HE && (k === 'z' || k === 'y')) { e.preventDefault(); return wUndo(k === 'y' || e.shiftKey ? 1 : -1); }
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(false); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); doUndo(true); }
});
$('#syncPill').onclick = () => { if (S.sync && S.sync.state === 'reconnect') syncAction('re'); else openSettings(); };
document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'F9') { e.preventDefault(); openSettings(); } });

window.BKAPP = { exportDashboard, state: S, buildCustomerWorkbook };
startStore().catch((e) => { console.error(e); toast('Lỗi khởi động: ' + e.message, 'err', 10000); });
// cổng cho bài kiểm tra tự động (không dùng trong giao diện)
window.BKAPP = { S, cust, selectCustomer, makeTemplate, TPL, openHoSo, bankMemo };
})();
</script>
