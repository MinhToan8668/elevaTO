<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px; width: 230px; font: 13px system-ui, sans-serif; background: #111; color: #eee; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { display: block; width: 100%; margin: 4px 0; padding: 8px 10px; text-align: left;
           border: 1px solid #333; border-radius: 8px; background: #1c1c1c; color: inherit; cursor: pointer; }
  button:hover { background: #262626; }
  button.on { border-color: #ff4e45; background: #2a1514; }
  small { display: block; color: #999; }
  label { display: flex; justify-content: space-between; margin-top: 12px; }
  .chk { align-items: center; gap: 8px; cursor: pointer; }
  .chk input { accent-color: #ff4e45; width: 16px; height: 16px; }
  input[type=range] { width: 100%; accent-color: #ff4e45; }
</style>
</head>
<body>
  <h1>Chế độ viền video</h1>
  <div id="list"></div>
  <label>Độ mờ <span id="blurVal"></span></label>
  <input type="range" id="blur" min="0" max="200" step="5">
  <label>Độ sáng <span id="lightVal"></span></label>
  <input type="range" id="light" min="20" max="200" step="5">
  <label class="chk"><span>Loe sáng xuống dưới (chế độ rạp)</span><input type="checkbox" id="spill"></label>
  <script src="popup.js"></script>
</body>
</html>
